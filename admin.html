<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1C211E">
<meta name="robots" content="noindex">
<title>SFO Tracker — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C211E; --ink-soft:#4F574F; --ink-faint:#5F675F;
  --paper:#F4F5F1; --line:#D5D9D1;
  --leaf:#17653A; --leaf-soft:#2E8A55; --flag:#FF5A1F;
  --issue:#C0442C; --warn:#A8740F;
  --chip-ok-bg:#D8EEDD; --chip-ok-fg:#145A32; --chip-bad-bg:#F4D4CC; --chip-bad-fg:#9C3B26; --chip-mute-bg:#E9EAE6;
  --chip-warn-bg:#F6E8C3; --chip-warn-fg:#6B4A00;
  --radius-md:6px; --radius-sm:4px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:40px;}
button{font-family:inherit;cursor:pointer;background:none;border:none;min-height:44px;color:inherit;}
button:disabled{cursor:default;}
input,textarea,select{font-family:inherit;font-size:15px;}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;}
.ic{display:block;flex-shrink:0;}
.hidden{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* Headings and numbers use condensed Archivo, matching the main app. */
.display,.gate-card h1,#signin-screen h1,#top-bar h1,.sec-title,.edit-card h2,.site-row .name,.visit-row .name,.ov-card .title,.counter .num,.modal h2{
  font-stretch:72%;font-weight:800;letter-spacing:.01em;}

/* Offline banner */
.offline-banner{position:sticky;top:0;z-index:20;background:var(--chip-warn-bg);color:var(--chip-warn-fg);border-bottom:2px solid var(--warn);padding:10px 16px;font-size:14px;font-weight:600;line-height:1.4;}

/* Sign in + gate */
#signin-screen,#gate-screen{padding:48px 22px;max-width:420px;margin:0 auto;}
#signin-screen h1,.gate-card h1{font-size:34px;line-height:1.05;margin:0 0 8px;}
#signin-screen p,.gate-card p{color:var(--ink-soft);font-size:15px;margin:0 0 24px;line-height:1.5;}
.gate-card .gate-actions{display:flex;gap:8px;flex-wrap:wrap;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],input[type=search],textarea,select{
  width:100%;min-height:44px;border:1px solid var(--ink-faint);border-radius:var(--radius-sm);padding:12px 13px;background:#fff;color:var(--ink);}
input:disabled,select:disabled{background:var(--chip-mute-bg);color:var(--ink-soft);}
.btn-primary{width:100%;border-radius:var(--radius-md);padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--leaf);margin-top:4px;}
.btn-primary:disabled{opacity:.6;}
.btn-link{color:var(--leaf);font-weight:700;font-size:14px;text-decoration:underline;padding:0 4px;}
#signin-status{margin-top:12px;font-size:14px;color:var(--issue);white-space:pre-wrap;}
#signin-status.ok{color:var(--leaf);font-weight:600;}

/* Top bar + tabs */
#top-bar{background:var(--ink);color:#fff;padding:16px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:4px solid var(--flag);}
#top-bar h1{font-size:26px;line-height:1.05;margin:0 0 4px;}
#top-bar .sub{font-size:13px;color:rgba(255,255,255,.8);overflow-wrap:anywhere;}
#top-bar :focus-visible{outline-color:#fff;}
#signout-btn,.btn-outline{color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:var(--radius-sm);padding:9px 14px;font-size:14px;font-weight:600;flex-shrink:0;}
.gate-card .btn-outline{color:var(--ink);border-color:var(--ink-faint);}
#tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);background:var(--paper);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.tab-btn{flex:0 0 auto;min-height:48px;padding:0 16px;font-size:15px;font-weight:700;color:var(--ink-soft);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--flag);}
.panel{background:var(--paper);padding:18px 16px;min-height:300px;}
.sec-title{font-size:18px;color:var(--ink);border-top:3px solid var(--ink);padding-top:8px;margin:26px 0 12px;}
.sec-title:first-child{margin-top:0;}
.hint{font-size:14px;color:var(--ink-soft);line-height:1.5;margin:0 0 14px;}
.loading{font-size:14px;color:var(--ink-soft);padding:14px 0;}
.err-banner{background:var(--chip-bad-bg);color:var(--chip-bad-fg);border-left:6px solid var(--issue);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.5;}
.err-banner .btn-link{color:var(--chip-bad-fg);}
.empty{font-size:14px;color:var(--ink-soft);border:1px dashed var(--ink-faint);border-radius:var(--radius-md);padding:16px;text-align:center;background:#fff;}

/* Search + list */
.search-bar{display:flex;align-items:center;gap:8px;border:1px solid var(--ink-faint);background:#fff;border-radius:var(--radius-sm);padding:0 12px;min-height:44px;margin-bottom:12px;}
.search-bar:focus-within{outline:2px solid var(--leaf);outline-offset:2px;}
.search-bar input{border:none;outline:none;flex:1;font-size:15px;padding:10px 0;background:none;min-width:0;}
.search-bar .ic{color:var(--ink-faint);}
.toolbar{display:flex;gap:8px;margin-bottom:12px;}
.btn-add{background:var(--ink);color:#fff;border-radius:var(--radius-md);padding:0 16px;font-size:15px;font-weight:700;}
.site-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--radius-md);padding:12px 13px;margin-bottom:8px;width:100%;text-align:left;background:#fff;min-height:44px;}
.site-row.editing{border-left-color:var(--flag);border-color:var(--ink);}
.site-row.closed{opacity:.75;}
.site-row .name{font-size:19px;line-height:1.1;overflow-wrap:anywhere;}
.site-row .meta{font-size:13px;color:var(--ink-soft);margin-top:3px;overflow-wrap:anywhere;}
.site-row .flag{color:var(--issue);font-size:12px;font-weight:700;margin-left:8px;white-space:nowrap;}
.site-row .flag.ok{color:var(--chip-ok-fg);}
.sep{display:inline-block;width:1px;height:.85em;background:currentColor;opacity:.35;margin:0 .6em;vertical-align:-.1em;}

/* Chips */
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:var(--radius-sm);padding:3px 8px;line-height:1.3;}
.chip-ok{background:var(--chip-ok-bg);color:var(--chip-ok-fg);}
.chip-bad{background:var(--chip-bad-bg);color:var(--chip-bad-fg);}
.chip-mute{background:var(--chip-mute-bg);color:var(--ink-soft);}
.chip-warn{background:var(--chip-warn-bg);color:var(--chip-warn-fg);}

/* Edit panel */
.edit-card{background:#fff;border:2px solid var(--ink);border-radius:var(--radius-md);padding:16px;margin-bottom:18px;}
.edit-card h2{font-size:24px;line-height:1.1;margin:0 0 14px;overflow-wrap:anywhere;}
.edit-grid{display:flex;flex-direction:column;gap:2px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-note{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.4;overflow-wrap:anywhere;}
.edit-actions{display:flex;gap:8px;margin-top:12px;}
.btn-save{flex:1;background:var(--leaf);color:#fff;border-radius:var(--radius-md);padding:13px;font-size:15px;font-weight:700;}
.btn-save:disabled{opacity:.5;}
.btn-cancel{border:1px solid var(--ink-faint);border-radius:var(--radius-md);padding:13px 18px;font-size:15px;font-weight:600;color:var(--ink);background:#fff;}
.btn-secondary{border:1px solid var(--ink);border-radius:var(--radius-md);padding:0 14px;font-size:14px;font-weight:700;color:var(--ink);background:#fff;}
.btn-secondary:disabled{opacity:.6;}
.btn-danger{background:var(--issue);color:#fff;border-radius:var(--radius-md);padding:0 18px;font-size:15px;font-weight:700;}
.save-msg{font-size:14px;margin-top:10px;line-height:1.4;}
.save-msg.ok{color:var(--leaf);font-weight:600;}
.save-msg.err{color:var(--issue);font-weight:600;}

/* Filters + visits */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.filters .wide{grid-column:1 / -1;}
.filters .field{margin-bottom:6px;}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer;}
.toggle input{width:24px;height:24px;margin:0;accent-color:var(--leaf);flex-shrink:0;}
.notice{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip-warn-bg);color:var(--chip-warn-fg);border-radius:var(--radius-md);padding:6px 6px 6px 12px;margin-bottom:10px;font-size:14px;font-weight:600;}
.notice .btn-link{color:var(--chip-warn-fg);}
.count-line{font-size:13px;color:var(--ink-soft);margin:6px 0 10px;}
.visit-row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--radius-md);padding:12px 13px;margin-bottom:8px;background:#fff;width:100%;text-align:left;font:inherit;}
.visit-row.open{border-left-color:var(--flag);border-color:var(--ink);}
.visit-row .ic{align-self:center;color:var(--ink-faint);}
.visit-row.flagged{border-left-color:var(--issue);}
.visit-row .v-main{flex:1;min-width:0;}
.visit-row .name{font-size:19px;line-height:1.1;overflow-wrap:anywhere;}
.visit-row .meta{font-size:13px;color:var(--ink-soft);margin-top:3px;overflow-wrap:anywhere;}
.visit-row .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.btn-del{border:1px solid var(--issue);color:var(--issue);border-radius:var(--radius-sm);padding:0 12px;font-size:13px;font-weight:700;background:#fff;flex-shrink:0;}
.more-btn{width:100%;margin-top:4px;}

/* Team */
details.add-card{background:#fff;border:1px solid var(--ink);border-radius:var(--radius-md);margin-top:18px;}
details.add-card summary{min-height:44px;display:flex;align-items:center;padding:0 14px;font-weight:700;cursor:pointer;}
details.add-card .inner{padding:0 14px 14px;}

/* Import */
textarea#import-text{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre;}
.import-row{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding:10px 0;font-size:15px;}
.import-row .chip{flex-shrink:0;margin-top:2px;}
.chip-update{background:var(--chip-ok-bg);color:var(--chip-ok-fg);}
.chip-nochange{background:var(--chip-mute-bg);color:var(--ink-soft);}
.chip-unmatched,.chip-invalid{background:var(--chip-bad-bg);color:var(--chip-bad-fg);}
.import-row .cell{flex:1;min-width:0;overflow-wrap:anywhere;}
.import-row .diffs{font-size:13px;color:var(--ink-soft);margin-top:2px;}

/* Oversight */
.ov-card{background:#fff;border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:9px;}
.ov-card.ok{border-left-color:var(--leaf-soft);}
.ov-card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.ov-card .title{font-size:18px;line-height:1.15;}
.ov-card .badge{font-size:13px;font-weight:700;color:var(--warn);flex-shrink:0;}
.ov-card.ok .badge{color:var(--leaf);}
.ov-card .sub{font-size:13px;color:var(--ink-soft);margin-top:3px;overflow-wrap:anywhere;}
.ov-card ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.ov-card .card-actions{margin-top:4px;}
.counters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:12px;}
.counter{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:64px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:8px 10px;text-align:left;width:100%;}
button.counter{cursor:pointer;}
.counter .num{font-size:28px;line-height:1;}
.counter .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;line-height:1.2;}
.counter.alert .num{color:var(--issue);}

/* Program */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:8px 0 0;}
.kv dt{color:var(--ink-soft);font-weight:600;}
.kv dd{margin:0;overflow-wrap:anywhere;}

/* Teams */
.team-card{background:#fff;border:1px solid var(--line);border-left:6px solid var(--leaf-soft);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;}
.team-card.unassigned{border-left-color:var(--warn);}
.team-card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.team-card .title{font-stretch:72%;font-weight:800;font-size:20px;line-height:1.1;overflow-wrap:anywhere;}
.team-card .badge{font-size:13px;font-weight:700;color:var(--leaf);flex-shrink:0;}
.team-card.unassigned .badge{color:var(--warn);}
.team-card .sub{font-size:13px;color:var(--ink-soft);margin-top:3px;overflow-wrap:anywhere;}
.fa-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0;margin-top:8px;}
.fa-row + .fa-row{margin-top:0;}
.fa-main{flex:1;min-width:0;}
.fa-name{font-weight:700;font-size:16px;overflow-wrap:anywhere;}
.fa-meta{font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
.fa-meta .bad{color:var(--issue);font-weight:700;}
.fa-row select{width:46%;min-width:140px;flex-shrink:0;}
.team-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.team-actions button{min-height:44px;}

/* Visit detail */
.dl-h{font-stretch:72%;font-weight:800;font-size:17px;margin:18px 0 4px;border-top:3px solid var(--ink);padding-top:8px;}
.dl-row{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4;}
.dl-k{color:var(--ink-soft);font-weight:600;}
.dl-v{overflow-wrap:anywhere;}
.dl-v a,.detail-links a{color:var(--leaf);font-weight:700;}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:6px;}
.photos a{display:block;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff;color:var(--ink);text-decoration:none;}
.photos img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--chip-mute-bg);}
.photos span{display:block;font-size:11px;padding:4px 6px;color:var(--ink-soft);overflow-wrap:anywhere;}
.notes-list{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.5;}
.notes-list li{margin-bottom:4px;}
.check-list{margin:6px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.6;}
.check-list li::before{content:"\2713  ";color:var(--leaf);font-weight:800;}
.check-list li.no::before{content:"\2013  ";color:var(--ink-faint);}
.card-close{float:right;}
.ov-card .ov-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.ov-card .text{font-size:14px;margin-top:6px;line-height:1.4;overflow-wrap:anywhere;}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(28,33,30,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:#fff;border:2px solid var(--ink);border-radius:var(--radius-md);max-width:420px;width:100%;padding:18px;}
.modal h2{font-size:24px;line-height:1.1;margin:0 0 10px;}
.modal p{margin:0 0 16px;font-size:15px;line-height:1.5;color:var(--ink-soft);overflow-wrap:anywhere;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}

@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important;} }
</style>
</head>
<body>
<div id="app">
  <div id="offline-banner" class="offline-banner hidden" role="status">You're offline. Admin changes need a connection. Anything you save now will be sent when you're back online.</div>

  <div id="gate-screen">
    <div class="gate-card" id="gate-card" role="status" aria-live="polite"><h1>Checking your account…</h1></div>
  </div>

  <div id="signin-screen" class="hidden">
    <h1>SFO Tracker — Admin</h1>
    <p>Sign in with the same account you use for the main app.</p>
    <form id="signin-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" inputmode="email"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
      <button class="btn-primary" id="signin-btn" type="submit">Sign in</button>
      <button class="btn-link" id="forgot-btn" type="button">Forgot password?</button>
    </form>
    <div id="signin-status" role="alert"></div>
  </div>

  <div id="main-screen" class="hidden">
    <div id="top-bar">
      <div>
        <h1>SFO Tracker — Admin</h1>
        <div class="sub" id="sync-status" role="status" aria-live="polite">Loading data…</div>
        <div class="sub" id="who"></div>
      </div>
      <button id="signout-btn" type="button">Sign out</button>
    </div>
    <div id="tabs" role="tablist" aria-label="Admin sections">
      <button class="tab-btn active" id="tab-oversight" data-tab="oversight" role="tab" aria-selected="true" aria-controls="panel-oversight" type="button">Overview</button>
      <button class="tab-btn" id="tab-visits" data-tab="visits" role="tab" aria-selected="false" aria-controls="panel-visits" type="button">Visits</button>
      <button class="tab-btn" id="tab-fieldtime" data-tab="fieldtime" role="tab" aria-selected="false" aria-controls="panel-fieldtime" type="button">Field time</button>
      <button class="tab-btn" id="tab-sites" data-tab="sites" role="tab" aria-selected="false" aria-controls="panel-sites" type="button">Sites</button>
      <button class="tab-btn" id="tab-team" data-tab="team" role="tab" aria-selected="false" aria-controls="panel-team" type="button">Team</button>
      <button class="tab-btn" id="tab-import" data-tab="import" role="tab" aria-selected="false" aria-controls="panel-import" type="button">Import</button>
      <button class="tab-btn" id="tab-program" data-tab="program" role="tab" aria-selected="false" aria-controls="panel-program" type="button">Program</button>
    </div>
    <div class="panel hidden" id="panel-fieldtime" role="tabpanel" aria-labelledby="tab-fieldtime"></div>
    <div class="panel hidden" id="panel-sites" role="tabpanel" aria-labelledby="tab-sites"></div>
    <div class="panel hidden" id="panel-import" role="tabpanel" aria-labelledby="tab-import"></div>
    <div class="panel hidden" id="panel-visits" role="tabpanel" aria-labelledby="tab-visits"></div>
    <div class="panel hidden" id="panel-team" role="tabpanel" aria-labelledby="tab-team"></div>
    <div class="panel hidden" id="panel-program" role="tabpanel" aria-labelledby="tab-program"></div>
    <div class="panel" id="panel-oversight" role="tabpanel" aria-labelledby="tab-oversight"></div>
  </div>
</div>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel" type="button">Cancel</button>
      <button class="btn-danger" id="modal-ok" type="button">Confirm</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, onSnapshot, writeBatch, serverTimestamp,
  getDocFromServer, getDocs, setDoc, updateDoc, deleteDoc, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcy7mQsN3G-SsDuJ5Zh9SKrLPO7cL7H2M",
  authDomain: "sfo-tracker.firebaseapp.com",
  projectId: "sfo-tracker",
  storageBucket: "sfo-tracker.firebasestorage.app",
  messagingSenderId: "264081040783",
  appId: "1:264081040783:web:8b10dc5e9478d0a11bd7fa"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* Only the two icons this page uses. */
const ICONS = {
  "search": '<path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" />',
  "chevron-right": '<path d="m9 18 6-6-6-6" />'
};
function icon(name, size) {
  size = size || 16;
  return '<svg class="ic" aria-hidden="true" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || "") + '</svg>';
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function slugify(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
/* The Field Assistant record id for a name; null for blank or the "N/A" office entry. */
function faId(name) { const n = (name || "").trim(); return n && n !== "N/A" ? slugify(n) : null; }
function fmtNum(n) { return typeof n === "number" ? n.toLocaleString() : "—"; }
const SEP = '<i class="sep" aria-hidden="true"></i>';
const $ = (sel, root) => (root || document).querySelector(sel);

const smoothScroll = () => (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");
function chip(cls, text) { return `<span class="chip chip-${cls}">${esc(text)}</span>`; }
function pendingMsg() { return navigator.onLine ? "Saving…" : "You're offline. This will send when you're back online."; }

const EPAS = ["Chilaza", "Ming'ongo", "Mpingu", "Office"];
/* The EPAs a site can be given: the usual ones, any already on a site (another SFO's own EPAs), and Office last. */
function epaChoices(current) {
  const set = new Set(EPAS.filter((e) => e !== "Office"));
  sites.forEach((s) => { if (s.id !== "n-a" && s.epa && s.epa !== "Office") set.add(s.epa); });
  if (current && current !== "Office") set.add(current);
  return [...[...set].sort((a, b) => a.localeCompare(b)), "Office"];
}
const SITE_STATUSES = ["active", "paused", "closed"];
const VISIT_STATUSES = ["Pending", "Completed", "Rescheduled", "Skipped"];
const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const DAY_SHORT = { Monday: "Mon", Tuesday: "Tue", Wednesday: "Wed", Thursday: "Thu", Friday: "Fri", Saturday: "Sat" };

/* Malawi numbers: +265 followed by 9 digits. Accepts 0999…, 999…, 265999…, +265 999…, 00265… */
function normalizePhone(raw) {
  let d = String(raw || "").replace(/[^\d]/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (!d.startsWith("265")) d = d.startsWith("0") ? "265" + d.slice(1) : "265" + d;
  return d.length === 12 ? "+" + d : null;
}

/* ============================= SCHEDULE MATH (same as index.html) ============================= */
function isoFromDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function validISO(iso) {
  if (typeof iso !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const d = new Date(iso + "T00:00:00");
  return !isNaN(d) && isoFromDate(d) === iso;
}
function addDaysISO(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoFromDate(d); }
function daysBetweenISO(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function mondayOfISO(iso) { return addDaysISO(iso, -((new Date(iso + "T00:00:00").getDay() + 6) % 7)); }
function weekdayName(iso) {
  if (!validISO(iso)) return null;
  const n = new Date(iso + "T00:00:00").getDay();
  return n >= 1 && n <= 6 ? DAY_NAMES[n] : null; // Monday to Saturday; null on Sunday
}
function todayISO() { return isoFromDate(new Date()); }

/* Each dated visit votes for the Week-1 Monday it implies; the majority wins. */
function inferWeek1Monday() {
  const votes = {};
  let total = 0;
  checkins.forEach((c) => {
    if (!validISO(c.date) || !Number.isFinite(c.week) || c.week < 1) return;
    const start = addDaysISO(mondayOfISO(c.date), -7 * (c.week - 1));
    votes[start] = (votes[start] || 0) + 1;
    total++;
  });
  let best = null, bestN = 0;
  Object.entries(votes).forEach(([k, n]) => { if (n > bestN) { best = k; bestN = n; } });
  return { date: best, votes: bestN, total };
}
function week1Anchor(inferred) {
  const set = programDoc && programDoc.week1Monday;
  if (validISO(set)) return set;
  return (inferred || inferWeek1Monday()).date;
}
function weekOfISO(iso, anchor) {
  if (!anchor || !validISO(iso)) return null;
  return Math.floor(daysBetweenISO(anchor, iso) / 7) + 1;
}
/* The week the team is in now, limited to weeks that exist (as in the main app). */
function currentWeek(anchor) {
  const weeks = [...new Set(checkins.map((c) => c.week))].filter(Number.isFinite).sort((a, b) => a - b);
  if (!weeks.length) return 1;
  const w = weekOfISO(todayISO(), anchor);
  if (w !== null) return Math.min(Math.max(w, weeks[0]), weeks[weeks.length - 1]);
  const open = weeks.find((wk) => checkins.some((c) => c.week === wk && c.status !== "Completed"));
  return open ?? weeks[weeks.length - 1];
}

/* Shared list states: a visible error (with retry) or a loading line. */
function errHTML(keys) {
  const bad = keys.filter((k) => errs[k]);
  if (!bad.length) return "";
  return `<div class="err-banner" role="alert"><strong>Couldn't load ${esc(bad.map((k) => KEY_LABEL[k]).join(", "))}.</strong> ${esc(bad.map((k) => errs[k]).join(", "))}. <button type="button" class="btn-link" data-retry>Try again</button></div>`;
}
function isLoading(keys) { return keys.some((k) => !loaded[k] && !errs[k]); }
function loadingHTML(what) { return `<div class="loading" role="status">Loading ${esc(what)}…</div>`; }

/* ============================= MODAL ============================= */
let modalResolve = null;
let modalOpener = null;
function confirmModal({ title, body, confirmLabel }) {
  return new Promise((resolve) => {
    modalResolve = resolve;
    modalOpener = document.activeElement;
    $("#modal-title").textContent = title;
    $("#modal-body").textContent = body;
    $("#modal-ok").textContent = confirmLabel;
    $("#modal-backdrop").classList.remove("hidden");
    $("#app").inert = true;
    $("#modal-cancel").focus();
  });
}
function closeModal(result) {
  $("#modal-backdrop").classList.add("hidden");
  $("#app").inert = false;
  const resolve = modalResolve, opener = modalOpener;
  modalResolve = null; modalOpener = null;
  const target = opener && opener.isConnected ? opener : ($("#visit-count") || $("#tabs .tab-btn.active"));
  if (target && target.focus) target.focus();
  if (resolve) resolve(result);
}
$("#modal-cancel").addEventListener("click", () => closeModal(false));
$("#modal-ok").addEventListener("click", () => closeModal(true));
$("#modal-backdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeModal(false); });
$("#modal-backdrop").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); closeModal(false); return; }
  if (e.key === "Tab") {
    const cancel = $("#modal-cancel"), ok = $("#modal-ok");
    if (e.shiftKey && document.activeElement === cancel) { e.preventDefault(); ok.focus(); }
    else if (!e.shiftKey && document.activeElement === ok) { e.preventDefault(); cancel.focus(); }
  }
});

/* ============================= AUTH ============================= */
function authMessage(err) {
  switch (err && err.code) {
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
    case "auth/invalid-email":
      return "That email or password isn't right. Check them and try again, or use Forgot password.";
    case "auth/too-many-requests":
      return "Too many attempts. Wait a few minutes, or reset your password, then try again.";
    case "auth/network-request-failed":
      return "No connection. Check your internet and try again.";
    case "auth/user-disabled":
      return "This account has been disabled. Ask an admin.";
    default:
      return "Couldn't complete that (" + ((err && err.code) || "unknown") + "). Try again.";
  }
}
function setSigninStatus(text, ok) {
  const el = $("#signin-status");
  el.textContent = text;
  el.classList.toggle("ok", !!ok);
}
$("#signin-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#signin-btn");
  setSigninStatus("");
  const email = $("#email").value.trim(), password = $("#password").value;
  if (!email || !password) { setSigninStatus("Enter your email and password."); return; }
  btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    setSigninStatus(authMessage(err));
  } finally {
    btn.disabled = false;
  }
});
$("#forgot-btn").addEventListener("click", async () => {
  const email = $("#email").value.trim();
  if (!email) { setSigninStatus("Type your email above first, then tap Forgot password."); $("#email").focus(); return; }
  setSigninStatus("Sending…");
  try {
    await sendPasswordResetEmail(auth, email);
    setSigninStatus("If an account exists for " + email + ", a password reset email is on its way. Check your spam folder too.", true);
  } catch (err) {
    setSigninStatus(authMessage(err));
  }
});
$("#signout-btn").addEventListener("click", () => signOut(auth));

function showScreen(name) {
  ["gate", "signin", "main"].forEach((n) => $("#" + n + "-screen").classList.toggle("hidden", n !== name));
}
function showGate(kind, user, err) {
  const card = $("#gate-card");
  const out = `<button class="btn-outline" type="button" data-gate="signout">Sign out</button>`;
  if (kind === "checking") {
    card.innerHTML = `<h1>Checking your account…</h1>`;
  } else if (kind === "denied") {
    card.innerHTML = `<h1>This account isn't an admin</h1>
      <p>You're signed in as <strong>${esc(user.email)}</strong>, which doesn't have admin access. Ask an admin to change your role, or sign in with a different account.</p>
      <div class="gate-actions">${out}</div>`;
  } else if (kind === "offline") {
    card.innerHTML = `<h1>The admin page needs a connection</h1>
      <p>We couldn't check your admin access because you appear to be offline. Connect to the internet and try again.</p>
      <div class="gate-actions"><button class="btn-save" type="button" data-gate="retry" style="flex:none;">Try again</button>${out}</div>`;
  } else {
    card.innerHTML = `<h1>Couldn't check your account</h1>
      <p>Something went wrong while checking your admin access (${esc((err && err.code) || "unknown error")}). Try again in a moment.</p>
      <div class="gate-actions"><button class="btn-save" type="button" data-gate="retry" style="flex:none;">Try again</button>${out}</div>`;
  }
  showScreen("gate");
  const h = $("h1", card);
  if (h && kind !== "checking") { h.setAttribute("tabindex", "-1"); h.focus(); }
}
$("#gate-screen").addEventListener("click", (e) => {
  const b = e.target.closest("[data-gate]");
  if (!b) return;
  if (b.dataset.gate === "signout") signOut(auth);
  else if (auth.currentUser) { showGate("checking"); checkAdmin(auth.currentUser, ++authSeq); }
});

async function checkAdmin(user, seq) {
  try {
    const snap = await getDocFromServer(doc(db, "users", user.uid));
    if (seq !== authSeq) return;
    const role = snap.exists() ? snap.data().role : null;
    if (role === "admin") enterMain(user);
    else showGate("denied", user);
  } catch (err) {
    if (seq !== authSeq) return;
    if (err && err.code === "permission-denied") showGate("denied", user);
    else if (!navigator.onLine || (err && err.code === "unavailable")) showGate("offline", user, err);
    else showGate("error", user, err);
  }
}

onAuthStateChanged(auth, (user) => {
  const seq = ++authSeq;
  stopListeners();
  resetState();
  if (!user) { showScreen("signin"); return; }
  showGate("checking");
  checkAdmin(user, seq);
});

function enterMain(user) {
  $("#who").textContent = "Signed in as " + (user.email || user.uid);
  showScreen("main");
  setTab("oversight", false);
  startListeners();
  render();
}

/* ============================= LISTENERS ============================= */
function stopListeners() { unsubs.forEach((u) => u()); unsubs = []; }

function updateSync() {
  const el = $("#sync-status");
  const bad = KEYS.filter((k) => errs[k]);
  if (bad.length) el.textContent = "Problem loading " + bad.map((k) => KEY_LABEL[k]).join(", ") + ". See the message in each tab.";
  else if (KEYS.every((k) => loaded[k])) el.textContent = "All data loaded";
  else el.textContent = "Loading data… (" + KEYS.filter((k) => loaded[k]).length + " of " + KEYS.length + ")";
}

function startListeners() {
  loaded = {}; errs = {};
  updateSync();
  const listen = (key, ref, assign) => onSnapshot(ref,
    (snap) => { assign(snap); loaded[key] = true; delete errs[key]; updateSync(); render(); },
    (err) => { errs[key] = err.code || "error"; updateSync(); render(); });
  unsubs = [
    listen("sites", collection(db, "sites"), (s) => { sites = s.docs.map((d) => ({ id: d.id, ...d.data() })); }),
    listen("checkins", collection(db, "checkins"), (s) => { checkins = s.docs.map((d) => ({ id: d.id, ...d.data() })); }),
    listen("observations", collection(db, "observations"), (s) => { observations = s.docs.map((d) => ({ id: d.id, ...d.data() })); }),
    listen("users", collection(db, "users"), (s) => { users = s.docs.map((d) => ({ id: d.id, ...d.data() })); }),
    listen("fieldAssistants", collection(db, "fieldAssistants"), (s) => { faRecords = s.docs.map((d) => ({ id: d.id, ...d.data() })); }),
    onSnapshot(collection(db, "weeklyCheckins"), (s) => { weeklyDocs = s.docs.map((d) => ({ id: d.id, ...d.data() })); }, () => {}),
    listen("program", doc(db, "meta", "program"), (s) => { programDoc = s.exists() ? s.data() : null; })
  ];
}
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-retry]") && auth.currentUser) { stopListeners(); startListeners(); }
});

/* ============================= TABS ============================= */
const TABS = ["oversight", "visits", "fieldtime", "sites", "team", "import", "program"];
function setTab(tab, doRender = true) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach((b) => {
    const on = b.dataset.tab === tab;
    b.classList.toggle("active", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
    if (on) b.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
  TABS.forEach((t) => $("#panel-" + t).classList.toggle("hidden", tab !== t));
  if (doRender) render();
}
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => setTab(btn.dataset.tab));
  btn.addEventListener("keydown", (e) => {
    const i = TABS.indexOf(btn.dataset.tab);
    let n = null;
    if (e.key === "ArrowRight") n = (i + 1) % TABS.length;
    else if (e.key === "ArrowLeft") n = (i - 1 + TABS.length) % TABS.length;
    else if (e.key === "Home") n = 0;
    else if (e.key === "End") n = TABS.length - 1;
    if (n === null) return;
    e.preventDefault();
    setTab(TABS[n]);
    $("#tab-" + TABS[n]).focus();
  });
});

/* Live data only redraws what depends on it. The site/team edit cards, the
   import textarea, the filter controls and the program date input are built
   once and never rebuilt by a snapshot, so a teammate's change can't wipe what
   you're typing or pasting. */
function render() {
  if (!auth.currentUser || $("#main-screen").classList.contains("hidden")) return;
  if (activeTab === "sites") renderSites();
  else if (activeTab === "import") renderImport();
  else if (activeTab === "visits") renderVisits();
  else if (activeTab === "fieldtime") renderFieldTime();
  else if (activeTab === "team") renderTeam();
  else if (activeTab === "program") renderProgram();
  else renderOversight();
}

function knownAssistants() {
  const all = [...faRecords.map((f) => f.name), ...sites.map((s) => s.assistant), ...checkins.map((c) => c.assistant)];
  return [...new Set(all.filter((a) => a && a !== "N/A"))].sort((a, b) => a.localeCompare(b));
}

/* ============================= SITES ============================= */
function renderSites() {
  const el = $("#panel-sites");
  if (!built.sites) {
    el.innerHTML = `
      <p class="hint">Select a site to change its details, or add a new one. Changes save straight to the database.</p>
      <div id="sites-banner"></div>
      <div class="toolbar"><button class="btn-add" id="add-site-btn" type="button">Add site</button></div>
      <div id="edit-slot"></div>
      <div class="search-bar">${icon("search", 15)}<input id="site-search" type="search" aria-label="Search sites" placeholder="Search by site, assistant, SFO, EPA or nursery ID" value="${esc(siteSearch)}"></div>
      <div id="site-list"></div>`;
    $("#site-search").addEventListener("input", (e) => { siteSearch = e.target.value; renderSiteList(); });
    $("#add-site-btn").addEventListener("click", () => {
      siteCardMode = "new"; editingSiteId = null;
      renderEditSlot(); renderSiteList();
      $("#edit-slot").scrollIntoView({ behavior: smoothScroll(), block: "start" });
    });
    built.sites = true;
  }
  $("#sites-banner").innerHTML = errHTML(["sites"]);
  renderSiteList();
}

function closeSiteCard() {
  siteCardMode = null; editingSiteId = null; cardToken++;
  const slot = $("#edit-slot");
  if (slot) slot.innerHTML = "";
}

function renderSiteList() {
  const listEl = $("#site-list");
  if (!listEl) return;
  if (errs.sites) { listEl.innerHTML = ""; return; }
  if (isLoading(["sites"])) { listEl.innerHTML = loadingHTML("sites"); return; }
  const q = siteSearch.trim().toLowerCase();
  let filtered = sites.filter((s) => s.id !== "n-a");
  if (q) filtered = filtered.filter((s) =>
    (s.name || "").toLowerCase().includes(q) || (s.nurseryId || "").toLowerCase().includes(q) || (s.nmName || "").toLowerCase().includes(q) || (s.assistant || "").toLowerCase().includes(q) || (s.epa || "").toLowerCase().includes(q) || supervisorNameOf(s).toLowerCase().includes(q));
  filtered.sort((a, b) => (a.name || "").localeCompare(b.name || ""));

  /* Most recent completed visit per site, by anyone. */
  const lastBySite = {};
  checkins.forEach((c) => {
    if (c.status !== "Completed") return;
    const d = validISO(c.date) ? c.date : (c.completedAt && c.completedAt.seconds ? isoFromDate(new Date(c.completedAt.seconds * 1000)) : null);
    if (d && (!lastBySite[c.siteId] || d > lastBySite[c.siteId])) lastBySite[c.siteId] = d;
  });
  const lastVisitText = (id) => {
    const d = lastBySite[id];
    if (!d) return `<span class="flag">Never visited</span>`;
    const days = Math.max(0, daysBetweenISO(d, todayISO()));
    const txt = days === 0 ? "today" : days === 1 ? "yesterday" : days + " days ago";
    return `<span class="flag${days >= 21 ? "" : " ok"}">Last visited ${txt}</span>`;
  };
  listEl.innerHTML = filtered.map((s) => {
    const flags = [];
    if (!s.nmPhone) flags.push("No phone");
    if (typeof s.lat !== "number" || typeof s.lng !== "number") flags.push("No GPS");
    const status = s.status === "paused" || s.status === "closed" ? s.status : "active";
    const statusChip = status === "paused" ? chip("warn", "Paused") : status === "closed" ? chip("bad", "Closed") : "";
    const isEditing = siteCardMode === "edit" && s.id === editingSiteId;
    return `
      <button class="site-row ${isEditing ? "editing" : ""} ${status === "closed" ? "closed" : ""}" data-site="${esc(s.id)}" type="button">
        <div style="flex:1;min-width:0;">
          <div class="name">${esc(s.name)} ${statusChip}</div>
          <div class="meta">${esc(s.assistant || "No assistant")}${supervisorNameOf(s) ? SEP + "SFO: " + esc(supervisorNameOf(s)) : ""}${SEP}${esc(s.epa || "No EPA")}${SEP}${esc(s.nmName || "No manager on file")}${SEP}target ${fmtNum(s.potfillingTarget)}
            ${flags.map((f) => `<span class="flag">${esc(f)}</span>`).join("")}${lastVisitText(s.id)}
          </div>
        </div>
        ${icon("chevron-right", 16)}
      </button>`;
  }).join("") || `<div class="empty">${sites.length ? `No sites match "${esc(siteSearch)}".` : "No sites yet. Use Add site to create the first one."}</div>`;

  listEl.querySelectorAll(".site-row").forEach((row) =>
    row.addEventListener("click", () => {
      siteCardMode = "edit"; editingSiteId = row.dataset.site;
      renderEditSlot();
      renderSiteList();
      $("#edit-slot").scrollIntoView({ behavior: smoothScroll(), block: "start" });
    }));
}

function renderEditSlot() {
  const slot = $("#edit-slot");
  const isNew = siteCardMode === "new";
  const site = isNew ? {} : sites.find((s) => s.id === editingSiteId);
  if (!isNew && !site) { closeSiteCard(); return; }
  const token = ++cardToken;
  const assistants = knownAssistants();
  if (site.assistant && !assistants.includes(site.assistant) && site.assistant !== "N/A") assistants.push(site.assistant);
  const pendingCount = isNew ? 0 : checkins.filter((c) => c.siteId === site.id && c.status === "Pending" && c.ownerType !== "fa").length;
  const epas = epaChoices(site.epa);
  const status = SITE_STATUSES.includes(site.status) ? site.status : "active";

  slot.innerHTML = `
    <div class="edit-card">
      <h2>${isNew ? "Add site" : esc(site.name)}</h2>
      <div class="edit-grid">
        ${isNew ? `<div class="field"><label for="f-name">Site name (required)</label><input id="f-name" data-field="name" autocomplete="off">
          <div class="field-note" id="f-id-note">The site ID is made from the name.</div></div>` : ""}
        <div class="field"><label for="f-epa">EPA</label>
          <select id="f-epa" data-field="epa">
            ${(isNew || !site.epa) ? `<option value="" selected>Not set</option>` : ""}
            ${epas.map((e) => `<option value="${esc(e)}" ${e === site.epa ? "selected" : ""}>${esc(e)}</option>`).join("")}

/* Who supervises the Field Assistant with this name, as a label. */
function faSupText(name) {
  const f = faById(faId(name));
  return f && f.supervisorUid ? (supLabel(u0(f.supervisorUid)) || f.supervisorName || f.supervisorEmail || "") : "";
}
function useMyLocation(card) {
  const btn = $('[data-role="geo"]', card);
  const msg = $('[data-role="geo-msg"]', card);
  if (!("geolocation" in navigator)) { msg.textContent = "This device or browser can't give a location. Type the coordinates instead."; return; }
  btn.disabled = true;
  btn.textContent = "Getting location…";
  msg.textContent = "Waiting for a GPS fix. This can take up to 20 seconds.";
  navigator.geolocation.getCurrentPosition((pos) => {
    btn.disabled = false; btn.textContent = "Use my current location";
    $('[data-field="lat"]', card).value = pos.coords.latitude.toFixed(6);
    $('[data-field="lng"]', card).value = pos.coords.longitude.toFixed(6);
    const acc = Math.round(pos.coords.accuracy);
    msg.textContent = "Filled from your location, accurate to about " + acc + " m." + (acc > 100 ? " That's rough. Try again outdoors with a clear sky before saving." : "");
  }, (err) => {
    btn.disabled = false; btn.textContent = "Use my current location";
    if (err.code === 1) msg.textContent = "Location permission was denied. Allow location for this page in your browser settings, or type the coordinates.";
    else if (err.code === 3) msg.textContent = "Timed out waiting for a GPS fix. Move outdoors and try again, or type the coordinates.";
    else msg.textContent = "Couldn't get a position. Try again outdoors, or type the coordinates.";
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

async function saveSite(site, card, token) {
  const isNew = siteCardMode === "new";
  const msg = $('[data-role="msg"]', card);
  const saveBtn = $('[data-role="save"]', card);
  const val = (f) => $(`[data-field="${f}"]`, card).value.trim();
  const fail = (text) => { msg.className = "save-msg err"; msg.textContent = text; };

  let name = "", id = "";
  if (isNew) {
    name = val("name");
    if (!name) return fail("Enter a site name.");
    id = slugify(name);
    if (!id) return fail("The site name needs at least one letter or number.");
    if (id === "n-a") return fail("That name is reserved. Choose another.");
    if (!loaded.sites) return fail("Sites are still loading. Try again in a moment.");
    if (sites.some((s) => s.id === id)) return fail(`A site with the ID "${id}" already exists. Pick it from the list to edit it.`);
  }

  let nmPhone = "";
  if (val("nmPhone")) {
    nmPhone = normalizePhone(val("nmPhone"));
    if (!nmPhone) return fail("That phone number doesn't look right. Use a Malawi number such as 0999 123 456.");
  }
  let target = null;
  if (val("potfillingTarget") !== "") {
    target = Number(val("potfillingTarget").replace(/,/g, ""));
    if (!Number.isFinite(target) || target < 0) return fail("Potfilling target must be a number, 0 or higher.");
  }
  let lat = null, lng = null;
  const latS = val("lat"), lngS = val("lng");
  if (latS !== "" || lngS !== "") {
    if (latS === "" || lngS === "") return fail("Enter both latitude and longitude, or leave both empty.");
    lat = Number(latS); lng = Number(lngS);
    if (!Number.isFinite(lat) || lat < -90 || lat > 90) return fail("Latitude must be a number from -90 to 90.");
    if (!Number.isFinite(lng) || lng < -180 || lng > 180) return fail("Longitude must be a number from -180 to 180.");
  }

  /* sfoUid is what lets an SFO's phone read this site at all (the rules and the app's
     query both match on it), so it must follow the field assistant's supervisor. */
  const faRec = faRecords.find((f) => f.id === faId(val("assistant")));
  const sfoUid = (faRec && faRec.supervisorUid) || null;
  let epaVal = val("epa");
  if (epaVal === "__new__") {
    epaVal = val("epaNew");
    if (!epaVal) return fail("Type the name of the new EPA, or pick an existing one.");
    if (epaVal.length > 40) return fail("The EPA name is too long. Use 40 characters or fewer.");
  }
  const fields = {
    epa: epaVal, status: val("status"), assistant: val("assistant"), assistantId: faId(val("assistant")), sfoUid, nurseryId: val("nurseryId"),
    potfillingTarget: target, nmName: val("nmName"), nmPhone, lat, lng
  };

  saveBtn.disabled = true;
  msg.className = "save-msg"; msg.textContent = pendingMsg();
  const closeLater = () => setTimeout(() => { if (cardToken === token) { closeSiteCard(); renderSiteList(); } }, 1200);
  try {
    if (isNew) {
      try {
        const existing = await getDocFromServer(doc(db, "sites", id));
        if (existing.exists()) { saveBtn.disabled = false; return fail(`A site with the ID "${id}" already exists. Pick it from the list to edit it.`); }
      } catch (e) { /* offline: the local list check above is what we have */ }
      await setDoc(doc(db, "sites", id), {
        name, ...fields,
        createdAt: serverTimestamp(), createdBy: who(),
        updatedAt: serverTimestamp(), updatedBy: who()
      });
      msg.className = "save-msg ok"; msg.textContent = "Site added.";
      closeLater();
      return;
    }
    const patch = { ...fields, updatedAt: serverTimestamp(), updatedBy: who() };
    const batch = writeBatch(db);
    batch.update(doc(db, "sites", site.id), patch);
    let moved = 0, left = 0;
    if (patch.assistant && patch.assistant !== (site.assistant || "")) {
      /* A visit an FA made belongs to that FA (ownerType "fa"): his phone only reads his
         own visits, so re-pointing it at someone else would make it vanish for him. Those
         stay where they are; only visits made by an SFO or admin move with the site. */
      checkins.filter((c) => c.siteId === site.id && c.status === "Pending").forEach((c) => {
        if (c.ownerType === "fa") { left++; return; }
        batch.update(doc(db, "checkins", c.id), { assistant: patch.assistant, assistantId: faId(patch.assistant), updatedAt: serverTimestamp(), updatedBy: who() });
        moved++;
      });
    }
    await batch.commit();
    msg.className = "save-msg ok";
    let note = "Saved.";
    if (moved) note = `Saved. Moved ${moved} pending visit${moved === 1 ? "" : "s"} to ${patch.assistant}.`;
    if (left) note += ` ${left} pending visit${left === 1 ? " made" : "s made"} by the previous assistant ${left === 1 ? "was" : "were"} left with them.`;
    if (patch.assistant && !sfoUid) note += ` ${patch.assistant} has no supervisor yet, so no SFO will see this site until one is set.`;
    msg.textContent = note;
    closeLater();
  } catch (err) {
    saveBtn.disabled = false;
    fail("Couldn't save: " + (err.code || err.message));
  }
}

/* ============================= IMPORT ============================= */
/* Pasted columns, tab-separated:
   Field Assistant | Nursery ID | Nursery Site | Potfilling Target | NM Name | NM Number | EPA
   A site that already exists is updated (nursery ID, target, manager, phone). A site that does
   not exist yet is added, if its Field Assistant already has a record (add one on the Team tab)
   and the EPA column is filled in. The EPA column is optional for existing sites. */
function parseImportText(text) {
  return text.split("\n").map((l) => l.trim()).filter(Boolean)
    .filter((l) => !/^field assistant\b/i.test(l))
    .map((line) => {
      const [fa, nurseryId, siteName, target, nmName, nmPhoneRaw, epa] = line.split("\t").map((c) => c.trim());
      const t = target ? Number(target.replace(/,/g, "")) : null;
      return { fa, nurseryId, siteName, target: Number.isFinite(t) ? t : null, nmName, nmPhoneRaw, epa: epa || "" };
    }).filter((r) => r.siteName);
}

function buildImportPreview(rows) {
  const seen = new Set();
  return rows.map((r) => {
    const id = slugify(r.siteName || "");
    const existing = sites.find((s) => s.id === id);
    const faKey = faId(r.fa);
    const faRec = faKey ? faById(faKey) : null;
    if (id === "n-a" || !id) return { ...r, id, status: "invalid", diffs: ["that site name is reserved or empty"] };
    if (seen.has(id)) return { ...r, id, status: "clash", diffs: ["this site is listed twice in what you pasted"] };
    seen.add(id);

    let nmPhone = null;
    if (r.nmPhoneRaw) {
      nmPhone = normalizePhone(r.nmPhoneRaw);
      if (!nmPhone) return { ...r, id, status: "invalid", diffs: [`phone "${r.nmPhoneRaw}" isn't a valid Malawi number`] };
    }

    if (!existing) {
      if (!r.fa) return { ...r, id, status: "unmatched", diffs: ["no Field Assistant on this row, so a new site can't be added"] };
      if (!faRec) return { ...r, id, status: "unmatched", diffs: [`"${r.fa}" has no Field Assistant record yet. Add them on the Team tab first`] };
      if (!r.epa) return { ...r, id, status: "invalid", diffs: ["a new site needs an EPA in the 7th column"] };
      const sup = supLabel(u0(faRec.supervisorUid)) || faRec.supervisorName || "";
      return { ...r, id, nmPhone, faRec, status: "new", diffs: [`assistant: ${faRec.name}${sup ? " (" + sup + ")" : " (no supervisor yet)"}`, `EPA: ${r.epa}`] };
    }
    /* A name that is already used by a site of a different Field Assistant is not touched. */
    if (faKey && existing.assistant && existing.assistant !== "N/A" && faId(existing.assistant) !== faKey) {
      return { ...r, id, status: "clash", diffs: [`a site called "${existing.name}" already belongs to ${existing.assistant}. Rename the new one`] };
    }
    const diffs = [];
    if (r.nurseryId && r.nurseryId !== existing.nurseryId) diffs.push(`nursery ID: ${existing.nurseryId || "—"} → ${r.nurseryId}`);
    if (r.target != null && r.target !== existing.potfillingTarget) diffs.push(`target: ${fmtNum(existing.potfillingTarget)} → ${fmtNum(r.target)}`);
    if (r.nmName && r.nmName !== existing.nmName) diffs.push(`manager: ${existing.nmName || "—"} → ${r.nmName}`);
    if (nmPhone && nmPhone !== existing.nmPhone) diffs.push(`phone: ${existing.nmPhone || "—"} → ${nmPhone}`);
    return { ...r, id, nmPhone, status: diffs.length ? "update" : "nochange", diffs };
  });
}

const IMPORT_CHIP = {
  new: ["update", "Will add"], update: ["update", "Will update"], nochange: ["nochange", "No change"],
  unmatched: ["unmatched", "Can't add"], invalid: ["invalid", "Check row"], clash: ["invalid", "Name in use"]
};

function renderImport() {
  const el = $("#panel-import");

    <label class="hint" for="import-text" style="display:block;margin-bottom:6px;">Rows from your sheet</label>
    <textarea id="import-text" placeholder="Paste rows here"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px;">

    </div>
    <div id="import-preview" aria-live="polite"></div>`;
  $("#parse-btn").addEventListener("click", () => {
    if (!loaded.sites || !loaded.fieldAssistants) {
      $("#import-preview").innerHTML = `<p class="hint" style="margin-top:12px;">${errs.sites ? "Sites couldn't be loaded, so there's nothing to match against. Check the Sites tab." : "Sites are still loading. Try again in a moment."}</p>`;
      return;
    }
    importRows = buildImportPreview(parseImportText($("#import-text").value));

}

function renderImportPreview() {
  const previewEl = $("#import-preview");
  if (!importRows || !importRows.length) {
    previewEl.innerHTML = `<p class="hint" style="margin-top:12px;">No rows found. Check that the columns are tab-separated and include a site name.</p>`;
    return;
  }
  const count = (s) => importRows.filter((r) => r.status === s).length;
  const adds = count("new"), updates = count("update"), changes = adds + updates;
  const bad = count("unmatched") + count("invalid") + count("clash");
  previewEl.innerHTML = `
    <div class="sec-title">${adds} to add, ${updates} to update, ${count("nochange")} unchanged, ${bad} need attention</div>
    ${importRows.map((r) => {
      const [cls, label] = IMPORT_CHIP[r.status];
      return `
        <div class="import-row">
          <span class="chip chip-${cls}">${label}</span>
          <div class="cell">
            <div>${esc(r.siteName)}</div>
            ${r.diffs.length ? `<div class="diffs">${r.diffs.map(esc).join(SEP)}</div>` : ""}
          </div>
        </div>`;
    }).join("")}
    ${changes ? `<button class="btn-save" id="confirm-import" type="button" style="margin-top:12px;width:100%;">Apply ${changes} change${changes === 1 ? "" : "s"}</button>` : ""}
    <div class="save-msg" id="import-msg" role="status"></div>`;

  const confirmBtn = $("#confirm-import");
  if (!confirmBtn) return;
  confirmBtn.addEventListener("click", async () => {
    const msg = $("#import-msg");
    confirmBtn.disabled = true;
    msg.className = "save-msg"; msg.textContent = pendingMsg();
    try {
      const ops = [];
      importRows.filter((r) => r.status === "update").forEach((r) => {
        const patch = { updatedAt: serverTimestamp(), updatedBy: who() };
        if (r.nurseryId) patch.nurseryId = r.nurseryId;
        if (r.target != null) patch.potfillingTarget = r.target;
        if (r.nmName) patch.nmName = r.nmName;
        if (r.nmPhone) patch.nmPhone = r.nmPhone;
        ops.push(["update", doc(db, "sites", r.id), patch]);
      });
      importRows.filter((r) => r.status === "new").forEach((r) => {
        ops.push(["set", doc(db, "sites", r.id), {
          name: r.siteName, epa: r.epa, status: "active", assistant: r.faRec.name, assistantId: r.faRec.id, sfoUid: r.faRec.supervisorUid || null,
          nurseryId: r.nurseryId || "", potfillingTarget: r.target, nmName: r.nmName || "", nmPhone: r.nmPhone || "", lat: null, lng: null,
          createdAt: serverTimestamp(), createdBy: who(), updatedAt: serverTimestamp(), updatedBy: who()
        }]);
      });
      for (let i = 0; i < ops.length; i += 400) {
        const batch = writeBatch(db);
        ops.slice(i, i + 400).forEach(([kind, ref, data]) => (kind === "set" ? batch.set(ref, data) : batch.update(ref, data)));
        await batch.commit();
      }
      msg.className = "save-msg ok"; msg.textContent = `Applied ${changes} change${changes === 1 ? "" : "s"}.${adds ? " New sites have no GPS yet. Add it on the Sites tab while standing at each nursery." : ""}`;
      importRows = null;
      confirmBtn.remove();
    } catch (err) {
      confirmBtn.disabled = false;
      msg.className = "save-msg err"; msg.textContent = "Import failed, some or none of it may have been saved: " + (err.code || err.message);
    }
  });
}

/* ============================= VISITS ============================= */
function startOf(c) { return c.evidence && c.evidence.start ? c.evidence.start : null; }
/* The start fix carries the phone's clock; startedAt is the server's. A gap of more than
   two days means the phone's date was wrong (or changed), so the fix can't vouch for when
   the visit happened. */
const CLOCK_GAP_MS = 48 * 3600 * 1000;
function clockMismatch(c) {
  const s = startOf(c);
  const server = c.startedAt && c.startedAt.seconds ? c.startedAt.seconds * 1000 : null;
  return !!s && Number.isFinite(s.capturedAtMs) && server !== null && Math.abs(server - s.capturedAtMs) > CLOCK_GAP_MS;
}
function isFlagged(c) {
  const s = startOf(c);
  return (c.status === "Completed" && !s) || (!!s && s.result === "far") || clockMismatch(c);
}
function evidenceChip(c) {
  const s = startOf(c);
  if (!s || !s.result) return chip("mute", "Not recorded");
  switch (s.result) {
    case "verified": return chip("ok", "Verified");
    case "far": return chip("bad", typeof s.distanceM === "number" ? "Far (" + Math.round(s.distanceM).toLocaleString() + " m)" : "Far");
    case "no-site-gps": return chip("warn", "Site has no GPS");
    case "denied": return chip("warn", "Location denied");
    case "no-fix":
    case "unsupported": return chip("warn", "No GPS fix");
    default: return chip("mute", "Not recorded");
  }
}
function statusChip(status) {
  const cls = { Completed: "ok", Pending: "mute", Rescheduled: "warn", Skipped: "bad" }[status] || "mute";
  return chip(cls, status || "No status");
}
function siteName(c) {
  const s = sites.find((x) => x.id === c.siteId);
  return (s && s.name) || c.siteId || "Unknown site";
}

function filteredVisits() {
  let list = checkins;
  if (vf.ids) list = list.filter((c) => vf.ids.has(c.id));
  if (vf.week) list = list.filter((c) => String(c.week) === vf.week);
  if (vf.status) list = list.filter((c) => c.status === vf.status);
  if (vf.attention) list = list.filter(isFlagged);
  const q = vf.q.trim().toLowerCase();
  if (q) list = list.filter((c) => [siteName(c), c.siteId, c.assistant, c.purpose, c.date, supervisorNameOf(c)].join(" ").toLowerCase().includes(q));
  return [...list].sort((a, b) =>
    (b.date || "").localeCompare(a.date || "") || siteName(a).localeCompare(siteName(b)) || (a.order || 0) - (b.order || 0));
}

/* Who is who, for showing a person's name instead of an email or id. */
const personName = (email) => {
  if (!email) return "";
  const u = users.find((x) => (x.email || "").toLowerCase() === String(email).toLowerCase());
  return (u && u.name) || email;
};
const faById = (id) => faRecords.find((f) => f.id === id);
/* The Field Assistant record a visit or note is about (falls back to the name on the record or its site). */
function faOfRecord(o) {
  const siteAsg = (sites.find((x) => x.id === o.siteId) || {}).assistant;
  const id = o.assistantId ? o.assistantId : faId(o.assistant || siteAsg);
  return id ? (faById(id) || { id, name: o.assistant || siteAsg || id }) : null;
}
function supervisorNameOf(o) {
  const fa = faOfRecord(o);
  const uid = (fa && fa.supervisorUid) || o.sfoUid || null;
  if (!uid) return "";
  return supLabel(users.find((x) => x.id === uid)) || (fa && (fa.supervisorName || fa.supervisorEmail)) || "Assigned";
}
const tsMs = (t) => (t && t.seconds ? t.seconds * 1000 : null);
function fmtWhen(ms) {
  const d = new Date(ms);
  return isoFromDate(d) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
const PURPOSES = ["Routine Audit & Seedling Management", "Routine Audit & Nursery Management", "Data Integrity & Progress Check", "Data Integrity Follow-up", "Weekly Reporting & Office Admin"];
let openVisitId = null;
let visitToken = 0;

function renderVisits() {
  const el = $("#panel-visits");
  if (!built.visits) {
    el.innerHTML = `
      <p class="hint">Every visit from every SFO and Field Assistant. Tap a visit to see its result, GPS check, photos and notes, and to correct it. "Needs attention" means completed without a start location, started far from the site, or a phone with the wrong date.</p>
      <div id="visits-banner"></div>

/* ---- bringing back deleted visits ---- */
/* A visit's ID is date_site_assistant_purpose_owner, and notes (and photo file names in Cloudinary)
   keep carrying it after the visit is deleted. This reads an ID back into a visit. */
function parseVisitId(raw, exact) {
  let id = String(raw || "").trim().replace(/^sfo-visits\//, "").replace(/\.(jpe?g|png)$/i, "");
  const parts = id.split("_");
  const bad = (why) => ({ id, problems: [why] });
  if (parts.length < 4) return bad("That doesn't look like a visit ID.");
  const ownerKnown = (code) => !!code && users.some((u) => u.id.slice(0, 6).toLowerCase() === code.toLowerCase());
  if (!exact) id = parts.slice(0, ownerKnown(parts[4]) ? 5 : 4).join("_"); // a photo name carries a photo ID on the end
  const [date, siteId, faSlug, purposeSlug, ownerCode] = id.split("_");
  const problems = [];
  const site = sites.find((s) => s.id === siteId);
  const fa = faSlug === "n-a" ? { id: null, name: "N/A" } : faRecords.find((f) => f.id === faSlug || slugify(f.name) === faSlug);
  const purpose = PURPOSES.find((p) => slugify(p) === purposeSlug);
  if (!validISO(date)) problems.push("the date isn't valid");
  if (!site) problems.push('no site called "' + siteId + '"');
  if (!fa) problems.push('no Field Assistant record for "' + faSlug + '"');
  if (!purpose) problems.push('the purpose "' + purposeSlug + '" isn\'t one the app knows');
  const owner = ownerCode ? users.find((u) => u.id.slice(0, 6).toLowerCase() === ownerCode.toLowerCase()) : null;
  if (problems.length) return { id, problems };
  const ownerType = owner && owner.role === "fa" ? "fa" : "sfo";
  const sfoUid = ownerType === "fa" ? (fa && fa.supervisorUid) || null : (owner && owner.id) || (faById(fa.id) || {}).supervisorUid || site.sfoUid || null;
  return { id, problems: [], date, site, fa, purpose, ownerType, ownerUid: owner ? owner.id : sfoUid, sfoUid };
}
async function restoreShell(p) {
  const w = validISO(p.date) ? weekOfISO(p.date, week1Anchor()) : null;
  const order = checkins.reduce((m, c) => Math.max(m, c.order ?? 0), -1) + 1;
  await setDoc(doc(db, "checkins", p.id), {
    siteId: p.site.id, epa: p.site.epa || "", assistant: p.fa.name, assistantId: p.fa.id, purpose: p.purpose,
    date: p.date, day: weekdayName(p.date) || "", week: w !== null && w >= 1 ? w : null,
    status: "Pending", statusNote: "", rescheduledFrom: "", checklistItems: [], checkedItems: [], order,
    ownerType: p.ownerType, ownerUid: p.ownerUid, sfoUid: p.sfoUid,
    restoredAtMs: Date.now(), restoredBy: who(),
    createdAt: serverTimestamp(), createdBy: who(), updatedAt: serverTimestamp(), updatedBy: who()
  });
}
function visitCandidateHTML(p, extra, key) {
  const exists = checkins.some((c) => c.id === p.id);
  const label = p.problems.length ? esc(p.id) : esc([fmtDayLong(p.date), p.site.name, p.fa.name, p.purpose].join(" · "));
  return `
    <div class="import-row">
      <span class="chip ${exists ? "chip-mute" : p.problems.length ? "chip-bad" : "chip-ok"}">${exists ? "Exists" : p.problems.length ? "Can't rebuild" : "Can bring back"}</span>
      <div class="cell"><div>${label}</div><div class="diffs">${esc(exists ? "This visit is already on the schedule." : p.problems.length ? p.problems.join(", ") : "")}${extra ? SEP + esc(extra) : ""}</div>
        ${!exists && !p.problems.length ? `<button type="button" class="btn-link" data-restore="${esc(key)}">Bring it back</button>` : ""}</div>
    </div>`;
}
let recoverCache = {};
function renderRecover() {
  const list = $("#recover-list"), count = $("#recover-count");
  if (!list) return;
  const manual = recoverCache.m;
  recoverCache = manual ? { m: manual } : {};
  if (isLoading(["checkins", "observations", "sites", "fieldAssistants", "users"])) { list.innerHTML = ""; return; }
  const have = new Set(checkins.map((c) => c.id));
  const orphans = new Map();
  observations.forEach((o) => { if (o.checkinId && !have.has(o.checkinId)) (orphans.get(o.checkinId) || orphans.set(o.checkinId, []).get(o.checkinId)).push(o); });
  const items = [...orphans.entries()].map(([id, notes], i) => {
    const p = parseVisitId(id, true);
    recoverCache["o" + i] = p;
    return visitCandidateHTML(p, notes.length + (notes.length === 1 ? " note" : " notes") + " still point" + (notes.length === 1 ? "s" : "") + " at it", "o" + i);
  });
  count.textContent = orphans.size ? " (" + orphans.size + " found)" : "";
  const ok = [...orphans.keys()].map((_, i) => recoverCache["o" + i]).filter((p) => !p.problems.length);
  list.innerHTML = items.length
    ? `<div class="sec-title" style="margin-top:0;">Visits that notes still point at</div>${items.join("")}${ok.length > 1 ? `<button class="btn-secondary" type="button" data-restore-all style="margin-top:10px;">Bring back all ${ok.length}</button>` : ""}`
    : `<div class="field-note">No notes point at a missing visit. A deleted visit with no notes can't be found this way. Paste its ID below, or restore it from a backup file.</div>`;
}
async function restoreFromBackupText(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error("That file isn't a visit backup."); }
  const v = data && data._backup === "sfo-tracker-visit" && data.visit;
  if (!v || !v.id) throw new Error("That file isn't a visit backup.");
  if (checkins.some((c) => c.id === v.id)) throw new Error("That visit is already on the schedule.");
  const get = (k, d) => (v[k] === undefined ? d : v[k]);
  const ms = (t) => (t && Number.isFinite(t.__ts) ? t.__ts : null);
  await setDoc(doc(db, "checkins", v.id), {
    siteId: get("siteId", ""), epa: get("epa", ""), assistant: get("assistant", ""), assistantId: get("assistantId", null), purpose: get("purpose", ""),
    date: get("date", ""), day: get("day", ""), week: get("week", null),
    status: "Pending", statusNote: "", rescheduledFrom: get("rescheduledFrom", ""), checklistItems: get("checklistItems", []), checkedItems: get("checkedItems", []), order: get("order", checkins.reduce((m, c) => Math.max(m, c.order ?? 0), -1) + 1),
    ownerType: get("ownerType", "sfo"), ownerUid: get("ownerUid", null), sfoUid: get("sfoUid", null),
    createdAt: serverTimestamp(), createdBy: who(), updatedAt: serverTimestamp(), updatedBy: who()
  });
  /* The security rules only let a visit be created as Pending with no evidence, so the rest goes on in a second write. */
  const patch = { updatedAt: serverTimestamp(), updatedBy: who(), restoredAtMs: Date.now(), restoredBy: who(), restoredFrom: "backup file" };
  if (get("statusNote", "")) patch.statusNote = v.statusNote;
  if (Array.isArray(v.photos) && v.photos.length) patch.photos = v.photos.slice(0, 20);
  if (v.evidence && typeof v.evidence === "object") patch.evidence = v.evidence;
  if (v.startedBy) patch.startedBy = v.startedBy;
  if (ms(v.startedAt) !== null) patch.startedAt = Timestamp.fromMillis(ms(v.startedAt));
  if (v.review && typeof v.review === "object") patch.review = v.review;
  if (VISIT_STATUSES.includes(v.status) && v.status !== "Pending") {
    patch.status = v.status;
    if (v.status === "Completed") {
      patch.completedAt = serverTimestamp(); patch.completedBy = who(); patch.completedTime = hhmmOk(v.completedTime) ? v.completedTime : "12:00";
      patch.originalCompletedBy = v.completedBy || ""; if (ms(v.completedAt) !== null) patch.originalCompletedAtMs = ms(v.completedAt);
    }
  }
  try { await updateDoc(doc(db, "checkins", v.id), patch); }
  catch (err) { throw new Error("The visit is back on the schedule, but its results couldn't be restored (" + (err.code || err.message) + "). Open it and use Correct this visit."); }
  return v.id;
}
/* A copy of the visit goes to the tablet's downloads before it is deleted. */
function visitBackupText(c) {
  const plain = JSON.stringify({ _backup: "sfo-tracker-visit", savedAtMs: Date.now(), savedBy: who(), visit: c, notes: observations.filter((o) => o.checkinId === c.id) },
    (k, val) => (val && typeof val === "object" && typeof val.seconds === "number" && typeof val.nanoseconds === "number" ? { __ts: val.seconds * 1000 } : val), 2);
  return plain;
}

async function saveVisit(c, card, token) {
  const msg = $('[data-role="msg"]', card), btn = $('[data-role="save"]', card);
  const fail = (t) => { msg.className = "save-msg err"; msg.textContent = t; };
  const date = $("#vd-date", card).value.trim(), status = $("#vd-status", card).value, note = $("#vd-note", card).value.trim();
  const purpose = $("#vd-purpose", card).value, assistant = $("#vd-assistant", card).value, time = $("#vd-time", card).value.trim();
  const faOwned = c.ownerType === "fa";

  if (date && !validISO(date)) return fail("That isn't a valid date.");
  if (date && !weekdayName(date)) return fail(date + " is a Sunday. Visits run Monday to Saturday.");
  const becoming = status === "Completed" && c.status !== "Completed";
  const leaving = c.status === "Completed" && status !== "Completed";
  if (status === "Completed") {
    if (!date) return fail("A completed visit needs a date.");
    if (becoming && date > todayISO()) return fail("A completed visit can't be dated in the future.");
    if (!/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(time) && (becoming || time)) return fail("Enter the time of the visit, for example 09:30.");
  }
  const asg = faOwned ? c.assistant : assistant;
  const clash = date && checkins.some((o) => o.id !== c.id && o.siteId === c.siteId && o.date === date
    && (o.assistant || "").trim().toLowerCase() === (asg || "").trim().toLowerCase()
    && (o.purpose || "").trim().toLowerCase() === (purpose || "").trim().toLowerCase());
  if (clash) return fail("Another visit already has the same site, date, assistant and purpose.");

  const patch = { date, status, statusNote: note, purpose, updatedAt: serverTimestamp(), updatedBy: who() };
  if (!faOwned && assistant !== c.assistant) { patch.assistant = assistant; patch.assistantId = faId(assistant); }
  if (date) {
    patch.day = weekdayName(date);
    const w = weekOfISO(date, week1Anchor());
    if (w !== null && w >= 1) patch.week = w;
  }
  if (status === "Rescheduled" && date !== (c.date || "") && validISO(c.date)) patch.rescheduledFrom = c.date;
  if (becoming) { patch.completedAt = serverTimestamp(); patch.completedBy = who(); patch.completedTime = time; }
  else if (leaving) { patch.completedAt = null; patch.completedBy = ""; patch.completedTime = ""; }
  else if (status === "Completed" && time && time !== (c.completedTime || "")) patch.completedTime = time;

  const real = Object.entries(patch).filter(([k, val]) => !["updatedAt", "updatedBy"].includes(k)
    && ((val !== null && typeof val === "object") || String(val ?? "") !== String(c[k] ?? "")));
  if (!real.length) { msg.className = "save-msg"; msg.textContent = "Nothing was changed."; return; }

  btn.disabled = true;
  msg.className = "save-msg"; msg.textContent = pendingMsg();
  try {
    await updateDoc(doc(db, "checkins", c.id), patch);
    msg.className = "save-msg ok"; msg.textContent = "Saved.";
    setTimeout(() => { if (openVisitId === c.id && visitToken === token) openVisitCard(c.id); }, 900);
  } catch (err) {
    btn.disabled = false;
    fail("Couldn't save: " + (err.code || err.message) + (err.code === "permission-denied" ? ". The security rules refused this change." : ""));
  }
}

async function deleteVisit(id, msg, token) {
  const c = checkins.find((x) => x.id === id);
  if (!c) return;
  const ok = await confirmModal({
    title: "Delete this visit?",
    body: `${siteName(c)}, ${c.date || "no date"}, ${c.assistant || "no assistant"}, ${c.purpose || "no purpose"} (${c.status || "no status"}). This can't be undone. A backup file is saved to your downloads first, and any photos stay in storage.`,
    confirmLabel: "Delete visit"
  });
  if (!ok) return;
  let backedUp = true;
  try { saveTextFile("visit-backup_" + id + ".json", visitBackupText(c), "application/json"); } catch (e) { backedUp = false; }
  msg.className = "save-msg"; msg.textContent = navigator.onLine ? "Deleting…" : "You're offline. The delete will send when you're back online.";
  try {
    await deleteDoc(doc(db, "checkins", id));
    if (openVisitId === id && visitToken === token) closeVisitCard();
    const m = $("#visit-msg");
    if (m) { m.className = "save-msg ok"; m.textContent = backedUp ? "Visit deleted. A backup file was saved to your downloads." : "Visit deleted. The backup file couldn't be saved."; }
  } catch (err) {
    msg.className = "save-msg err"; msg.textContent = "Couldn't delete: " + (err.code || err.message);
  }
}

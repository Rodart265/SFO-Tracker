/* ============================= FIELD TIME ============================= */
/* Time in the field for a day = the start of the person's first site to the finish of their last.
   Start: where the phone recorded "Start visit" (its own clock, so an offline start still counts at
   the right moment), else the server's time at start. Finish: the "end location" time if one was
   recorded, else the time entered when the visit was completed, else when it was marked complete.
   A time that falls on a different day from the visit is ignored: it means a wrong phone clock. */
let ftf = { week: "current", team: "", person: "" };
const hhmmOk = (v) => /^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(v || "");
function fmtClock(ms) { const d = new Date(ms); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function fmtDur(mins) { const h = Math.floor(mins / 60), m = mins % 60; return h ? h + " h " + String(m).padStart(2, "0") + " min" : m + " min"; }
function fmtDayLong(iso) { return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); }

function visitTimes(c) {
  const day0 = new Date(c.date + "T00:00:00").getTime();
  const sameDay = (ms) => Number.isFinite(ms) && ms >= day0 && ms < day0 + 86400000;
  const ev = c.evidence || {};
  const out = { start: null, startSrc: "", finish: null, finishSrc: "" };
  const s1 = ev.start && ev.start.capturedAtMs, s2 = tsMs(c.startedAt);
  if (sameDay(s1)) { out.start = s1; out.startSrc = "phone time at start"; }
  else if (sameDay(s2)) { out.start = s2; out.startSrc = "server time at start"; }
  const e1 = ev.end && ev.end.capturedAtMs, e4 = tsMs(c.completedAt);
  if (sameDay(e1)) { out.finish = e1; out.finishSrc = "end location time"; }
  else if (hhmmOk(c.completedTime)) { out.finish = day0 + (Number(c.completedTime.slice(0, 2)) * 60 + Number(c.completedTime.slice(3))) * 60000; out.finishSrc = "time entered at completion"; }
  else if (sameDay(e4)) { out.finish = e4; out.finishSrc = "when it was marked complete"; }
  return out;
}
function personOfVisit(c) {
  if (c.ownerType === "fa") {
    const f = faOfRecord(c);
    return { key: "fa:" + (f ? f.id : c.assistant), name: f ? f.name : (c.assistant || "Unknown"), role: "Field Assistant", teamUid: (f && f.supervisorUid) || c.sfoUid || "" };
  }
  const u = users.find((x) => x.id === c.ownerUid) || users.find((x) => (x.email || "").toLowerCase() === String(c.createdBy || "").toLowerCase());
  return { key: "sfo:" + (u ? u.id : c.createdBy || "unknown"), name: (u && (u.name || u.email)) || c.createdBy || "Unknown", role: u ? ROLE_LABEL[roleKey(u)] : "SFO", teamUid: u ? u.id : "" };
}
function fieldDays() {
  const groups = new Map();
  checkins.forEach((c) => {
    if (!validISO(c.date)) return;
    if (c.status !== "Completed" && !(c.startedBy || startOf(c))) return; // a visit that was never started or finished has no times
    const p = personOfVisit(c), t = visitTimes(c), k = p.key + "|" + c.date;
    let g = groups.get(k);
    if (!g) { g = { ...p, date: c.date, visits: 0, completed: 0, starts: [], finishes: [], noStart: 0, noFinish: 0 }; groups.set(k, g); }
    g.visits++;
    if (c.status === "Completed") g.completed++;
    if (t.start !== null) g.starts.push(t); else g.noStart++;
    if (t.finish !== null) g.finishes.push(t); else g.noFinish++;
  });
  const anchor = week1Anchor();
  return [...groups.values()].map((g) => {
    const first = g.starts.reduce((a, b) => (a && a.start <= b.start ? a : b), null);
    const last = g.finishes.reduce((a, b) => (a && a.finish >= b.finish ? a : b), null);
    const flags = [];
    let mins = null;
    if (!first) flags.push("No start time recorded");
    if (!last) flags.push("No finish time recorded");
    if (first && last) {
      if (last.finish < first.start) flags.push("Finish is before the start. Check the times");
      else mins = Math.round((last.finish - first.start) / 60000);
    }
    if (first && g.noStart) flags.push(g.noStart + " visit" + (g.noStart === 1 ? "" : "s") + " had no start time");
    if (last && g.noFinish) flags.push(g.noFinish + " visit" + (g.noFinish === 1 ? "" : "s") + " had no finish time");
    return { ...g, week: weekOfISO(g.date, anchor), startMs: first ? first.start : null, finishMs: last ? last.finish : null, startSrc: first ? first.startSrc : "", finishSrc: last ? last.finishSrc : "", mins, flags };
  }).sort((a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
}
function filteredFieldDays() {
  const all = fieldDays();
  const wk = ftf.week === "current" ? currentWeek(week1Anchor()) : ftf.week === "" ? null : Number(ftf.week);
  return all.filter((d) => (wk === null || d.week === wk) && (!ftf.team || d.teamUid === ftf.team) && (!ftf.person || d.key === ftf.person));
}

function renderFieldTime() {
  const el = $("#panel-fieldtime");
  if (!built.fieldtime) {
    el.innerHTML = `
      <p class="hint">How long each person spent in the field on a day: from the start of their first site to the finish of their last site. The finish is the end-location time if there is one, otherwise the time entered when the visit was completed.</p>
      <div id="ft-banner"></div>
      <div class="filters">
        <div class="field"><label for="ft-week">Week</label><select id="ft-week"></select></div>
        <div class="field"><label for="ft-team">SFO's team</label><select id="ft-team"></select></div>
        <div class="field wide"><label for="ft-person">Person</label><select id="ft-person"></select></div>
      </div>
      <div id="ft-body"></div>
      <button class="btn-secondary more-btn" id="ft-csv" type="button">Download as a spreadsheet (CSV)</button>
      <div class="save-msg" id="ft-msg" role="status"></div>`;
    $("#ft-week").addEventListener("change", (e) => { ftf.week = e.target.value; renderFieldTime(); });
    $("#ft-team").addEventListener("change", (e) => { ftf.team = e.target.value; renderFieldTime(); });
    $("#ft-person").addEventListener("change", (e) => { ftf.person = e.target.value; renderFieldTime(); });
    $("#ft-csv").addEventListener("click", downloadFieldCsv);
    built.fieldtime = true;
  }
  $("#ft-banner").innerHTML = errHTML(["checkins", "users", "fieldAssistants"]);
  const body = $("#ft-body");
  if (isLoading(["checkins", "users", "fieldAssistants"])) { body.innerHTML = loadingHTML("field time"); return; }

  const all = fieldDays();
  const weeks = [...new Set(all.map((d) => d.week).filter(Number.isFinite))].sort((a, b) => b - a);
  const sups = users.filter((u) => ["admin", "sfo", "member"].includes(u.role));
  const fill = (id, html, val) => { const s = $(id); if (document.activeElement === s) return; s.innerHTML = html; s.value = val; };
  fill("#ft-week", `<option value="current">This week (Week ${currentWeek(week1Anchor())})</option><option value="">All weeks</option>` + weeks.map((w) => `<option value="${w}">Week ${w}</option>`).join(""), ftf.week);
  fill("#ft-team", `<option value="">Everyone</option>` + sups.map((u) => `<option value="${esc(u.id)}">${esc(u.name || u.email || u.id)}</option>`).join(""), ftf.team);
  const people = [...new Map(all.map((d) => [d.key, d])).values()].sort((a, b) => a.name.localeCompare(b.name));
  fill("#ft-person", `<option value="">Everyone</option>` + people.map((p) => `<option value="${esc(p.key)}">${esc(p.name)} (${esc(p.role)})</option>`).join(""), ftf.person);

  const rows = filteredFieldDays();
  if (!rows.length) { body.innerHTML = `<div class="empty">${all.length ? "No field days match these filters." : "No visits with start or finish times yet."}</div>`; return; }

  const totals = new Map();
  rows.forEach((d) => {
    let t = totals.get(d.key);
    if (!t) { t = { name: d.name, role: d.role, mins: 0, days: 0, unknown: 0, sites: 0 }; totals.set(d.key, t); }
    t.sites += d.completed;
    if (d.mins === null) t.unknown++; else { t.mins += d.mins; t.days++; }
  });
  const summary = [...totals.values()].sort((a, b) => a.name.localeCompare(b.name)).map((t) => `
    <div class="ov-card ok">
      <div class="head"><span class="title">${esc(t.name)}</span><span class="badge">${t.days ? esc(fmtDur(t.mins)) : "No time yet"}</span></div>
      <div class="sub">${esc(t.role)}${SEP}${t.days} day${t.days === 1 ? "" : "s"} counted${t.days ? SEP + "average " + esc(fmtDur(Math.round(t.mins / t.days))) + " a day" : ""}${SEP}${t.sites} site${t.sites === 1 ? "" : "s"} completed${t.unknown ? SEP + t.unknown + " day" + (t.unknown === 1 ? "" : "s") + " can't be calculated" : ""}</div>
    </div>`).join("");
  const days = rows.map((d) => `
    <div class="visit-row ${d.mins === null ? "flagged" : ""}" style="cursor:default;">
      <div class="v-main">
        <div class="name">${esc(fmtDayLong(d.date))}${SEP}${esc(d.name)}</div>
        <div class="meta">${d.mins !== null ? `<strong>${esc(fmtDur(d.mins))}</strong>${SEP}` : ""}${d.startMs !== null ? esc(fmtClock(d.startMs)) : "no start"} to ${d.finishMs !== null ? esc(fmtClock(d.finishMs)) : "no finish"}${SEP}${d.completed} of ${d.visits} site${d.visits === 1 ? "" : "s"} completed${Number.isFinite(d.week) ? SEP + "Week " + d.week : ""}</div>
        <div class="chips">${chip("mute", d.role)}${d.startSrc ? chip("mute", "start: " + d.startSrc) : ""}${d.finishSrc ? chip("mute", "finish: " + d.finishSrc) : ""}${d.flags.map((f) => chip("warn", f)).join("")}</div>
      </div>
    </div>`).join("");
  body.innerHTML = `<div class="sec-title">Totals</div>${summary}<div class="sec-title">Day by day</div>${days}`;
}

function csvCell(v) { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function saveTextFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function downloadFieldCsv() {
  const msg = $("#ft-msg");
  const rows = filteredFieldDays();
  if (!rows.length) { msg.className = "save-msg err"; msg.textContent = "Nothing to download for these filters."; return; }
  const head = ["Week", "Date", "Person", "Role", "First start", "Last finish", "Minutes in the field", "Hours in the field", "Sites completed", "Visits started or completed", "Start from", "Finish from", "Notes"];
  const lines = [head, ...rows.map((d) => [d.week ?? "", d.date, d.name, d.role, d.startMs !== null ? fmtClock(d.startMs) : "", d.finishMs !== null ? fmtClock(d.finishMs) : "", d.mins ?? "", d.mins !== null ? (d.mins / 60).toFixed(2) : "", d.completed, d.visits, d.startSrc, d.finishSrc, d.flags.join("; ")])];
  saveTextFile("field-time.csv", "\ufeff" + lines.map((l) => l.map(csvCell).join(",")).join("\r\n"), "text/csv;charset=utf-8");
  msg.className = "save-msg ok"; msg.textContent = "Downloaded " + rows.length + " day" + (rows.length === 1 ? "" : "s") + ".";
}

/* Point everything that belongs to one Field Assistant at his supervisor: his sites and
   the visits and notes he made. An SFO's phone only reads records carrying his sfoUid, so
   without this the SFO sees nothing even though the assignment saved. Sites go first and
   each kind is written separately, so one stubborn record can't stop the sites from moving.
   Returns { changed, failed: [what went wrong] }. */
async function retagFa(faKey, supUid) {
  const want = supUid || null;
  const todo = { sites: [], checkins: [], observations: [] };
  sites.forEach((x) => { if (faId(x.assistant) === faKey && ((x.sfoUid || null) !== want || x.assistantId !== faKey)) todo.sites.push([x.id, { sfoUid: want, assistantId: faKey }]); });
  const mine = (d) => d.ownerType === "fa" && (d.assistantId === faKey || (d.assistantId === undefined && faId(d.assistant) === faKey));
  checkins.forEach((d) => { if (mine(d) && (d.sfoUid || null) !== want) todo.checkins.push([d.id, { sfoUid: want }]); });
  observations.forEach((d) => { if (mine(d) && (d.sfoUid || null) !== want) todo.observations.push([d.id, { sfoUid: want }]); });
  const out = { changed: 0, failed: [] };
  for (const col of ["sites", "checkins", "observations"]) {
    const list = todo[col];
    for (let i = 0; i < list.length; i += 200) {
      const chunk = list.slice(i, i + 200);
      try {
        const batch = writeBatch(db);
        chunk.forEach(([id, diff]) => batch.update(doc(db, col, id), { ...diff, updatedAt: serverTimestamp(), updatedBy: who() }));
        await batch.commit();
        out.changed += chunk.length;
      } catch (err) {
        out.failed.push(col + " (" + (err.code || err.message) + ")");

}

    if (!ok) return;
    for (let i = 0; i < work.length; i += 400) {
      const batch = writeBatch(db);
      work.slice(i, i + 400).forEach(([col, id, diff]) => batch.update(doc(db, col, id), { ...diff, updatedAt: serverTimestamp(), updatedBy: who() }));
      await batch.commit();
    }
    for (let i = 0; i < weeklyCopies.length; i += 400) {
      const batch = writeBatch(db);
      weeklyCopies.slice(i, i + 400).forEach(([id, data]) => batch.set(doc(db, "weeklyCheckins", id), data));
      await batch.commit();
    }
    msg.className = "save-msg ok"; msg.textContent = "Updated " + (work.length + weeklyCopies.length) + " records.";
  } catch (err) {
    fail("Couldn't update: " + (err.code || err.message));
  } finally {
    btn.disabled = false;
  }
}

/* ---- creating a login from this page (no Firebase console needed) ---- */
/* A second app instance creates the account, so this admin stays signed in as the admin. */
async function createLogin(email, password) {
  const secondary = initializeApp(firebaseConfig, "creator-" + Date.now());
  try {
    const sAuth = getAuth(secondary);
    const cred = await createUserWithEmailAndPassword(sAuth, email, password);
    try { await signOut(sAuth); } catch (e) { /* the instance is thrown away next */ }
    return cred.user.uid;
  } finally {
    try { await deleteApp(secondary); } catch (e) { /* nothing to clean up */ }
  }
}
function randomPassword() {
  const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const bytes = new Uint32Array(16);
  (window.crypto || { getRandomValues: (a) => a.forEach((_, i) => { a[i] = Math.floor(Math.random() * 4294967295); }) }).getRandomValues(bytes);
  return [...bytes].map((n) => chars[n % chars.length]).join("");
}
function loginError(err) {
  switch (err && err.code) {
    case "auth/email-already-in-use": return "That email already has a login. In the Firebase console open Authentication, then Users, copy its User UID, and use Add by UID below.";
    case "auth/invalid-email": return "That email address isn't valid.";
    case "auth/weak-password": return "That password is too weak. Use at least 8 characters, or leave it empty to email them a link.";
    case "auth/operation-not-allowed": return "Creating logins from this page is switched off for the project. Create the login in the Firebase console (Authentication, Users, Add user) and use Add by UID below.";
    case "auth/network-request-failed": return "No connection. Check your internet and try again.";
    default: return "Couldn't create the login (" + ((err && err.code) || (err && err.message) || "unknown") + ").";
  }
}

async function saveProgram() {
  const msg = $("#p-msg"), btn = $("#p-save");
  const v = $("#p-date").value;
  const fail = (t) => { msg.className = "save-msg err"; msg.textContent = t; };
  if (!v) return fail("Pick a date.");
  if (!validISO(v)) return fail("That isn't a valid date.");
  const dow = new Date(v + "T00:00:00").getDay();
  if (dow !== 1) return fail(`${v} is a ${DAY_NAMES[dow]}. Week 1 must start on a Monday.`);
  const current = programDoc && programDoc.week1Monday;
  if (validISO(current) && current !== v) {
    const ok = await confirmModal({
      title: "Change Week 1 Monday?",
      body: `This moves the program calendar from ${current} to ${v} on every phone. Visits already saved keep their stored week until their date is edited.`,
      confirmLabel: "Change it"
    });
    if (!ok) return;
  }
  btn.disabled = true;
  msg.className = "save-msg"; msg.textContent = pendingMsg();
  try {
    await setDoc(doc(db, "meta", "program"), { week1Monday: v, updatedAt: serverTimestamp(), updatedBy: who() }, { merge: true });
    programDirty = false;
    msg.className = "save-msg ok"; msg.textContent = "Saved.";
  } catch (err) {
    fail("Couldn't save: " + (err.code || err.message));
  } finally {
    btn.disabled = false;
  }
}

/* Is everything wired so each SFO sees his own team? */
function setupCheckHTML() {
  const cards = [];
  const card = (ok, title, sub, buttons) => `
    <div class="ov-card ${ok ? "ok" : ""}">
      <div class="head"><span class="title">${esc(title)}</span><span class="badge">${ok ? "OK" : "Needs action"}</span></div>
      ${sub ? `<div class="sub">${esc(sub)}</div>` : ""}
      ${buttons ? `<div class="ov-actions">${buttons}</div>` : ""}
    </div>`;
  const goTeam = `<button type="button" class="btn-link" data-goto="team">Open Team</button>`;
  const noSup = faRecords.filter((f) => !f.supervisorUid);
  cards.push(!faRecords.length
    ? card(false, "No Field Assistant records yet", "Create them from the sites on the Team tab.", goTeam)
    : noSup.length
      ? card(false, noSup.length + " of " + faRecords.length + " Field Assistants have no supervisor", "Nobody sees their sites until a supervisor is picked.", goTeam)
      : card(true, "All " + faRecords.length + " Field Assistants have a supervisor"));
  let hidden = 0, noRecord = 0;
  sites.forEach((s) => {
    if (s.id === "n-a") return;
    const k = faId(s.assistant);
    if (!k) return;
    const fa = faById(k);
    if (!fa) { noRecord++; return; }
    if (fa.supervisorUid && s.sfoUid !== fa.supervisorUid) hidden++;
  });
  if (faRecords.length) cards.push(hidden
    ? card(false, hidden + " site" + (hidden === 1 ? "" : "s") + " won't show on the supervisor's phone", "The site isn't tagged with its supervisor's ID yet. The fix only adds those tags.", `<button type="button" class="btn-link" data-fix="sync">Fix now</button>${goTeam}`)
    : card(true, "Every assigned site shows on its supervisor's phone"));
  if (noRecord) cards.push(card(false, noRecord + " site" + (noRecord === 1 ? "" : "s") + " name an assistant who has no record", "Create the records on the Team tab.", goTeam));
  return `<div class="sec-title">Setup check</div>${cards.join("")}`;
}

    const site = sites.find((s) => s.id === o.siteId);
    const fa = faOfRecord(o), sup = supervisorNameOf(o);
    const ms = tsMs(o.createdAt);
    const days = ms ? Math.floor((Date.now() - ms) / 86400000) : null;
    const meta = [
      o.type === "issue" ? "Issue" : "Follow-up",
      "raised by " + (personName(o.author) || "unknown"),
      fa ? "FA: " + fa.name : "",
      sup ? "SFO: " + sup : "no supervisor assigned",
      o.assignedTo ? "assigned to " + o.assignedTo : "",
      validISO(o.dueDate) ? "due " + o.dueDate : ""
    ].filter(Boolean);
    let open = "";
    if (o.checkinId && checkins.some((c) => c.id === o.checkinId)) {

let ovPresets = {};
function renderOversight() {
  const el = $("#panel-oversight");
  const banner = errHTML(["sites", "checkins", "observations", "program"]);
  if (isLoading(["sites", "checkins", "observations", "program", "users", "fieldAssistants"]) && !banner) { el.innerHTML = loadingHTML("overview"); return; }

  const real = sites.filter((s) => s.id !== "n-a");
  const maxWeek = checkins.reduce((m, c) => Math.max(m, c.week || 0), 0);
  const inferred = inferWeek1Monday();
  const anchor = week1Anchor(inferred);
  const wk = currentWeek(anchor);
  ovPresets = {};

  /* This week */
  const inWeek = checkins.filter((c) => c.week === wk);
  const countStatus = (s) => inWeek.filter((c) => c.status === s).length;
  const sunday = anchor ? addDaysISO(anchor, 7 * (wk - 1) + 6) : null;
  const issuesRaised = observations.filter((o) => o.type === "issue" && o.week === wk).length;
  const followUpsDue = sunday
    ? observations.filter((o) => o.type === "followUp" && (o.status || "Open") !== "Resolved" && validISO(o.dueDate) && o.dueDate <= sunday).length
    : null;
  const counters = [
    { lbl: "Planned", n: inWeek.length, preset: { week: String(wk) } },
    { lbl: "Completed", n: countStatus("Completed"), preset: { week: String(wk), status: "Completed" } },
    { lbl: "Pending", n: countStatus("Pending"), preset: { week: String(wk), status: "Pending" } },
    { lbl: "Rescheduled", n: countStatus("Rescheduled"), preset: { week: String(wk), status: "Rescheduled" } },
    { lbl: "Skipped", n: countStatus("Skipped"), preset: { week: String(wk), status: "Skipped" } },
    { lbl: "Issues raised", n: issuesRaised, alert: issuesRaised > 0 },
    { lbl: "Follow-ups due", n: followUpsDue, alert: !!followUpsDue }
  ];
  const counterHTML = counters.map((c, i) => {
    const inner = `<span class="num">${c.n === null ? "—" : c.n}</span><span class="lbl">${esc(c.lbl)}</span>`;
    if (c.preset) { ovPresets["c" + i] = c.preset; return `<button type="button" class="counter" data-ov="c${i}" aria-label="${esc(c.lbl)}: ${c.n}. Open in Visits">${inner}</button>`; }
    return `<div class="counter ${c.alert ? "alert" : ""}" role="group" aria-label="${esc(c.lbl)}: ${c.n === null ? "unknown" : c.n}">${inner}</div>`;
  }).join("");

  /* Stale sites + open items (unchanged) */
  const stale = real.map((s) => {
    const done = checkins.filter((c) => c.siteId === s.id && c.status === "Completed");
    const lastCompletedWeek = done.reduce((m, c) => Math.max(m, c.week || 0), 0);
    return { site: s, lastCompletedWeek, gap: lastCompletedWeek ? maxWeek - lastCompletedWeek : null };
  }).filter((r) => r.gap === null || r.gap >= 2).sort((a, b) => (b.gap ?? 999) - (a.gap ?? 999));

  const openIssues = observations
    .filter((o) => (o.type === "issue" || o.type === "followUp") && (o.status || "Open") !== "Resolved")
    .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

  const noPhone = real.filter((s) => !s.nmPhone).length;
  const noGps = real.filter((s) => typeof s.lat !== "number" || typeof s.lng !== "number").length;

  /* Data quality: day/week disagreeing with date */
  let mismatchCard;
  if (!anchor) {
    mismatchCard = dqCard({ title: "Visits whose day or week disagrees with their date", badge: "—", sub: "Can't check yet: no Week-1 Monday is set or inferable. Set one on the Program tab." });
  } else {
    const mism = [];
    checkins.forEach((c) => {
      if (!validISO(c.date)) return;
      const expDay = weekdayName(c.date);
      const expWeek = weekOfISO(c.date, anchor);
      const dayBad = expDay && c.day !== expDay;
      const weekBad = expWeek !== null && expWeek >= 1 && c.week !== expWeek;
      if (dayBad || weekBad) mism.push({ c, expDay, expWeek, dayBad, weekBad });
    });
    ovPresets.mismatch = { ids: new Set(mism.map((m) => m.c.id)), idsLabel: "visits whose day or week disagrees with their date" };
    mismatchCard = dqCard({
      title: "Visits whose day or week disagrees with their date", badge: String(mism.length), ok: !mism.length,
      sub: mism.length ? "Stored day or week doesn't match what the date implies." : "Every dated visit agrees with its date.",
      lines: mism.slice(0, 5).map((m) => `${siteName(m.c)}, ${m.c.date}: stored ${m.c.day || "no day"}, week ${Number.isFinite(m.c.week) ? m.c.week : "none"}; date implies ${m.expDay || "Sunday"}, week ${m.expWeek}`)
        .concat(mism.length > 5 ? [`and ${mism.length - 5} more`] : []),
      action: mism.length ? { key: "mismatch", label: `Review ${mism.length} in Visits` } : null
    });
  }

  /* Data quality: possible duplicates */
  const groups = {};
  checkins.forEach((c) => {
    if (!validISO(c.date)) return;
    const key = [c.siteId, c.date, (c.assistant || "").trim().toLowerCase(), (c.purpose || "").trim().toLowerCase()].join("|");
    (groups[key] = groups[key] || []).push(c);
  });
  const dupGroups = Object.values(groups).filter((g) => g.length > 1);
  const dupVisits = dupGroups.flat();
  ovPresets.dups = { ids: new Set(dupVisits.map((c) => c.id)), idsLabel: "possible duplicate visits" };
  const dupCard = dqCard({
    title: "Possible duplicate visits", badge: String(dupGroups.length), ok: !dupGroups.length,
    sub: dupGroups.length ? `${dupVisits.length} visits share the same site, date, assistant and purpose. Visits without a date aren't compared.` : "No duplicates found.",
    lines: dupGroups.slice(0, 6).map((g) => `${siteName(g[0])}, ${g[0].date}, ${g[0].assistant || "no assistant"}, ${g[0].purpose || "no purpose"} (${g.length} copies)`)
      .concat(dupGroups.length > 6 ? [`and ${dupGroups.length - 6} more`] : []),
    action: dupGroups.length ? { key: "dups", label: `Review ${dupVisits.length} in Visits` } : null
  });

  /* Data quality: completed without start evidence */
  const noEvidence = checkins.filter((c) => c.status === "Completed" && !startOf(c));
  ovPresets.noev = { attention: true };
  const noEvCard = dqCard({
    title: "Completed visits with no start evidence", badge: String(noEvidence.length), ok: !noEvidence.length,
    sub: noEvidence.length ? "Completed without a recorded start location." : "Every completed visit has start evidence.",
    action: noEvidence.length ? { key: "noev", label: "Review in Visits (needs attention)" } : null
  });

  el.innerHTML = `
    ${banner}
    ${setupCheckHTML()}
    <p class="hint" style="margin-top:22px;">What's slipping across all sites, not limited to one week like the main app's Analytics tab.</p>
    <div class="sec-title">This week${anchor ? ": Week " + wk + " (" + esc(addDaysISO(anchor, 7 * (wk - 1))) + " to " + esc(sunday) + ")" : ""}</div>
    ${checkins.length ? `<div class="counters">${counterHTML}</div>${anchor ? "" : `<p class="hint">Follow-ups due needs a Week-1 Monday. Set one on the Program tab.</p>`}` : `<div class="empty">No visits yet.</div>`}

    <div class="sec-title">Data quality</div>
    ${noEvCard}
    ${dupCard}
    ${mismatchCard}
    ${dqCard({ title: "Sites missing a manager phone number", badge: String(noPhone), ok: !noPhone })}
    ${dqCard({ title: "Sites missing GPS coordinates", badge: String(noGps), ok: !noGps })}

    <div class="sec-title">Stale sites: no completed visit in 2+ weeks</div>
    ${stale.length ? stale.slice(0, 15).map((r) => `
      <div class="ov-card">
        <div class="head"><span class="title">${esc(r.site.name)}</span><span class="badge">${r.lastCompletedWeek ? r.gap + " weeks since last visit" : "Never completed"}</span></div>
        <div class="sub">${esc(r.site.assistant)}${SEP}${esc(r.site.epa)}</div>
      </div>`).join("") + (stale.length > 15 ? `<p class="hint">Showing 15 of ${stale.length}.</p>` : "")
      : `<div class="empty">No stale sites.</div>`}

    <div class="sec-title">Oldest open issues and follow-ups</div>
    <div class="save-msg" id="ov-msg" role="status"></div>
    ${issuesHTML(openIssues)}
  `;
}
$("#panel-oversight").addEventListener("click", (e) => {
  const b = e.target.closest("[data-ov]");
  if (b && ovPresets[b.dataset.ov]) { openVisits(ovPresets[b.dataset.ov]); return; }
  const g = e.target.closest("[data-goto]");
  if (g) { setTab(g.dataset.goto); return; }
  if (e.target.closest("[data-fix]")) { setTab("team"); linkExistingRecords(); return; }
  const r = e.target.closest("[data-resolve]");
  if (r) resolveObservation(r.dataset.resolve, r);
});
</script>
</body>
</html>

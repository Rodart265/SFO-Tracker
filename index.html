}
async function startVisit(c) {
  if (isStarted(c) || startingVisit.has(c.id)) return; // a second tap must not make a second check-in
  startingVisit.add(c.id);
  render();
  showToast("Getting your location…", { persist: true });
  try {
    const fix = await getFix({ timeoutMs: GPS_TIMEOUT_MS, goodEnoughM: GPS_GOOD_M });
    const latest = checkins.find((x) => x.id === c.id);
    if (!latest) { hideToast(); return; }
    if (isStarted(latest)) { hideToast(); showToast("This visit was already started."); return; }
    const ev = buildEvidence(fix, siteById(c.siteId));
    hideToast();
    const ok = await saveCheckin(c.id, { startedAt: serverTimestamp(), startedBy: meEmail(), "evidence.start": ev });
    if (ok) showToast(evidenceToast(ev), { ms: 6000 });
  } finally {
    startingVisit.delete(c.id);
    render();
  }
}
/* Best-effort second fix when a visit is completed. Doesn't block the status change. */
async function captureEndEvidence(c) {
  const fix = await getFix({ timeoutMs: 10000, goodEnoughM: 50 });
  if (!checkins.some((x) => x.id === c.id)) return;
  guardedWrite("record where this visit ended", () => updateDoc(doc(db, "checkins", c.id), stampEdit({ "evidence.end": buildEvidence(fix, siteById(c.siteId)) })));
}
function evidenceLine(e, label) {
  if (!e) return "";
  const t = fmtTimeMs(e.capturedAtMs);
  const acc = typeof e.accuracyM === "number" ? ` · GPS ±${e.accuracyM} m` : "";
  switch (e.result) {
    case "verified": return { cls: "ok", icon: "badge-check", head: `${label} ${t} · at the site`, sub: `${fmtDistance(e.distanceM)} from the site${acc}` };
    case "far": return { cls: "bad", icon: "triangle-alert", head: `${label} ${t} · away from the site`, sub: `${fmtDistance(e.distanceM)} from the site${acc}` };
    case "no-site-gps": return { cls: "warn", icon: "map-pin", head: `${label} ${t} · location saved`, sub: `This site has no GPS yet, so it can't be verified${acc}` };
    case "denied": return { cls: "warn", icon: "map-pin", head: `${label} ${t} · no location`, sub: "Location permission was denied" };
    case "unsupported": return { cls: "warn", icon: "map-pin", head: `${label} ${t} · no location`, sub: "This device can't share its location" };
    default: return { cls: "warn", icon: "map-pin", head: `${label} ${t} · no GPS fix`, sub: "Couldn't get a location in time" };
  }
}
function renderEvidence(c) {
  const ev = c.evidence || {};
  const lines = [evidenceLine(ev.start, "Started"), evidenceLine(ev.end, "Finished")].filter(Boolean);
  return lines.map((l) => `<div class="ev-line ${l.cls}">${icon(l.icon, 15)}<span>${esc(l.head)}<small>${esc(l.sub)}</small></span></div>`).join("");
}

/* 9b) PHOTOS
   A photo is resized on the phone, saved in IndexedDB straight away (so it
   survives a reload or no signal), then uploaded to Cloudinary and attached to the
   visit when there is a connection. Each photo gets one ID that never changes, so
   a retry overwrites the same file rather than adding a second copy, and a photo
   that already uploaded is not uploaded again. */
const MAX_PHOTOS = 10;
const OUTBOX_DB = "sfo-outbox", OUTBOX_STORE = "photos";
let thumbUrls = new Map();
let flushing = false, lastFlushAt = 0, photoTimer = null, photoErrorShown = false;

function outboxOpen() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) { reject(new Error("no-indexeddb")); return; }
    const req = indexedDB.open(OUTBOX_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(OUTBOX_STORE, { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function outboxTx(mode, fn) {
  const handle = await outboxOpen();
  return new Promise((resolve, reject) => {
    const tx = handle.transaction(OUTBOX_STORE, mode);
    const req = fn(tx.objectStore(OUTBOX_STORE));
    tx.oncomplete = () => { handle.close(); resolve(req && req.result); };
    tx.onerror = tx.onabort = () => { handle.close(); reject(tx.error); };
  });
}
const outboxAll = () => outboxTx("readonly", (s) => s.getAll());
const outboxPut = (rec) => outboxTx("readwrite", (s) => s.put(rec));
const outboxDelete = (id) => outboxTx("readwrite", (s) => s.delete(id));

async function refreshOutbox() {
  try { outbox = (await outboxAll()) || []; } catch (err) { console.warn("Photo outbox unavailable:", err); outbox = []; }
  const keep = new Set(outbox.map((r) => r.id));
  thumbUrls.forEach((url, id) => { if (!keep.has(id)) { URL.revokeObjectURL(url); thumbUrls.delete(id); } });
  outbox.forEach((r) => { if (!thumbUrls.has(r.id) && r.blob) thumbUrls.set(r.id, URL.createObjectURL(r.blob)); });
}
async function resizeImage(file, maxSide = 1280, quality = 0.8) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) {
    bmp = await new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  const scale = Math.min(1, maxSide / Math.max(w0, h0));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(w0 * scale)); canvas.height = Math.max(1, Math.round(h0 * scale));
  canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
  if (bmp.close) bmp.close();
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("encode"))), "image/jpeg", quality));
}
/* Cloudinary can hand back a small copy of a photo, which saves mobile data; the
   tap-through link still opens the full picture. Other URLs are used as they are. */
function thumbUrl(url) {
  return /^https:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(url)
    ? url.replace("/image/upload/", "/image/upload/c_fill,w_320,h_320,q_auto,f_auto/") : url;
}
function photosFor(visitId) { return outbox.filter((r) => r.visitId === visitId); }
async function addPhoto(visitId, file) {
  const c = checkins.find((x) => x.id === visitId);
  if (!c || !file) return;
  if ((c.photos || []).length + photosFor(visitId).length >= MAX_PHOTOS) {
    showToast(`A visit can have up to ${MAX_PHOTOS} photos.`, { kind: "error" });
    return;
  }
  try {
    const blob = await resizeImage(file);
    await outboxPut({ id: uid(), visitId, blob, takenAtMs: Date.now(), takenBy: meEmail(), url: "", path: "" });
    await refreshOutbox();
    updateSyncPill(); render();
    showToast(navigator.onLine ? "Photo added" : "Photo saved on this phone · it will upload when you have signal");
    flushPhotos(true);
  } catch (err) {
    console.error("Photo failed:", err);
    showToast("Couldn't add that photo. Try again.", { kind: "error" });
  }
}
function attachPhotoToVisit(rec) {
  return guardedWrite("attach this photo", () => updateDoc(doc(db, "checkins", rec.visitId), stampEdit({
    photos: arrayUnion({ path: rec.path, url: rec.url, takenAtMs: rec.takenAtMs, takenBy: rec.takenBy }),
  })));
}
/* One photo to Cloudinary. The public ID comes from the visit and the photo's own
   stable ID, so a retry after a dropped connection lands on the same asset rather
   than making a second copy (with overwrite off, Cloudinary answers a repeat with
   the asset that is already there). */
async function uploadToCloudinary(rec) {
  const publicId = `${rec.visitId}_${rec.id}`.replace(/[^A-Za-z0-9_-]/g, "-");
  const form = new FormData();
  form.append("file", rec.blob, `${rec.id}.jpg`);
  form.append("upload_preset", PHOTO_HOST.uploadPreset);
  form.append("public_id", publicId);
  if (PHOTO_HOST.folder) form.append("folder", PHOTO_HOST.folder);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 90000);
  let res;
  try {
    res = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(PHOTO_HOST.cloudName)}/image/upload`, { method: "POST", body: form, signal: ctl.signal });
  } catch (err) {
    throw Object.assign(new Error("network"), { code: err && err.name === "AbortError" ? "photo/timeout" : "photo/network" });
  } finally { clearTimeout(timer); }
  let body = null;
  try { body = await res.json(); } catch (e) { /* not JSON */ }
  if (!res.ok || !body || !body.secure_url) {
    const msg = (body && body.error && body.error.message) || "";
    const code = res.status === 401 || res.status === 403 || /preset|signature|disabled|unauthor/i.test(msg) ? "photo/config"
      : res.status === 400 && /size|large/i.test(msg) ? "photo/too-large"
      : res.status === 420 || res.status === 429 ? "photo/quota"
      : "photo/failed";
    throw Object.assign(new Error(msg || `HTTP ${res.status}`), { code, status: res.status });
  }
  return { url: body.secure_url, path: body.public_id || `${PHOTO_HOST.folder}/${publicId}` };
}
function photoError(err) {
  const code = (err && err.code) || "";
  console.warn("Photo upload paused:", code || err, err && err.message);
  if (photoErrorShown) return;
  if (code === "photo/config") { photoErrorShown = true; showToast("Photo hosting isn't set up correctly yet. Photos are kept on this phone.", { kind: "error" }); }
  else if (code === "photo/quota") { photoErrorShown = true; showToast("The photo allowance for this month is used up. Photos are kept on this phone and will upload later.", { kind: "error" }); }
  else if (code === "photo/too-large") { photoErrorShown = true; showToast("A photo is too large for the host. It's kept on this phone.", { kind: "error" }); }
}
async function flushPhotos(force) {
  if (flushing || !photosReady() || !navigator.onLine || !auth.currentUser || !loadedKeys.checkins) return;
  if (!force && Date.now() - lastFlushAt < 15000) return;
  flushing = true; lastFlushAt = Date.now();
  try {
    await refreshOutbox();
    for (const rec of [...outbox]) {
      if (!checkins.some((c) => c.id === rec.visitId)) { await outboxDelete(rec.id); continue; } // visit was deleted
      try {
        if (!rec.url) {
          const up = await uploadToCloudinary(rec);
          rec.url = up.url; rec.path = up.path;
          await outboxPut(rec); // remember it is uploaded so a retry doesn't upload again
        }
        if (await attachPhotoToVisit(rec)) await outboxDelete(rec.id);
      } catch (err) { photoError(err); break; }
    }
  } finally {
    flushing = false;
    await refreshOutbox();
    updateSyncPill(); render();
  }
}
function startPhotoSync() {
  refreshOutbox().then(() => { updateSyncPill(); render(); });
  clearInterval(photoTimer);
  photoTimer = setInterval(() => { if (outbox.length) flushPhotos(); }, 45000);
}
function stopPhotoSync() { clearInterval(photoTimer); photoTimer = null; }
document.addEventListener("visibilitychange", () => { if (!document.hidden && outbox.length) flushPhotos(); });
function renderPhotoStrip(c) {
  const saved = (c.photos || []).filter((p) => p && p.url);
  const queued = photosFor(c.id);
  if (!saved.length && !queued.length) return "";
  return `<div class="photo-strip" aria-label="Visit photos">
    ${saved.map((p) => `<a class="photo-thumb" href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(thumbUrl(p.url))}" alt="Visit photo${p.takenAtMs ? " taken " + esc(fmtTimeMs(p.takenAtMs)) : ""}" loading="lazy"></a>`).join("")}
    ${queued.map((r) => `<span class="photo-thumb"><img src="${esc(thumbUrls.get(r.id) || "")}" alt="Photo waiting to upload"><span class="wait">Waiting</span></span>`).join("")}
  </div>`;
}

/* 9c) TOAST + DIALOG
   Replace the browser's alert()/confirm(), which block the page, look foreign,
   and can't offer Undo. One toast at a time; one dialog at a time. */
let toastTimer = null;
function hideToast() { document.getElementById("toast").classList.remove("open"); }
function showToast(message, opts = {}) {
  const t = document.getElementById("toast");
  const btn = document.getElementById("toast-action");
  document.getElementById("toast-text").textContent = message;
  clearTimeout(toastTimer);
  t.classList.toggle("error", opts.kind === "error");
  if (opts.action) {
    btn.hidden = false; btn.textContent = opts.action;
    btn.onclick = () => { hideToast(); if (opts.onAction) opts.onAction(); };
  } else { btn.hidden = true; btn.onclick = null; }
  t.classList.add("open");
  if (!opts.persist) toastTimer = setTimeout(hideToast, opts.ms || (opts.kind === "error" ? 8000 : opts.action ? 6000 : 3500));
}
function openDialog(o) {
  return new Promise((resolve) => {
    const back = document.getElementById("dialog-backdrop");
    const input = document.getElementById("dialog-input");
    const ok = document.getElementById("dialog-ok");
    const cancel = document.getElementById("dialog-cancel");
    document.getElementById("dialog-title").textContent = o.title || "";
    document.getElementById("dialog-msg").textContent = o.message || "";
    document.getElementById("dialog-field").hidden = !o.inputType;
    if (o.inputType) {
      input.type = o.inputType; input.value = o.value || ""; input.placeholder = o.placeholder || "";
      document.getElementById("dialog-label").textContent = o.inputLabel || "";
    }
    ok.textContent = o.confirmLabel || "OK"; cancel.textContent = o.cancelLabel || "Cancel";
    ok.className = o.danger ? "btn-danger" : "btn-primary";
    const opener = document.activeElement;
    /* Escape closes; Tab stays inside the dialog so keyboard and screen-reader
       users can't wander onto the page behind it. */
    const onKey = (e) => {
      if (e.key === "Escape") { finish(false); return; }
      if (e.key !== "Tab") return;
      const stops = [o.inputType ? input : null, cancel, ok].filter(Boolean);
      const first = stops[0], last = stops[stops.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    function finish(accepted) {
      back.classList.remove("open");
      document.removeEventListener("keydown", onKey);
      const value = o.inputType ? input.value : "";
      ok.onclick = cancel.onclick = back.onclick = null;
      if (opener && opener.isConnected && opener.focus) opener.focus();
      resolve({ ok: accepted, value });
    }
    ok.onclick = () => finish(true);
    cancel.onclick = () => finish(false);
    back.onclick = (e) => { if (e.target === back) finish(false); };
    document.addEventListener("keydown", onKey);
    back.classList.add("open");
    setTimeout(() => (o.inputType ? input : o.danger ? cancel : ok).focus(), 60);
  });
}

/* 11a) THIS-WEEK COUNTERS
   The operational numbers, not analytics: what was planned, what happened, and
   what still needs chasing. The same helper feeds Today (current week) and the
   Dashboard tab (any week). Follow-ups due counts anything unresolved whose due
   date falls on or before the end of that week, so overdue ones stay visible. */
function weekEndISO(week) {
  const start = programStart();
  return start ? addDaysISO(start, 7 * (week - 1) + 6) : null;
}
function weekCounts(week) {
  const items = checkins.filter((c) => c.week === week);
  const by = (s) => items.filter((c) => c.status === s).length;
  const end = weekEndISO(week) || todayISO();
  return {
    planned: items.length, completed: by("Completed"), pending: by("Pending"),
    rescheduled: by("Rescheduled"), skipped: by("Skipped"),
    issues: observations.filter((o) => o.type === "issue" && obsWeek(o) === week).length,
    followUps: openFollowUps().filter((o) => validISO(o.dueDate) && o.dueDate <= end).length,
  };
}
function renderCounters(week) {
  const k = weekCounts(week);
  const tiles = [
    ["Planned", k.planned, ""], ["Completed", k.completed, k.completed ? "good" : ""], ["Pending", k.pending, ""],
    ["Rescheduled", k.rescheduled, ""], ["Skipped", k.skipped, k.skipped ? "alert" : ""],
    ["Issues raised", k.issues, k.issues ? "alert" : ""], ["Follow-ups due", k.followUps, k.followUps ? "alert" : ""],
  ];
  return `<div class="counters">${tiles.map(([lbl, n, cls]) =>
    `<div class="counter ${cls}" role="group" aria-label="${esc(lbl)}: ${n}"><div class="num">${n}</div><div class="lbl">${esc(lbl)}</div></div>`).join("")}</div>`;
}
/* What to say when there are no visits at all. Offline with nothing cached is not
   the same as "nothing scheduled", so the two get different words. */
function emptyScheduleHTML() {
  if (!navigator.onLine && snapFromCache.checkins) {
    return `<div class="empty-state"><b>No schedule saved on this phone yet</b>Connect to the internet once and your schedule will download, then it works offline.</div>`;
  }
  if (setupIncomplete) return `<div class="empty-state"><b>Setup isn't finished</b>Ask an admin to run the seed script.</div>`;
  return `<div class="empty-state"><b>No visits yet</b>Tap <b style="display:inline">Add visit</b> to plan the first one.</div>`;
}

/* 11b) TODAY SCREEN

      icon: "circle-alert", tag: obsStatus(o) === "In Progress" ? "Issue in progress" : "Issue unresolved",

  const activity = buildActivityFeed(8);

  el.innerHTML = `

    <div class="today-stats">
      <div class="today-stat"><div class="num">${mine.length}</div><div class="lbl">Today</div></div>

    `}

    c.addEventListener("click", () => openSiteProfile(c.dataset.site)));

    ${errorBanner()}
    <div id="week-strip" role="group" aria-label="Choose a week">${stripHtml}</div>
    ${dayNames.length ? "" : `<div class="empty-state"><b>Nothing planned for week ${selectedWeek}</b>Tap Add visit to plan one.</div>`}
    ${dayNames.map((d) => `
      <div class="day-label"${selectedWeek === currentWeek() && d === todayDayName() ? ' id="day-today"' : ""}>${esc(d)}</div>
      ${byDay[d].map(renderCheckinCard).join("")}
    `).join("")}
  `;
  el.querySelectorAll(".week-chip").forEach((c) => c.addEventListener("click", () => { selectedWeek = Number(c.dataset.week); weekPicked = true; renderSchedule(); }));
  wireCardEvents(el);
  /* Bring the active week chip and today's weekday into view once per week,
     not on every re-render, so live updates never yank the page around. */
  if (scheduleScrolledWeek !== selectedWeek) {
    scheduleScrolledWeek = selectedWeek;
    const chip = el.querySelector(".week-chip.active");
    if (chip) chip.scrollIntoView({ inline: "center", block: "nearest" });
    const today = el.querySelector("#day-today");
    if (today) today.scrollIntoView({ block: "start" });
  }
}

        ${c.status === "Rescheduled" && c.rescheduledFrom ? `<p class="card-note">Moved from ${esc(fmtDayDate(c.rescheduledFrom))}</p>` : ""}
        ${(c.status === "Skipped" || c.status === "Rescheduled") && c.statusNote ? `<p class="card-note">${esc(c.status)}: ${esc(c.statusNote)}</p>` : ""}

        ${items.length ? `
        <div class="checklist">
          <div class="chk-head"><span class="lbl">Checklist</span><span class="tally">${checkedCount} of ${items.length} done</span></div>
          ${items.map((it, i) => `
            <button class="chk-item" data-role="chk-toggle" data-idx="${i}" role="checkbox" aria-checked="${!!(c.checkedItems && c.checkedItems[i])}">
              <span class="chk-box ${c.checkedItems && c.checkedItems[i] ? "checked" : ""}">${c.checkedItems && c.checkedItems[i] ? icon("check", 13) : ""}</span>
              <span class="chk-text">${esc(it)}</span>

        ${renderEvidence(c)}
        ${renderPhotoStrip(c)}

          <button class="start-btn" data-role="start-visit" ${startingVisit.has(c.id) ? "disabled" : ""}>
            ${icon("map-pin", 18)} ${startingVisit.has(c.id) ? "Getting location…" : "Start visit"}

        <div class="status-row" role="group" aria-label="Visit status">
          ${STATUSES.map((s) => `
            <button class="status-pill ${c.status === s ? "active-" + s.toLowerCase() : ""}" data-status="${s}" aria-pressed="${c.status === s}">
              ${icon(STATUS_ICON[s], 12)}${s}

        </div>
      </div>
      <div class="card-actions">
        <button data-role="toggle-edit">${icon("pencil", 14)} Edit Details</button>
        <button data-role="toggle-drawer">${icon("message-square", 14)} Log Note${obsForThis.length ? `<span class="badge-count">${obsForThis.length}</span>` : ""}</button>
        <button data-role="add-photo">${icon("camera", 14)} Photo${(c.photos || []).length + photosFor(c.id).length ? `<span class="badge-count">${(c.photos || []).length + photosFor(c.id).length}</span>` : ""}</button>
      </div>
      <div class="drawer-outer ${isEditOpen ? "open" : ""}"><div class="drawer"><div class="drawer-inner" data-role="edit-panel">
        ${isEditOpen ? renderEditFormBody(editDraft) : ""}
      </div></div></div>
      <div class="drawer-outer ${isDrawerOpen ? "open" : ""}"><div class="drawer"><div class="drawer-inner" data-role="notes-panel">

/* Start is offered on pending visits that are due today or earlier and not yet started. */
function canStart(c) { return c.status === "Pending" && !isStarted(c) && (!c.date || c.date <= todayISO()); }

function renderObsEntry(o) {
  const tracked = isTracked(o);
  const status = obsStatus(o);
  const overdueDue = o.dueDate && o.dueDate < todayISO() && status !== "Resolved";
  return `
    <div class="obs-entry ${status === "Resolved" ? "resolved" : ""}" data-obs="${o.id}">
      <span class="obs-dot" style="background:var(--obs-${o.type})"></span>
      <div class="obs-body">
        <div class="obs-type" style="color:var(--obs-${o.type})">${OBS_LABEL[o.type] || o.type}</div>
        <div class="obs-text">${esc(o.text)}</div>
        ${tracked && (o.assignedTo || o.dueDate) ? `
          <div class="obs-assign">

            ${o.dueDate ? `<span class="${overdueDue ? "due-over" : ""}">${icon("clock", 11)} Due ${esc(fmtShortDate(o.dueDate))}</span>` : ""}
          </div>` : ""}
        <div class="obs-meta">${esc(o.author || "")}${SEP}${fmtWhen(o.createdAt)}${

        ${tracked ? `
          <div class="obs-status-row" data-role="obs-status">

  const needsMeta = TRACKED_TYPES.includes(noteDraftType);
  const placeholder = {
    observation: "What did you observe?",
    issue: "What's the problem?",
    action: "What action was taken?",
    followUp: "What needs following up?",
  }[noteDraftType] || "What did you observe?";

  return `
    ${obsList.length ? obsList.map(renderObsEntry).join("")
      : '<p style="font-size:12.5px;color:var(--ink-faint);margin:0 0 8px;">No notes logged for this check-in yet.</p>'}
    ${composerOpen ? `
      <div class="note-composer">
        <div class="type-chips" data-role="type-chips">
          ${OBS_TYPES.map((t) => `<button class="type-chip ${noteDraftType === t ? "active" : ""}" data-type="${t}" style="${noteDraftType === t ? `background:var(--obs-${t})` : ""}">${OBS_LABEL[t]}</button>`).join("")}

/* Wires one notes panel. Used by both the schedule card drawer and the site
   profile history, so the two stay in step. `rerender` is whichever render
   function owns the surrounding screen. */
function wireNotesPanel(notesPanel, c, rerender) {
  if (!notesPanel) return;

  notesPanel.querySelectorAll('[data-role="obs-status"]').forEach((row) => {
    const obsId = row.closest(".obs-entry").dataset.obs;
    row.querySelectorAll(".obs-status-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const current = observations.find((o) => o.id === obsId);
        if (current && obsStatus(current) === btn.dataset.status) return;
        await setObservationStatus(obsId, btn.dataset.status);
      });
    });
  });

  const openBtn = notesPanel.querySelector('[data-role="open-composer"]');
  if (openBtn) openBtn.addEventListener("click", () => {
    noteComposerFor = c.id;
    noteDraftType = "observation";
    noteDraftMeta = { assignedTo: "", dueDate: "", text: "" };
    rerender();
  });

  const textarea = notesPanel.querySelector('[data-role="note-text"]');
  /* Keep the typed text in state so switching note type or picking an
     assignee doesn't wipe what's already been written. */
  if (textarea) textarea.addEventListener("input", () => { noteDraftMeta.text = textarea.value; });

  const chips = notesPanel.querySelector('[data-role="type-chips"]');
  if (chips) chips.querySelectorAll(".type-chip").forEach((chip) =>
    chip.addEventListener("click", () => {
      noteDraftType = chip.dataset.type;
      if (!TRACKED_TYPES.includes(noteDraftType)) { noteDraftMeta.assignedTo = ""; noteDraftMeta.dueDate = ""; }
      rerender();
    }));

  const assignBtn = notesPanel.querySelector('[data-role="assign-picker"]');
  if (assignBtn) assignBtn.addEventListener("click", () => {
    const options = ["Unassigned", ...allAssistants()];
    openSheet("Assign to", options, noteDraftMeta.assignedTo || "Unassigned", (val) => {
      noteDraftMeta.assignedTo = val === "Unassigned" ? "" : val;
      rerender();
    });
  });

  const dueInput = notesPanel.querySelector('[data-role="due-date"]');
  if (dueInput) dueInput.addEventListener("input", () => { noteDraftMeta.dueDate = dueInput.value; });

  const saveNoteBtn = notesPanel.querySelector('[data-role="save-note"]');
  if (saveNoteBtn) saveNoteBtn.addEventListener("click", async () => {
    const text = (textarea ? textarea.value : "").trim();
    if (!text) return;
    /* If the save fails the composer stays open with the typed text intact. */
    if (!(await addObservation(c.siteId, c.id, noteDraftType, text, noteDraftMeta))) return;
    noteComposerFor = null;
    noteDraftMeta = { assignedTo: "", dueDate: "", text: "" };
    rerender();
  });
}

/* One file input outside every re-rendered area, so a live update arriving while
   the camera is open can't destroy it. */
let photoTargetVisit = null;
document.getElementById("photo-input").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  const id = photoTargetVisit; photoTargetVisit = null;
  if (file && id) addPhoto(id, file);

function wireCardEvents(scope) {
  scope.querySelectorAll(".visit-card").forEach((card) => {
    const id = card.dataset.id;
    const c = checkins.find((x) => x.id === id);
    if (!c) return;

    card.querySelector('[data-role="open-site"]').addEventListener("click", () => openSiteProfile(c.siteId));

    card.querySelectorAll('[data-role="chk-toggle"]').forEach((btn) => {
      btn.addEventListener("click", async () => {
        const idx = Number(btn.dataset.idx);
        const arr = [...(c.checkedItems || c.checklistItems.map(() => false))];
        arr[idx] = !arr[idx];
        await saveCheckin(id, { checkedItems: arr });
      });
    });

    card.querySelectorAll(".status-pill").forEach((btn) => {
      btn.addEventListener("click", () => changeStatus(c, btn.dataset.status));
    });

    const startBtn = card.querySelector('[data-role="start-visit"]');
    if (startBtn) startBtn.addEventListener("click", () => startVisit(c));
    card.querySelector('[data-role="add-photo"]').addEventListener("click", () => {
      if (!photosReady()) { showToast("Photo upload isn't set up yet. Ask an admin to finish the photo setup.", { kind: "error" }); return; }
      photoTargetVisit = id;
      const input = document.getElementById("photo-input");
      input.value = "";
      input.click();
    });

    card.querySelector('[data-role="toggle-edit"]').addEventListener("click", () => {
      if (openEditId === id) { openEditId = null; editDraft = null; }
      else { openEditId = id; editDraft = { ...c }; openDrawerId = null; editFormError = ""; }
      render();
    });
    card.querySelector('[data-role="toggle-drawer"]').addEventListener("click", () => {
      if (openDrawerId === id) { openDrawerId = null; noteComposerFor = null; }
      else { openDrawerId = id; openEditId = null; editDraft = null; }
      render();
    });

    if (openDrawerId === id) {
      wireNotesPanel(card.querySelector('[data-role="notes-panel"]'), c, render);
    }

    if (openEditId === id) wireEditForm(card.querySelector('[data-role="edit-panel"]'), id, c);
  });
}

/* Sites for a given assistant, preferring Firestore over the hardcoded
   REFERENCE map so a reassignment in the database shows up here. Falls back to
   REFERENCE only when Firestore hasn't loaded or knows nothing about them. */
function sitesForAssistant(assistant) {
  if (!assistant) return [];
  const fromDb = sites.filter((s) => s.assistant === assistant && s.id !== "n-a" && s.status !== "closed").map((s) => s.name);
  if (fromDb.length) return fromDb.sort((a, b) => a.localeCompare(b));
  return REFERENCE.sitesByFa[assistant] || [];
}
function assistantsForEpa(epa) {
  if (!epa) return [];
  const fromDb = [...new Set(sites.filter((s) => s.epa === epa && s.assistant && s.assistant !== "N/A").map((s) => s.assistant))];
  if (fromDb.length) return fromDb.sort((a, b) => a.localeCompare(b));
  return REFERENCE.faByEpa[epa] || [];
}

/* One wiring routine for both the inline edit drawer and the full Add screen.
   `draft` is mutated in place; `opts` decides what save and the secondary
   button actually do. */
function syncDerivedFields(panel, draft) {
  const lockDay = !!(draft.date && weekdayName(draft.date));
  const lockWeek = !!(validISO(draft.date) && programStart());
  const seg = panel.querySelector('[data-role="day-seg"]');
  if (seg) {
    seg.classList.toggle("locked", lockDay);
    seg.querySelectorAll("button").forEach((b) => { b.disabled = lockDay; b.classList.toggle("active", b.dataset.value === draft.day); });
  }
  const wk = panel.querySelector('[data-field="week"]');
  if (wk) { wk.disabled = lockWeek; wk.value = draft.week; }
  panel.querySelectorAll("[data-hint]").forEach((h) => { h.hidden = !(h.dataset.hint === "day" ? lockDay : lockWeek); });
}
function wireDraftForm(panelInner, draft, opts) {
  const mode = opts.mode || "edit";
  syncDerivedFields(panelInner, draft);
  function refresh() {
    panelInner.innerHTML = renderEditFormBody(draft, mode);
    wireDraftForm(panelInner, draft, opts);
  }

  panelInner.querySelector('[data-role="day-seg"]').querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { draft.day = b.dataset.value; refresh(); }));

  panelInner.querySelector('[data-role="epa-seg"]').querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => {
      draft.epa = b.dataset.value;
      const faList = assistantsForEpa(draft.epa);
      /* Clear rather than auto-pick: a silently chosen assistant is how the
         old + button produced check-ins nobody meant to create. */
      if (!faList.includes(draft.assistant)) { draft.assistant = ""; draft.siteId = ""; }
      refresh();
    }));

  panelInner.querySelector('[data-role="fa-picker"]').addEventListener("click", () => {
    const faList = assistantsForEpa(draft.epa);
    if (!faList.length) { showToast("Pick an EPA first.", { kind: "error" }); return; }
    openSheet("Field Assistant", faList, draft.assistant, (val) => {
      draft.assistant = val;
      const siteList = sitesForAssistant(val);
      if (!siteList.includes(draft.siteId ? siteById(draft.siteId).name : "")) draft.siteId = "";
      refresh();
    });
  });
  panelInner.querySelector('[data-role="site-picker"]').addEventListener("click", () => {
    const siteList = sitesForAssistant(draft.assistant);
    if (!siteList.length) { showToast("Pick a field assistant first.", { kind: "error" }); return; }
    const currentName = draft.siteId ? siteById(draft.siteId).name : "";
    openSheet("Site", siteList, currentName, (val) => { draft.siteId = slugify(val); refresh(); });
  });
  panelInner.querySelector('[data-role="purpose-picker"]').addEventListener("click", () => {
    openSheet("Visit Purpose", REFERENCE.purposes, draft.purpose, (val) => {
      draft.purpose = val;
      const items = PURPOSE_CHECKLIST[val] || [];
      draft.checklistItems = items; draft.checkedItems = items.map(() => false);
      refresh();
    });
  });
  panelInner.querySelectorAll("[data-field]").forEach((f) =>
    f.addEventListener("input", () => {
      draft[f.dataset.field] = f.dataset.field === "week" ? Number(f.value) : f.value;
      /* Update Day/Week in place rather than re-rendering, so the form (and the
         Save button under the person's thumb) doesn't get replaced mid-tap. */
      if (f.dataset.field === "date") { applyDateToDraft(draft); syncDerivedFields(panelInner, draft); }
    }));

  panelInner.querySelector('[data-role="save-btn"]').addEventListener("click", () => opts.onSave(draft, refresh));
  panelInner.querySelector('[data-role="delete-btn"]').addEventListener("click", () => opts.onSecondary(draft));
}

/* Shared checks for the Add and Edit forms. Returns a sentence, or "" when fine. */
function visitDraftProblem(draft, ignoreId) {
  const missing = [];
  if (!draft.epa) missing.push("EPA");
  if (!draft.assistant) missing.push("field assistant");
  if (!draft.siteId) missing.push("site");
  if (!draft.purpose) missing.push("visit purpose");
  if (missing.length) return "Still needed: " + missing.join(", ") + ".";
  if (!validISO(draft.date)) return "Choose a valid date for this visit.";
  const dup = findDuplicateVisit(draft, ignoreId);
  if (dup) return dupMessage(dup);
  return "";
}
function wireEditForm(panelInner, id, checkin) {
  wireDraftForm(panelInner, editDraft, {
    mode: "edit",
    onSave: async (draft, refresh) => {
      applyDateToDraft(draft);
      const problem = visitDraftProblem(draft, id);
      if (problem) { editFormError = problem; refresh(); return; }
      editFormError = "";
      if (!(await saveCheckin(id, pickEditable(draft)))) return;
      showToast("Changes saved");
      openEditId = null; editDraft = null; render();
    },
    onSecondary: async () => {
      if (!isAdmin()) { openEditId = null; editDraft = null; editFormError = ""; render(); return; }
      const r = await openDialog({ title: "Delete this check-in?", message: "Its notes stay in the site's history and its photos stay in the photo library. This can't be undone.", confirmLabel: "Delete", danger: true });
      if (!r.ok) return;
      if (!(await removeCheckin(id))) return;
      showToast("Check-in deleted");
      openEditId = null; editDraft = null;
    },
  });
}

  const completedCount = history.filter((c) => c.status === "Completed").length;
  const hasPhone = !!site.nmPhone;
  const hasCoords = typeof site.lat === "number" && typeof site.lng === "number";

  el.innerHTML = `
    <div class="sp-top">

      <div class="sp-name headline">${esc(site.name)}</div>

        ${site.nurseryId ? `<span class="mono" style="font-family:ui-monospace,monospace;">${esc(site.nurseryId)}</span>` : ""}
        ${statusChipHTML(site)}
      </div>
    </div>
    <div class="sp-body">
      <div class="sp-card">
        <div class="nm-row">
          <div class="nm-avatar">${initials(site.nmName)}</div>
          <div class="nm-info">
            <div class="nm-name">${site.nmName ? esc(site.nmName) : "No manager on file"}</div>
            <div class="nm-phone">${hasPhone ? esc(site.nmPhone) : "No phone number yet"}</div>
          </div>
          <div style="display:flex;gap:8px;">
            ${hasPhone
              ? `<a class="call-btn" href="tel:${esc(site.nmPhone)}" title="Call ${esc(site.nmName || "manager")}">${icon("phone", 18)}</a>`
              : `<button class="call-btn" disabled title="No phone number yet">${icon("phone", 18)}</button>`}
            ${hasCoords
              ? `<a class="call-btn" href="https://www.google.com/maps/dir/?api=1&destination=${site.lat},${site.lng}" target="_blank" rel="noopener" title="Directions to ${esc(site.name)}">${icon("map-pin", 18)}</a>`
              : `<button class="call-btn" disabled title="No GPS coordinates yet">${icon("map-pin", 18)}</button>`}
          </div>
        </div>
      </div>

      <div class="sp-card">
        <div class="target-label">GPS coordinates</div>
        ${hasCoords
          ? `<div class="coords">${site.lat.toFixed(5)}, ${site.lng.toFixed(5)}</div><div class="field-hint" style="margin:4px 0 0;">Starting a visit within ${SITE_RADIUS_M} m of this point counts as at the site.</div>`
          : `<div class="coords" style="font-family:inherit;">None yet</div><div class="field-hint" style="margin:4px 0 0;">Visits here can't be verified until an admin adds coordinates.</div>`}
      </div>

      ${site.potfillingTarget ? `
      <div class="sp-card">
        <div class="target-row">
          <div><div class="target-num">${fmtNum(site.potfillingTarget)}</div><div class="target-label">Potfilling target</div></div>
          ${icon("sprout", 30)}
        </div>
      </div>` : ""}

      <div class="sp-stats">
        <div class="sp-stat"><div class="num">${history.length}</div><div class="lbl">Visits</div></div>
        <div class="sp-stat"><div class="num">${completedCount}</div><div class="lbl">Completed</div></div>
        <div class="sp-stat"><div class="num" style="${openIssues ? "color:var(--obs-issue)" : ""}">${openIssues}</div><div class="lbl">Open issues</div></div>
      </div>
      <div class="sp-stats">
        <div class="sp-stat"><div class="num" style="${openFups ? "color:var(--obs-followUp)" : ""}">${openFups}</div><div class="lbl">Open follow-ups</div></div>
        <div class="sp-stat"><div class="num" style="${resolvedIssues ? "color:var(--status-completed-fg)" : ""}">${resolvedIssues}</div><div class="lbl">Issues resolved</div></div>
        <div class="sp-stat"><div class="num">${observationsForSite(site.id).length}</div><div class="lbl">Total notes</div></div>
      </div>

      <div class="sec-title">Visit history</div>
      ${history.length ? history.map((c) => renderHistoryItem(c)).join("") : '<div class="empty-state">No check-ins recorded at this site yet.</div>'}
    </div>
  `;
  el.querySelector('[data-role="sp-back"]').addEventListener("click", closeSiteProfile);
  el.querySelectorAll(".history-item").forEach((item) => {
    const cid = item.dataset.id;
    item.querySelector('[data-role="hist-toggle"]').addEventListener("click", () => {
      openDrawerId = openDrawerId === cid ? null : cid;
      renderSiteProfile();
    });
    if (openDrawerId === cid) {
      const c = checkins.find((x) => x.id === cid);
      if (c) wireNotesPanel(item.querySelector('[data-role="notes-panel"]'), c, renderSiteProfile);
    }
  });
}

function renderHistoryItem(c) {
  const isOpen = openDrawerId === c.id;
  const obsForThis = observationsForCheckin(c.id);
  return `
    <div class="history-item" data-id="${c.id}">
      <div class="history-head">
        <div>
          <div class="when">Week ${c.week}${SEP}${esc(c.day)}${c.date ? SEP + esc(c.date) : ""}</div>
          <div class="purpose">${esc(c.purpose)}</div>
        </div>
        <span class="status-pill active-${(c.status||"Pending").toLowerCase()}" style="min-width:0;">${icon(STATUS_ICON[c.status]||"clock", 12)} ${esc(c.status||"Pending")}</span>
      </div>
      ${renderEvidence(c)}
      ${renderPhotoStrip(c)}
      <div class="card-actions" style="margin-top:10px;border-top:1px solid var(--line);">
        <button data-role="hist-toggle" style="flex:1;">${icon("message-square", 14)} Notes${obsForThis.length ? `<span class="badge-count">${obsForThis.length}</span>` : ""}</button>
      </div>
      <div class="drawer-outer ${isOpen ? "open" : ""}"><div class="drawer"><div class="drawer-inner" data-role="notes-panel" style="background:var(--paper);border-radius:0 0 12px 12px;">
        ${isOpen ? renderNotesPanel(c, obsForThis) : ""}
      </div></div></div>
    </div>
  `;
}

/* 14) SITES & TEAM SCREEN */
let siteSearch = "";
let siteFilterEpa = "All";
/* Highlights the matched substring without ever putting raw user text into
   the DOM: escape first, then wrap the match. */
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const safeQ = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(safeQ, "ig"), (m) => `<mark>${m}</mark>`);
}

let sitesView = "sites"; // "sites" | "team"
const siteStatus = (s) => (s.status === "paused" || s.status === "closed" ? s.status : "active");
function statusChipHTML(s) {
  const st = siteStatus(s);
  return st === "paused" ? '<span class="chip chip-warn">Paused</span>' : st === "closed" ? '<span class="chip chip-bad">Closed</span>' : "";
}
/* One row per field assistant: who they are, where, and how their week is going. */
function teamRows(q) {
  const wk = currentWeek();
  return allAssistants().map((fa) => {
    const mine = sites.filter((s) => s.assistant === fa && s.id !== "n-a");
    const epa = (mine[0] && mine[0].epa) || (checkins.find((c) => c.assistant === fa) || {}).epa || "";
    const visits = checkins.filter((c) => c.assistant === fa && c.week === wk);
    return {
      fa, epa, sites: mine.length, wk,
      done: visits.filter((c) => c.status === "Completed").length, total: visits.length,
      issues: mine.reduce((n, s) => n + openIssuesForSite(s.id).length, 0),
    };
  }).filter((r) => (siteFilterEpa === "All" || r.epa === siteFilterEpa) && (!q || r.fa.toLowerCase().includes(q) || r.epa.toLowerCase().includes(q)))
    .sort((a, b) => a.fa.localeCompare(b.fa));
}
function renderTeamList(q) {
  const rows = teamRows(q);
  if (!rows.length) return `<div class="empty-state"><b>No field assistants found</b>${q ? `Nothing matches “${esc(q)}”.` : "Assign sites to field assistants in the admin page."}</div>`;
  return `<div class="sec-title">${rows.length} field assistant${rows.length === 1 ? "" : "s"}</div>` + rows.map((r) => {
    const epaClass = EPA_CLASS[r.epa] || "office";
    return `
      <button class="site-row" data-fa="${esc(r.fa)}">
        <span class="avatar" style="background:var(--epa-${epaClass}-bg);color:var(--epa-${epaClass}-fg)">${initials(r.fa)}</span>
        <div class="info">
          <div class="name">${esc(r.fa)}</div>
          <div class="meta">
            ${r.epa ? `<span class="epa-label" style="color:var(--epa-${epaClass}-fg)">${esc(r.epa)}</span>` : ""}
            <span>${plural(r.sites, "site")}</span>
            <span>Wk ${r.wk}: ${r.done}/${r.total}</span>
            ${r.issues ? `<span class="issue-flag">${icon("triangle-alert", 12)} ${r.issues}</span>` : ""}
          </div>
        </div>
        ${icon("chevron-right", 17)}
      </button>`;
  }).join("");
}

function renderSitesTeam() {
  const el = document.getElementById("screen-sites");
  const gate = screenGate("sites and team");
  if (gate) { el.innerHTML = gate; return; }
  const epaOptions = ["All", ...REFERENCE.epas.filter((e) => e !== "Office")];
  const q = siteSearch.trim().toLowerCase();

  let filtered = sites.filter((s) => s.id !== "n-a");
  if (siteFilterEpa !== "All") filtered = filtered.filter((s) => s.epa === siteFilterEpa);
  if (q) {
    filtered = filtered.filter((s) =>
      (s.name || "").toLowerCase().includes(q) ||
      (s.nurseryId || "").toLowerCase().includes(q) ||
      (s.assistant || "").toLowerCase().includes(q) ||
      (s.nmName || "").toLowerCase().includes(q) ||
      (s.epa || "").toLowerCase().includes(q));
  }
  filtered.sort((a, b) => (siteStatus(a) === "closed") - (siteStatus(b) === "closed") || a.name.localeCompare(b.name));

  /* Notes matter as much as sites here: three weeks later you remember what
     you wrote, not which check-in you wrote it on. */
  let noteHits = [];
  let visitHits = [];
  if (q) {
    noteHits = observations.filter((o) => {
      if (siteFilterEpa !== "All" && siteById(o.siteId).epa !== siteFilterEpa) return false;
      return (o.text || "").toLowerCase().includes(q) ||
             (o.assignedTo || "").toLowerCase().includes(q) ||
             (o.author || "").toLowerCase().includes(q) ||
             (OBS_LABEL[o.type] || "").toLowerCase().includes(q) ||
             (obsStatus(o) || "").toLowerCase().includes(q);
    }).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).slice(0, 25);

    visitHits = checkins.filter((c) => {
      if (siteFilterEpa !== "All" && c.epa !== siteFilterEpa) return false;
      return (c.purpose || "").toLowerCase().includes(q) ||
             (c.checklistItems || []).join(" ").toLowerCase().includes(q) ||
             (c.date || "").includes(q);
    }).slice(0, 15);
  }

  const totalHits = filtered.length + noteHits.length + visitHits.length;

  const isTeam = sitesView === "team";
  el.innerHTML = `
    ${errorBanner()}
    <div class="seg-top" role="group" aria-label="Show">
      <button type="button" data-view="sites" class="${isTeam ? "" : "active"}" aria-pressed="${!isTeam}">Sites</button>
      <button type="button" data-view="team" class="${isTeam ? "active" : ""}" aria-pressed="${isTeam}">Team</button>
    </div>
    <div class="search-bar">${icon("search", 16)}<input id="site-search-input" type="search" aria-label="${isTeam ? "Search team" : "Search sites, staff, notes and issues"}" placeholder="${isTeam ? "Search field assistants…" : "Search sites, staff, notes, issues…"}" value="${esc(siteSearch)}"></div>
    <div class="pill-row" role="group" aria-label="Filter by EPA">${epaOptions.map((e) => `<button class="filter-pill ${siteFilterEpa === e ? "active" : ""}" data-epa="${esc(e)}" aria-pressed="${siteFilterEpa === e}">${esc(e)}</button>`).join("")}</div>

    ${isTeam ? renderTeamList(q) : `
    ${q && totalHits === 0 ? `<div class="empty-state">Nothing matches “${esc(siteSearch.trim())}”.</div>` : ""}
    ${!q && !filtered.length ? `<div class="empty-state"><b>No sites yet</b>An admin adds sites on the admin page.</div>` : ""}

    ${filtered.length ? `
      <div class="sec-title">${filtered.length} site${filtered.length === 1 ? "" : "s"}</div>
      ${filtered.map((s) => {
        const epaClass = EPA_CLASS[s.epa] || "office";
        const issues = openIssuesForSite(s.id).length;
        const noGps = typeof s.lat !== "number" || typeof s.lng !== "number";
        return `
          <button class="site-row ${siteStatus(s) === "closed" ? "closed" : ""}" data-site="${s.id}">
            <span class="dot" style="background:var(--epa-${epaClass}-dot)"></span>
            <div class="info">
              <div class="name">${highlight(s.name, q)}${statusChipHTML(s)}</div>
              <div class="meta">
                ${s.epa ? `<span class="epa-label" style="color:var(--epa-${epaClass}-fg)">${esc(s.epa)}</span>` : ""}
                <span>${highlight(s.assistant || "", q)}</span>
                ${s.nurseryId ? `<span class="mono">${highlight(s.nurseryId, q)}</span>` : ""}
                ${issues ? `<span class="issue-flag">${icon("triangle-alert", 12)} ${issues}</span>` : ""}
                ${noGps ? '<span class="data-flag">No GPS</span>' : ""}
              </div>
            </div>
            ${icon("chevron-right", 17)}
          </button>`;
      }).join("")}` : ""}

    ${noteHits.length ? `
      <div class="sec-title">${noteHits.length} note${noteHits.length === 1 ? "" : "s"} &amp; issues</div>
      ${noteHits.map((o) => {
        const st = obsStatus(o);
        return `
          <button class="res-card" data-site="${esc(o.siteId)}">
            <span class="res-dot" style="background:var(--obs-${o.type})"></span>
            <span class="res-body">
              <span class="res-head">
                <span class="res-site">${esc(siteById(o.siteId).name)}</span>
                <span class="res-type" style="color:var(--obs-${o.type})">${OBS_LABEL[o.type] || o.type}</span>
                ${st ? `<span class="obs-status-btn ${OBS_STATUS_CLASS[st]}" style="pointer-events:none;">${esc(st)}</span>` : ""}
              </span>
              <span class="res-text">${highlight(o.text || "", q)}</span>
              <span class="res-meta">${esc(o.author || "")}${SEP}${fmtWhen(o.createdAt)}${
                o.assignedTo ? `${SEP}${esc(o.assignedTo)}` : ""}${
                o.dueDate ? `${SEP}due ${esc(fmtShortDate(o.dueDate))}` : ""}</span>
            </span>
          </button>`;
      }).join("")}` : ""}

    ${visitHits.length ? `
      <div class="sec-title">${visitHits.length} check-in${visitHits.length === 1 ? "" : "s"}</div>
      ${visitHits.map((c) => `
        <button class="res-card" data-site="${esc(c.siteId)}">
          <span class="res-dot" style="background:var(--epa-${EPA_CLASS[c.epa] || "office"}-dot)"></span>
          <span class="res-body">
            <span class="res-head">
              <span class="res-site">${esc(siteById(c.siteId).name)}</span>
              <span class="res-type" style="color:var(--ink-faint)">Week ${c.week}${SEP}${esc(c.day || "")}</span>
            </span>
            <span class="res-text">${highlight(c.purpose || "", q)}</span>
            <span class="res-meta">${esc(c.assistant || "")}${c.date ? `${SEP}${esc(fmtShortDate(c.date))}` : ""}${SEP}${esc(c.status || "Pending")}</span>
          </span>
        </button>`).join("")}` : ""}
    `}
  `;

  el.querySelectorAll(".seg-top button").forEach((b) => b.addEventListener("click", () => { sitesView = b.dataset.view; renderSitesTeam(); }));
  el.querySelectorAll("[data-fa]").forEach((r) => r.addEventListener("click", () => {
    sitesView = "sites"; siteSearch = r.dataset.fa; siteFilterEpa = "All"; renderSitesTeam();
  }));
  const input = el.querySelector("#site-search-input");
  input.addEventListener("input", (e) => {
    siteSearch = e.target.value;
    renderSitesTeam();
    /* Re-rendering replaces the input, so restore focus and caret to keep
       typing uninterrupted. */
    const next = document.getElementById("site-search-input");
    next.focus();
    next.setSelectionRange(next.value.length, next.value.length);
  });
  el.querySelectorAll(".filter-pill").forEach((p) => p.addEventListener("click", () => { siteFilterEpa = p.dataset.epa; renderSitesTeam(); }));
  el.querySelectorAll(".site-row").forEach((r) => r.addEventListener("click", () => openSiteProfile(r.dataset.site)));
  el.querySelectorAll(".res-card").forEach((r) => r.addEventListener("click", () => openSiteProfile(r.dataset.site)));
}

/* 15) ANALYTICS SCREEN */
let dashWeek = null;
function renderAnalytics() {
  const el = document.getElementById("screen-analytics");
  const gate = screenGate("the dashboard", ["sites", "checkins", "observations"]);
  if (gate) { el.innerHTML = gate; return; }
  if (!checkins.length) { el.innerHTML = errorBanner() + emptyScheduleHTML(); return; }
  const weeks = weeksWithData();
  const wk = dashWeek !== null && weeks.includes(dashWeek) ? dashWeek : currentWeek();
  const wkIdx = weeks.indexOf(wk);

  const total = checkins.length;
  const completed = checkins.filter((c) => c.status === "Completed").length;
  const pct = total ? Math.round((completed / total) * 100) : 0;
  const allIssues = observations.filter((o) => o.type === "issue");
  const openIssues = allIssues.filter((o) => obsStatus(o) === "Open").length;
  const inProgIssues = allIssues.filter((o) => obsStatus(o) === "In Progress").length;
  const resolvedIssues = allIssues.filter((o) => obsStatus(o) === "Resolved").length;
  const dueFups = openFollowUps().filter(isDueOrOverdue).length;
  const overdueVisits = overdueCheckins().length;

  const epaRows = REFERENCE.epas.map((epa) => {
    const items = checkins.filter((c) => c.epa === epa);
    const c = items.filter((v) => v.status === "Completed").length;
    return { epa, total: items.length, completed: c, pct: items.length ? Math.round((c / items.length) * 100) : 0, cls: EPA_CLASS[epa] };
  }).filter((r) => r.total > 0);

  const statusCounts = STATUSES.map((s) => ({ status: s, count: checkins.filter((c) => c.status === s).length }));
  const statusColorVar = { Pending: "--status-pending-fg", Completed: "--status-completed-fg", Rescheduled: "--status-rescheduled-fg", Skipped: "--status-skipped-fg" };

  const assistants = [...new Set(checkins.map((c) => c.assistant).filter((a) => a && a !== "N/A"))];
  const faRows = assistants.map((fa) => {
    const items = checkins.filter((c) => c.assistant === fa);
    const c = items.filter((v) => v.status === "Completed").length;
    const epa = items[0]?.epa || "";
    return { fa, epa, cls: EPA_CLASS[epa], total: items.length, pct: items.length ? Math.round((c / items.length) * 100) : 0 };
  });

  const risk = computeSiteRisk();
  const riskBadgeIcon = { issue: "circle-alert", followup: "clock", stale: "calendar", never: "map-pin", repeat: "repeat" };

  el.innerHTML = `
    ${errorBanner()}
    <div class="week-head">
      <div class="wk-title headline">${wk === currentWeek() ? "This week · Week " + wk : "Week " + wk}</div>
      <div class="week-step">
        <button type="button" data-role="wk-prev" aria-label="Previous week" ${wkIdx <= 0 ? "disabled" : ""}>${icon("chevron-left", 18)}</button>
        <button type="button" data-role="wk-next" aria-label="Next week" ${wkIdx < 0 || wkIdx >= weeks.length - 1 ? "disabled" : ""}>${icon("chevron-right", 18)}</button>
      </div>
    </div>
    ${renderCounters(wk)}
    <button class="report-btn" data-role="open-report">${icon("file-text", 17)} Open weekly check-in</button>
    <div class="sec-title">Overall</div>
    <div class="stat-grid">
      <div class="stat-tile"><div class="num">${total}</div><div class="label">Total visits</div></div>
      <div class="stat-tile"><div class="num">${pct}%</div><div class="label">Completed · ${completed} of ${total}</div></div>
      <div class="stat-tile"><div class="num" style="${openIssues ? "color:var(--obs-issue)" : ""}">${openIssues}</div><div class="label">Open issues</div></div>
      <div class="stat-tile"><div class="num">${sites.filter(s=>s.id!=="n-a").length}</div><div class="label">Sites tracked</div></div>
      <div class="stat-tile"><div class="num" style="${overdueVisits ? "color:var(--obs-issue)" : ""}">${overdueVisits}</div><div class="label">Overdue visits</div></div>
      <div class="stat-tile"><div class="num" style="${dueFups ? "color:var(--obs-followUp)" : ""}">${dueFups}</div><div class="label">Follow-ups due</div></div>
    </div>
    <div class="dash-card">
      <h2>Sites needing attention</h2>
      ${risk.length ? risk.slice(0, 8).map((r) => `
        <button class="risk-row" data-site="${esc(r.site.id)}">
          <span class="risk-body">
            <span class="risk-name">${esc(r.site.name)}</span>
            <span class="risk-badges">
              ${r.factors.map((f) => `<span class="risk-badge ${f.key}">${icon(riskBadgeIcon[f.key], 10)}${esc(f.label)}</span>`).join("")}
            </span>
          </span>
          ${icon("chevron-right", 16)}
        </button>`).join("") : `<div class="risk-empty">${icon("badge-check", 15)} No sites flagged right now.</div>`}
    </div>
    ${allIssues.length ? `
    <div class="dash-card">
      <h2>Issue lifecycle</h2>
      <div class="dist-bar">
        ${openIssues ? `<div style="width:${openIssues / allIssues.length * 100}%;background:var(--status-skipped-fg)"></div>` : ""}
        ${inProgIssues ? `<div style="width:${inProgIssues / allIssues.length * 100}%;background:var(--status-pending-fg)"></div>` : ""}
        ${resolvedIssues ? `<div style="width:${resolvedIssues / allIssues.length * 100}%;background:var(--status-completed-fg)"></div>` : ""}
      </div>
      <div class="dist-legend">
        <span class="item"><span class="sw" style="background:var(--status-skipped-fg)"></span>Open (${openIssues})</span>
        <span class="item"><span class="sw" style="background:var(--status-pending-fg)"></span>In progress (${inProgIssues})</span>
        <span class="item"><span class="sw" style="background:var(--status-completed-fg)"></span>Resolved (${resolvedIssues})</span>
      </div>
    </div>` : ""}
    <div class="dash-card">
      <h2>Status distribution</h2>
      <div class="dist-bar">${statusCounts.map((r) => r.count ? `<div style="width:${(r.count/total*100)}%;background:var(${{Pending:"--status-pending-fg",Completed:"--status-completed-fg",Rescheduled:"--status-rescheduled-fg",Skipped:"--status-skipped-fg"}[r.status]})"></div>` : "").join("")}</div>
      <div class="dist-legend">${statusCounts.map((r) => `<span class="item"><span class="sw" style="background:var(${statusColorVar[r.status]})"></span>${r.status} (${r.count})</span>`).join("")}</div>
    </div>
    <div class="dash-card">
      <h2>EPA coverage</h2>
      ${epaRows.map((r) => `
        <div class="epa-row">
          <span class="dot" style="background:var(--epa-${r.cls}-dot)"></span>
          <span class="name">${esc(r.epa)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%"></div></div>
          <span class="count">${r.completed}/${r.total}</span>
        </div>`).join("")}
    </div>
    <div class="dash-card">
      <h2>Per-assistant progress</h2>
      ${faRows.map((r) => `
        <div class="assistant-row">
          <div class="avatar" style="background:var(--epa-${r.cls}-bg);color:var(--epa-${r.cls}-fg)">${initials(r.fa)}</div>
          <div class="assistant-info">
            <div class="assistant-name">${esc(r.fa)}</div>
            <div class="assistant-epa">${esc(r.epa)}</div>
            <div class="mini-track"><div class="mini-fill" style="width:${r.pct}%"></div></div>
          </div>
          <span class="assistant-pct">${r.pct}%</span>
        </div>`).join("")}
    </div>
  `;

  el.querySelector('[data-role="open-report"]').addEventListener("click", () => openReport(wk));
  el.querySelector('[data-role="wk-prev"]').addEventListener("click", () => { if (wkIdx > 0) { dashWeek = weeks[wkIdx - 1]; renderAnalytics(); } });
  el.querySelector('[data-role="wk-next"]').addEventListener("click", () => { if (wkIdx >= 0 && wkIdx < weeks.length - 1) { dashWeek = weeks[wkIdx + 1]; renderAnalytics(); } });
  el.querySelectorAll(".risk-row").forEach((r) => r.addEventListener("click", () => openSiteProfile(r.dataset.site)));
}

/* 16) ADD CHECK-IN
   The old + button immediately wrote a check-in using the first EPA, first
   assistant and first site in the reference data, leaving the user to correct
   a record that already existed. This opens a form instead: week, day and date
   are prefilled from context, but who and where must be chosen deliberately. */
function openAddCheckin() {
  const today = todayISO();
  const dayName = todayDayName();
  addFormError = "";
  addDraft = {
    week: currentWeek(),
    day: DAY_ORDER.includes(dayName) ? dayName : "Monday",
    date: today,
    epa: "", assistant: "", siteId: "", purpose: "",
    checklistItems: [], checkedItems: [], status: "Pending",
  };
  document.getElementById("add-checkin-screen").classList.remove("hidden");
  updateFab();
  renderAddCheckin();
}
function closeAddCheckin() {
  addDraft = null; addFormError = "";
  document.getElementById("add-checkin-screen").classList.add("hidden");
  updateFab();
}
function renderAddCheckin() {
  const el = document.getElementById("add-checkin-screen");
  if (!addDraft) return;
  el.innerHTML = `
    <div class="ac-top">
      <button class="ac-back" data-role="ac-back">${icon("chevron-left", 16)} Cancel</button>
      <div class="ac-title headline">Add site visit</div>
      <div class="ac-sub">Prefilled for ${esc(fmtLongDate(addDraft.date || todayISO()))}</div>
    </div>
    <div class="ac-body">
      <div class="ac-card"><div data-role="ac-form"></div></div>
    </div>
  `;
  const formHost = el.querySelector('[data-role="ac-form"]');
  formHost.innerHTML = renderEditFormBody(addDraft, "add");
  el.querySelector('[data-role="ac-back"]').addEventListener("click", closeAddCheckin);

  wireDraftForm(formHost, addDraft, {
    mode: "add",
    onSave: async (draft, refresh) => {
      applyDateToDraft(draft);
      const problem = visitDraftProblem(draft, null);
      if (problem) { addFormError = problem; refresh(); return; }
      addFormError = "";
      if (!(await createCheckin({ ...draft }))) return;
      showToast("Visit added");
      closeAddCheckin();
      render();
    },
    onSecondary: () => closeAddCheckin(),
  });
}
document.getElementById("fab").addEventListener("click", openAddCheckin);
window.addEventListener("scroll", () => document.getElementById("fab").classList.toggle("compact", window.scrollY > 60), { passive: true });

/* 16b) WEEKLY CHECK-IN
   One doc per week in `weeklyCheckins` (id = String(week)). Mon–Thu the SFO
   fills it in; Friday's call with the DS just reads what's there.
   - Seedlings target is derived (sum of the FA's site potfilling targets).
   - Potfilling % and Planting % come from the tech team's KoBo dashboard and
     are typed in by hand — never computed here.
   - Report items are curated: each of the week's observations can be left out,
     or promoted to bucket "update" (FYI) or "signoff" (needs a decision). */
function weeksWithData() {
  return [...new Set(checkins.map((c) => c.week).filter((w) => typeof w === "number"))].sort((a, b) => a - b);
}
/* Merge saved doc over defaults so a partial save (e.g. only the sustainability
   score) can never leave faPercents / topPriorities undefined. */
function weeklyCheckinFor(week) {
  const base = {
    week, personalSustainability: { score: null, vacations: "", lastReportSubmitted: null },
    topPriorities: [], faPercents: {},
  };
  const found = weeklyCheckins.find((w) => w.week === week);
  if (!found) return base;
  return {
    ...base, ...found,
    personalSustainability: { ...base.personalSustainability, ...(found.personalSustainability || {}) },
    faPercents: found.faPercents || base.faPercents,
    topPriorities: found.topPriorities || base.topPriorities,
  };
}
function faSeedlingsTarget(assistant) {
  return sites.filter((s) => s.assistant === assistant && typeof s.potfillingTarget === "number")
    .reduce((sum, s) => sum + s.potfillingTarget, 0);
}
/* Notes logged before the `week` field existed fall back to their visit's week. */
function obsWeek(o) {
  if (typeof o.week === "number") return o.week;
  const c = o.checkinId ? checkins.find((x) => x.id === o.checkinId) : null;
  return c ? c.week : null;
}
function observationsForWeek(week) {
  return observations.filter((o) => obsWeek(o) === week)
    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
}
function allReportWeeks() {
  const fromDrafts = weeklyCheckins.map((w) => w.week).filter((w) => typeof w === "number");
  const candidates = [...weeksWithData(), ...fromDrafts, selectedWeek, selectedWeek + 1];
  return [...new Set(candidates)].sort((a, b) => a - b);
}
const BUCKET_LABEL = { update: "Update", signoff: "Discussion & sign-off" };

function buildReportData(week) {
  const weekCheckins = checkins.filter((c) => c.week === week);
  const visitsPlanned = weekCheckins.length;
  const visitsCompleted = weekCheckins.filter((c) => c.status === "Completed").length;
  const visitsMissed = weekCheckins.filter((c) => c.status === "Skipped" || c.status === "Rescheduled").length;
  const sitesInvolved = [...new Set(weekCheckins.map((c) => c.siteId).filter((id) => id !== "n-a"))];
  const sitesCompleted = [...new Set(weekCheckins.filter((c) => c.status === "Completed").map((c) => c.siteId).filter((id) => id !== "n-a"))];

  const items = observationsForWeek(week);
  const weekIssues = items.filter((o) => o.type === "issue");
  const weekFollowUps = items.filter((o) => o.type === "followUp");

  const visitsByFa = {};
  weekCheckins.forEach((c) => {
    if (!c.assistant || c.assistant === "N/A") return;
    (visitsByFa[c.assistant] ||= []).push(c);
  });
  /* Every FA with assigned sites gets a row, even with no visits yet — 0% is
     still worth showing. */
  const faNames = [...new Set([
    ...sites.map((s) => s.assistant),
    ...Object.keys(visitsByFa),
  ].filter((a) => a && a !== "N/A"))].sort();
  const wc = weeklyCheckinFor(week);
  const faRows = faNames.map((fa) => {
    const v = visitsByFa[fa] || [];
    const done = v.filter((c) => c.status === "Completed").length;
    const pcts = wc.faPercents[fa] || {};
    return {
      fa, total: v.length, done,
      target: faSeedlingsTarget(fa),
      potfillingPct: pcts.potfillingPct ?? null,
      plantingPct: pcts.plantingPct ?? null,
    };
  });

  const byEpa = {};
  weekCheckins.forEach((c) => { (byEpa[c.epa] ||= []).push(c); });
  const epaRows = Object.entries(byEpa).map(([epa, list]) => ({
    epa, total: list.length, done: list.filter((c) => c.status === "Completed").length,
  }));

  return {
    week, wc, visitsPlanned, visitsCompleted, visitsMissed,
    sitesCovered: sitesCompleted.length, sitesInvolved: sitesInvolved.length,
    issuesLogged: weekIssues.length, issuesNowResolved: weekIssues.filter((o) => obsStatus(o) === "Resolved").length,
    followUpsLogged: weekFollowUps.length, followUpsOpen: weekFollowUps.filter(isUnresolved).length,
    faRows, epaRows, items,
    updates: items.filter((o) => o.bucket === "update"),
    signoffs: items.filter((o) => o.bucket === "signoff"),
  };
}
function fmtPct(v) { return typeof v === "number" ? `${v}%` : "—"; }
function buildReportText(d) {
  const ps = d.wc.personalSustainability;
  const lines = [];
  lines.push(`WEEKLY CHECK-IN — WEEK ${d.week}`);
  lines.push(`Generated ${fmtLongDate(todayISO())}`);
  lines.push("");
  lines.push("PERSONAL SUSTAINABILITY");
  lines.push(`  Score: ${ps.score ?? "—"}/3`);
  lines.push(`  Upcoming vacations: ${ps.vacations || "None noted"}`);
  lines.push(`  Last week's report submitted: ${ps.lastReportSubmitted === true ? "Yes" : ps.lastReportSubmitted === false ? "No" : "—"}`);
  lines.push("");
  lines.push("TOP PRIORITIES");
  if (d.wc.topPriorities.length) d.wc.topPriorities.forEach((t, i) => lines.push(`  ${i + 1}. ${t}`));
  else lines.push("  (none set)");
  lines.push("");
  lines.push("FA PERFORMANCE");
  d.faRows.forEach((r) => lines.push(`  ${r.fa}: target ${r.target.toLocaleString("en-US")} | potfilling ${fmtPct(r.potfillingPct)} | planting ${fmtPct(r.plantingPct)} | visits ${r.done}/${r.total}`));
  lines.push("");
  lines.push(`Visits: ${d.visitsCompleted}/${d.visitsPlanned} completed${d.visitsMissed ? `, ${d.visitsMissed} missed/rescheduled` : ""}`);
  lines.push(`Sites covered: ${d.sitesCovered}/${d.sitesInvolved}`);
  const fmtItem = (o) => `  - [${OBS_LABEL[o.type]}] ${siteById(o.siteId).name}: ${o.text}`;
  lines.push("");
  lines.push("UPDATES");
  if (d.updates.length) d.updates.forEach((o) => lines.push(fmtItem(o))); else lines.push("  (none)");
  lines.push("");
  lines.push("DISCUSSION & SIGN-OFF");
  if (d.signoffs.length) d.signoffs.forEach((o) => lines.push(fmtItem(o))); else lines.push("  (none)");
  return lines.join("\n");
}

function openReport(preferWeek) {
  const weeks = allReportWeeks();
  const want = preferWeek !== undefined && preferWeek !== null ? preferWeek : selectedWeek;
  reportWeek = weeks.includes(want) ? want : (weeks[weeks.length - 1] ?? 1);
  addItemDraft = null;
  document.getElementById("report-screen").classList.remove("hidden");
  updateFab();
  renderReport();
}
function closeReport() {
  reportWeek = null; addItemDraft = null;
  document.getElementById("report-screen").classList.add("hidden");
  updateFab();
}
function renderReport() {
  const el = document.getElementById("report-screen");
  if (reportWeek === null) return;
  const d = buildReportData(reportWeek);
  const weeks = allReportWeeks();
  const ps = d.wc.personalSustainability;
  const prios = [...d.wc.topPriorities, "", "", ""].slice(0, 3);

  const promoHtml = d.items.length ? d.items.map((o) => `
    <div class="promo-item" data-obs="${esc(o.id)}">
      <div class="rn-head"><span class="rn-type" style="color:var(--obs-${o.type})">${OBS_LABEL[o.type]}</span><span>${esc(siteById(o.siteId).name)}</span></div>
      <div class="rn-text">${esc(o.text)}</div>
      <div class="promo-seg no-print">
        <button data-bucket="" class="${!o.bucket ? "active" : ""}">Not included</button>
        <button data-bucket="update" class="seg-update ${o.bucket === "update" ? "active" : ""}">Update</button>
        <button data-bucket="signoff" class="seg-signoff ${o.bucket === "signoff" ? "active" : ""}">Sign-off</button>
      </div>
    </div>`).join("") : `<div class="rep-empty">Nothing logged for week ${d.week} yet.</div>`;

  const composerHtml = addItemDraft ? `
    <div class="add-item-box no-print">
      <button class="pick-site" data-role="item-site">${addItemDraft.siteId ? esc(siteById(addItemDraft.siteId).name) : "Choose a site…"}</button>
      <div class="type-chips" data-role="item-types">
        ${OBS_TYPES.map((t) => `<button class="type-chip ${addItemDraft.type === t ? "active" : ""}" data-type="${t}" style="${addItemDraft.type === t ? `background:var(--obs-${t})` : ""}">${OBS_LABEL[t]}</button>`).join("")}
      </div>
      <textarea data-role="item-text" rows="3" placeholder="What did the FA tell you?">${esc(addItemDraft.text)}</textarea>
      <div class="add-item-actions">
        <button class="cancel" data-role="item-cancel">Cancel</button>
        <button class="btn-primary" data-role="item-save">Save item</button>
      </div>
    </div>` : `<button class="add-item-btn no-print" data-role="item-new">${icon("plus", 14)} Add an item an FA relayed to you</button>`;

  el.innerHTML = `
    <div class="rep-top">
      <button class="rep-back no-print" data-role="rep-back">${icon("chevron-left", 16)} Back</button>
      <div class="rep-title-row">
        <div class="rep-title headline">Weekly Check-in</div>
        <button class="rep-week-btn no-print" data-role="rep-week">Week ${d.week} ${icon("chevron-down", 13)}</button>
      </div>
      <div class="rep-actions no-print">
        <button data-role="rep-copy">${icon("copy", 14)} Copy as text</button>
        <button data-role="rep-print">${icon("printer", 14)} Print / Save PDF</button>
      </div>
    </div>
    <div class="rep-body">
      <div class="rep-card">
        <h3>Personal sustainability</h3>
        <div class="rep-hint">How are you feeling this week? 1 is low, 3 is great.</div>
        <div class="ps-score-row" data-role="ps-score">
          ${[1, 2, 3].map((n) => `<button data-score="${n}" class="${ps.score === n ? "active" : ""}">${n}</button>`).join("")}
        </div>
        <label class="ps-label" for="ps-vac">Upcoming vacations</label>
        <input type="text" id="ps-vac" data-role="ps-vac" value="${esc(ps.vacations)}" placeholder="None planned">
        <span class="ps-label">Last week's report submitted?</span>
        <div class="ps-yn" data-role="ps-yn">
          <button data-yn="yes" class="${ps.lastReportSubmitted === true ? "active" : ""}">Yes</button>
          <button data-yn="no" class="${ps.lastReportSubmitted === false ? "active" : ""}">No</button>
        </div>
      </div>

      <div class="rep-card">
        <h3>Top priorities</h3>
        <div class="rep-hint">Up to three, set at the start of the week.</div>
        ${prios.map((t, i) => `<div class="priority-row"><input type="text" data-prio="${i}" value="${esc(t)}" placeholder="Priority ${i + 1}"></div>`).join("")}
      </div>

      <div class="rep-card">
        <h3>FA performance</h3>
        <div class="rep-hint">Potfilling and planting % come from the KoBo dashboard — type them in.</div>
        ${d.faRows.length ? d.faRows.map((r) => `
          <div class="fa-perf-row" data-fa="${esc(r.fa)}">
            <div class="fa-perf-head"><span>${esc(r.fa)}</span><span class="fa-visits">${r.done}/${r.total} visits</span></div>
            <div class="fa-perf-target">Seedlings target: <b>${r.target.toLocaleString("en-US")}</b></div>
            <div class="fa-perf-inputs">
              <div class="fa-perf-input"><label>Potfilling %</label><input type="number" inputmode="decimal" min="0" max="100" step="any" data-pct="potfillingPct" value="${r.potfillingPct ?? ""}"></div>
              <div class="fa-perf-input"><label>Planting %</label><input type="number" inputmode="decimal" min="0" max="100" step="any" data-pct="plantingPct" value="${r.plantingPct ?? ""}"></div>
            </div>
          </div>`).join("") : `<div class="rep-empty">No field assistants found yet.</div>`}
      </div>

      <div class="rep-card">
        <h3>Visits</h3>
        <div class="rep-stat-grid">
          <div class="rep-stat"><div class="num">${d.visitsPlanned}</div><div class="lbl">Planned</div></div>
          <div class="rep-stat"><div class="num">${d.visitsCompleted}</div><div class="lbl">Completed</div></div>
          <div class="rep-stat"><div class="num" style="${d.visitsMissed ? "color:var(--obs-issue)" : ""}">${d.visitsMissed}</div><div class="lbl">Missed</div></div>
        </div>
      </div>
      <div class="rep-card">
        <h3>Coverage &amp; lifecycle</h3>
        <div class="rep-row"><span>Sites covered</span><span class="rep-row-val">${d.sitesCovered} / ${d.sitesInvolved}</span></div>
        <div class="rep-row"><span>Issues logged</span><span class="rep-row-val">${d.issuesLogged}</span></div>
        <div class="rep-row"><span>Issues now resolved</span><span class="rep-row-val">${d.issuesNowResolved}</span></div>
        <div class="rep-row"><span>Follow-ups logged</span><span class="rep-row-val">${d.followUpsLogged}</span></div>
        <div class="rep-row"><span>Follow-ups still open</span><span class="rep-row-val">${d.followUpsOpen}</span></div>
      </div>
      ${d.epaRows.length ? `
      <div class="rep-card">
        <h3>EPA coverage</h3>
        ${d.epaRows.map((r) => `<div class="rep-row"><span>${esc(r.epa)}</span><span class="rep-row-val">${r.done}/${r.total}</span></div>`).join("")}
      </div>` : ""}

      <div class="rep-card">
        <h3>This week's items</h3>
        <div class="rep-hint">Choose what goes to your manager: an Update to note, or a Discussion &amp; sign-off that needs a decision.</div>
        ${promoHtml}
        ${composerHtml}
      </div>
    </div>
  `;

  /* --- header --- */
  el.querySelector('[data-role="rep-back"]').addEventListener("click", closeReport);
  el.querySelector('[data-role="rep-week"]').addEventListener("click", () => {
    openSheet("Week", weeks.map((w) => `Week ${w}`), `Week ${d.week}`, (val) => {
      reportWeek = Number(val.replace("Week ", ""));
      addItemDraft = null;
      renderReport();
    });
  });
  el.querySelector('[data-role="rep-copy"]').addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const original = btn.innerHTML;
    try {
      await navigator.clipboard.writeText(buildReportText(d));
      btn.innerHTML = `${icon("check", 14)} Copied`;
    } catch {
      btn.innerHTML = `${icon("x", 14)} Couldn't copy`;
    }
    setTimeout(() => { btn.innerHTML = original; }, 1800);
  });
  el.querySelector('[data-role="rep-print"]').addEventListener("click", () => window.print());

  /* --- personal sustainability (each control patches only its own field;
         setDoc merge keeps the rest of the map) --- */
  el.querySelectorAll('[data-role="ps-score"] button').forEach((b) => b.addEventListener("click", () => {
    const n = Number(b.dataset.score);
    saveWeeklyCheckin(d.week, { personalSustainability: { score: ps.score === n ? null : n } });
  }));
  el.querySelector('[data-role="ps-vac"]').addEventListener("change", (e) => {
    saveWeeklyCheckin(d.week, { personalSustainability: { vacations: e.target.value.trim() } });
  });
  el.querySelectorAll('[data-role="ps-yn"] button').forEach((b) => b.addEventListener("click", () => {
    const val = b.dataset.yn === "yes";
    saveWeeklyCheckin(d.week, { personalSustainability: { lastReportSubmitted: ps.lastReportSubmitted === val ? null : val } });
  }));

  /* --- top priorities --- */
  el.querySelectorAll("[data-prio]").forEach((inp) => inp.addEventListener("change", () => {
    const vals = [...el.querySelectorAll("[data-prio]")].map((i) => i.value.trim()).filter(Boolean);
    saveWeeklyCheckin(d.week, { topPriorities: vals });
  }));

  /* --- FA percents (hand-entered from KoBo) --- */
  el.querySelectorAll(".fa-perf-row").forEach((row) => {
    const fa = row.dataset.fa;
    row.querySelectorAll("[data-pct]").forEach((inp) => inp.addEventListener("change", () => {
      let v = inp.value === "" ? null : Number(inp.value);
      if (v !== null && (!isFinite(v) || v < 0 || v > 100)) { inp.value = ""; v = null; }
      saveWeeklyCheckin(d.week, { faPercents: { [fa]: { [inp.dataset.pct]: v } } });
    }));
  });

  /* --- promotion buckets --- */
  el.querySelectorAll(".promo-item").forEach((row) => {
    row.querySelectorAll("[data-bucket]").forEach((b) => b.addEventListener("click", () => {
      setObservationBucket(row.dataset.obs, b.dataset.bucket || null);
    }));
  });

  /* --- FA-relayed item composer --- */
  const newBtn = el.querySelector('[data-role="item-new"]');
  if (newBtn) newBtn.addEventListener("click", () => {
    addItemDraft = { siteId: "", type: "observation", text: "" };
    renderReport();
  });
  if (addItemDraft) {
    const ta = el.querySelector('[data-role="item-text"]');
    ta.addEventListener("input", () => { addItemDraft.text = ta.value; });
    el.querySelector('[data-role="item-site"]').addEventListener("click", () => {
      const names = [...sites].filter((s) => s.id !== "n-a" && s.name !== "N/A")
        .sort((a, b) => a.name.localeCompare(b.name));
      openSheet("Site", names.map((s) => s.name), addItemDraft.siteId ? siteById(addItemDraft.siteId).name : "", (val) => {
        const hit = names.find((s) => s.name === val);
        if (hit) addItemDraft.siteId = hit.id;
        renderReport();
      });
    });
    el.querySelectorAll('[data-role="item-types"] .type-chip').forEach((chip) => chip.addEventListener("click", () => {
      addItemDraft.type = chip.dataset.type;
      renderReport();
    }));
    el.querySelector('[data-role="item-cancel"]').addEventListener("click", () => { addItemDraft = null; renderReport(); });
    el.querySelector('[data-role="item-save"]').addEventListener("click", async () => {
      const text = ta.value.trim();
      if (!addItemDraft.siteId || !text) { showToast("Choose a site and write the item before saving.", { kind: "error" }); return; }
      const draft = addItemDraft;
      const { siteId, type } = draft;
      addItemDraft = null;
      /* On failure put the draft back so the typed item isn't lost. */
      if (!(await addStandaloneObservation(siteId, d.week, type, text))) addItemDraft = draft;
      renderReport();
    });
  }
}

/* 17) INSTALL PROMPT + SERVICE WORKER */
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstallPrompt = e; document.getElementById("install-btn").style.display = "flex"; });
document.getElementById("install-btn").addEventListener("click", async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null; document.getElementById("install-btn").style.display = "none";
});
if ("serviceWorker" in navigator) {
  /* The service worker takes over as soon as a new version installs, but the
     page already on screen keeps running the old code until it reloads. */
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController) showToast("A new version is ready", { action: "Refresh", onAction: () => location.reload(), persist: true });
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").then((reg) => {
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch((err) => console.warn("SW registration failed:", err));
  });
}
</script>

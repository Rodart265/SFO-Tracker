<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFO Visit Tracker</title>
<meta name="theme-color" content="#1F4E3D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --forest:#1F4E3D; --forest-dark:#153A2C; --forest-soft:#2E6B52;
  --gold:#C9A227; --gold-soft:#E6C765;
  --cream:#F7F5EF; --ink:#1F231C; --ink-soft:#6C7268; --ink-faint:#A2A79A;
  --line:#EAE6DA; --card-bg:#FFFFFF;
  --epa-chilaza-bg:#E7EFF8; --epa-chilaza-fg:#2C5C86; --epa-chilaza-dot:#3E7CB1;
  --epa-mingongo-bg:#EBF1E2; --epa-mingongo-fg:#55702F; --epa-mingongo-dot:#7B9A46;
  --epa-mpingu-bg:#F8ECDA; --epa-mpingu-fg:#B5651D; --epa-mpingu-dot:#CB812F;
  --epa-office-bg:#EEEDE7; --epa-office-fg:#6B6459; --epa-office-dot:#9B9486;
  --status-pending-bg:#FCEFC7; --status-pending-fg:#8A6D00;
  --status-completed-bg:#DCEEDD; --status-completed-fg:#1F4E3D;
  --status-rescheduled-bg:#F8DFC0; --status-rescheduled-fg:#9A4B00;
  --status-skipped-bg:#F4D4CC; --status-skipped-fg:#9C3B26;
  --radius-lg:20px; --radius-md:16px; --radius-sm:12px;
  --shadow-sm:0 1px 2px rgba(31,45,36,.05), 0 1px 1px rgba(31,45,36,.04);
  --shadow-md:0 10px 28px -10px rgba(31,45,36,.20), 0 2px 8px rgba(31,45,36,.06);
  --ease:cubic-bezier(.4,0,.2,1);
  --dur:.22s;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001s !important; animation-duration:.001s !important;}
}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:active{transform:scale(.97);}
input,select,textarea{font-family:inherit;font-size:15px;}

/* ---------- Auth screen ---------- */
#auth-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 26px;gap:20px;}
#auth-screen .mark{width:52px;height:52px;border-radius:16px;background:var(--forest);display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
#auth-screen h1{font-size:23px;margin:0;color:var(--forest-dark);font-weight:700;letter-spacing:-.3px;}
#auth-screen p.sub{margin:0 0 6px;color:var(--ink-soft);font-size:14px;line-height:1.55;}
.field{display:flex;flex-direction:column;gap:7px;}
.field label{font-size:12.5px;color:var(--ink-soft);font-weight:600;letter-spacing:.1px;}
.field input,.field textarea{
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:13px 14px;background:#fff;color:var(--ink);
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--forest-soft);box-shadow:0 0 0 3px rgba(46,107,82,.12);}
.field textarea{resize:vertical;min-height:64px;line-height:1.5;}
.btn-primary{
  background:var(--forest);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:14px 16px;font-size:15px;font-weight:650;letter-spacing:.1px;
  transition:background var(--dur) var(--ease), transform var(--dur) var(--ease);
  box-shadow:var(--shadow-sm);
}
.btn-primary:active{background:var(--forest-dark);}
#auth-error{color:var(--status-skipped-fg);font-size:13px;min-height:16px;line-height:1.4;}

/* ---------- Top bar ---------- */
#top-bar{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(155deg,var(--forest) 0%, var(--forest-dark) 100%);
  color:#fff;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 6px 18px -8px rgba(21,58,44,.5);
}
#top-bar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px;}
#top-bar .actions{display:flex;gap:8px;align-items:center;}
#top-bar button.icon-btn{
  background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:10px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  transition:background var(--dur) var(--ease);
}
#top-bar button.icon-btn:active{background:rgba(255,255,255,.26);}
#offline-banner{
  background:var(--status-rescheduled-bg);color:var(--status-rescheduled-fg);
  font-size:12.5px;font-weight:600;padding:9px 20px;text-align:center;display:none;
}
#offline-banner.show{display:block;}

/* ---------- Tabs ---------- */
#tabs{display:flex;position:relative;padding:14px 20px 0;background:var(--cream);gap:4px;}
.tab-btn{
  flex:1;background:transparent;border:none;padding:11px 4px;font-size:14px;font-weight:650;
  color:var(--ink-faint);transition:color var(--dur) var(--ease);position:relative;z-index:1;
}
.tab-btn.active{color:var(--forest-dark);}
#tab-indicator{
  position:absolute;bottom:0;height:3px;background:var(--gold);border-radius:3px 3px 0 0;
  transition:left var(--dur) var(--ease), width var(--dur) var(--ease);
}

/* ---------- Schedule ---------- */
#schedule-view, #dashboard-view{padding:18px 16px 110px;}
.week-section{margin-bottom:18px;border-radius:var(--radius-lg);background:#fff;overflow:hidden;box-shadow:var(--shadow-sm);}
.week-header{
  display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  background:#fff;cursor:pointer;
}
.week-header .title{font-weight:700;font-size:15px;color:var(--forest-dark);letter-spacing:-.1px;}
.week-header .meta{font-size:12px;color:var(--ink-soft);font-weight:600;}
.week-header .chev{color:var(--ink-faint);transition:transform var(--dur) var(--ease);}
.week-header.open .chev{transform:rotate(180deg);}
.week-body-outer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease);}
.week-body-outer.open{grid-template-rows:1fr;}
.week-body{overflow:hidden;}
.day-group{padding:2px 14px 4px;}
.day-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:700;margin:14px 2px 8px;}

.visit-card{
  border-radius:var(--radius-md);background:#fff;margin-bottom:10px;overflow:hidden;
  border:1px solid var(--line);position:relative;
}
.visit-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--epa-office-dot));}
.visit-card .card-top{padding:14px 16px 12px 18px;}
.badge-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.2px;}
.date-tag{font-size:11px;color:var(--ink-faint);font-weight:600;}
.card-title{font-size:15.5px;font-weight:650;color:var(--ink);margin:0 0 3px;letter-spacing:-.1px;}
.card-sub{font-size:12.5px;color:var(--ink-soft);margin:0;line-height:1.4;}
.status-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px;}
.status-pill{
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  border-radius:99px;padding:8px 6px;font-size:11.5px;font-weight:700;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.status-pill svg{width:12px;height:12px;flex-shrink:0;}
.status-pill.active-pending{background:var(--status-pending-bg);color:var(--status-pending-fg);border-color:transparent;}
.status-pill.active-completed{background:var(--status-completed-bg);color:var(--status-completed-fg);border-color:transparent;}
.status-pill.active-rescheduled{background:var(--status-rescheduled-bg);color:var(--status-rescheduled-fg);border-color:transparent;}
.status-pill.active-skipped{background:var(--status-skipped-bg);color:var(--status-skipped-fg);border-color:transparent;}
.card-footer{display:flex;justify-content:flex-end;padding:0 12px 10px 18px;}
.edit-toggle{
  background:none;border:none;color:var(--forest);font-size:12.5px;font-weight:700;
  display:flex;align-items:center;gap:5px;padding:5px 6px;
}
.edit-panel-outer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease);}
.edit-panel-outer.open{grid-template-rows:1fr;}
.edit-panel{overflow:hidden;}
.edit-panel-inner{padding:4px 16px 18px 18px;border-top:1px solid var(--line);}
.edit-grid{display:flex;flex-direction:column;gap:12px;padding-top:14px;}
.edit-actions{display:flex;gap:10px;margin-top:4px;}
.edit-actions .btn-primary{flex:1;}
.btn-delete{background:none;border:1px solid var(--status-skipped-fg);color:var(--status-skipped-fg);
  border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;font-weight:650;
  transition:background var(--dur) var(--ease);}
.btn-delete:active{background:var(--status-skipped-bg);}

/* segmented control (EPA / Day) */
.segmented{display:flex;gap:4px;background:var(--cream);padding:4px;border-radius:var(--radius-sm);}
.segmented button{flex:1;border:none;background:transparent;padding:10px 4px;border-radius:9px;
  font-size:12.5px;font-weight:650;color:var(--ink-soft);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);}
.segmented button.active{background:#fff;color:var(--forest-dark);box-shadow:var(--shadow-sm);}

/* picker button (opens bottom sheet) */
.picker-btn{width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:13px 14px;background:#fff;display:flex;align-items:center;justify-content:space-between;
  gap:10px;color:var(--ink);font-size:14.5px;line-height:1.4;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);}
.picker-btn:active{background:var(--cream);}
.picker-btn .chevron{color:var(--ink-faint);flex-shrink:0;}
.picker-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* bottom sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(20,24,18,0);pointer-events:none;
  transition:background .28s var(--ease);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet-backdrop.open{background:rgba(20,24,18,.44);pointer-events:auto;}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;box-shadow:var(--shadow-md);
  padding:10px 6px calc(16px + env(safe-area-inset-bottom,0px));max-height:70vh;
  display:flex;flex-direction:column;transform:translateY(102%);transition:transform .3s var(--ease);}
.sheet-backdrop.open .sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:4px auto 12px;}
.sheet-title{font-size:12px;font-weight:700;color:var(--ink-faint);padding:0 16px 8px;
  text-transform:uppercase;letter-spacing:.5px;}
.sheet-list{overflow-y:auto;padding:0 6px 6px;}
.sheet-option{width:100%;text-align:left;background:none;border:none;padding:14px 12px;font-size:15px;
  color:var(--ink);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:space-between;
  gap:10px;line-height:1.4;transition:background var(--dur) var(--ease);}
.sheet-option:active{background:var(--cream);}
.sheet-option.selected{color:var(--forest-dark);font-weight:650;background:var(--epa-chilaza-bg);}
.sheet-option .check-icon{opacity:0;color:var(--forest);flex-shrink:0;}
.sheet-option.selected .check-icon{opacity:1;}

/* ---------- Dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-tile{background:#fff;border-radius:var(--radius-md);padding:16px 16px 14px;box-shadow:var(--shadow-sm);}
.stat-tile .num{font-size:27px;font-weight:750;color:var(--forest-dark);letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.stat-tile .label{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:650;letter-spacing:.1px;}
.dash-card{background:#fff;border-radius:var(--radius-lg);padding:18px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.dash-card h2{font-size:13.5px;margin:0 0 14px;color:var(--forest-dark);font-weight:700;letter-spacing:.1px;
  text-transform:uppercase;}
.epa-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.epa-row .name{font-size:13.5px;font-weight:650;flex:0 0 84px;}
.epa-row .bar-track{flex:1;background:#EFEDE4;border-radius:99px;height:8px;overflow:hidden;}
.epa-row .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--forest-soft),var(--forest-dark));
  transition:width .4s var(--ease);}
.epa-row .count{font-size:12px;color:var(--ink-soft);font-weight:650;flex:0 0 54px;text-align:right;}
.status-chip-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.status-chip{background:var(--cream);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;}
.status-chip .count{font-size:19px;font-weight:750;letter-spacing:-.3px;}
.status-chip .label{font-size:10px;color:var(--ink-soft);font-weight:700;margin-top:3px;letter-spacing:.2px;text-transform:uppercase;}
.assistant-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F2F0E8;}
.assistant-row:last-child{border-bottom:none;}
.avatar{width:37px;height:37px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:750;flex-shrink:0;}
.assistant-info{flex:1;min-width:0;}
.assistant-name{font-size:13.5px;font-weight:650;color:var(--ink);}
.assistant-epa{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.assistant-progress{width:64px;flex-shrink:0;text-align:right;}
.assistant-pct{font-size:12px;font-weight:750;color:var(--forest-dark);}
.mini-track{background:#EFEDE4;border-radius:99px;height:5px;overflow:hidden;margin-top:5px;}
.mini-fill{height:100%;border-radius:99px;background:var(--forest-soft);transition:width .4s var(--ease);}

/* ---------- FAB ---------- */
#fab{
  position:fixed;bottom:26px;right:calc(50% - 280px + 22px);
  background:var(--gold);color:var(--forest-dark);border:none;border-radius:99px;
  width:58px;height:58px;box-shadow:0 10px 24px -6px rgba(201,162,39,.55), var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;z-index:9;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
#fab:active{transform:scale(.93);}
@media (max-width:560px){ #fab{right:22px;} }

.hidden{display:none !important;}
.empty-state{padding:48px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div id="app">

  <div id="auth-screen" class="hidden">
    <div class="mark">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>

          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>

    </button>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-list" id="sheet-list"></div>
    </div>
  </div>

</div>

/* =====================================================================

   ===================================================================== */
const authScreen = document.getElementById("auth-screen");
const mainScreen = document.getElementById("main-screen");
const authError = document.getElementById("auth-error");

document.getElementById("sign-in-btn").addEventListener("click", async () => {
  authError.textContent = "";
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if (!email || !password) { authError.textContent = "Enter your email and password."; return; }
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    authError.textContent = "Sign-in error (" + (err.code || "unknown") + ") — " + err.message;
    console.error(err);
  }
});

document.getElementById("sign-out-btn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (user) {
    authScreen.classList.add("hidden");
    mainScreen.classList.remove("hidden");
    startVisitsListener();
    positionTabIndicator();
  } else {
    mainScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
    if (unsubscribeVisits) { unsubscribeVisits(); unsubscribeVisits = null; }
    visits = [];
  }
});

/* =====================================================================
   5) FIRESTORE — live sync + first-run seed
   ===================================================================== */
function startVisitsListener() {
  const visitsRef = collection(db, "visits");
  const q = query(visitsRef, orderBy("order"));
  unsubscribeVisits = onSnapshot(q, (snap) => {
    if (snap.empty && !seeding) {
      seedInitialSchedule();
      return;
    }
    visits = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => {
    console.error("Visits listener error:", err);
  });
}

async function seedInitialSchedule() {
  seeding = true;
  const visitsRef = collection(db, "visits");
  const batch = writeBatch(db);
  SEED_VISITS.forEach((v) => {
    const ref = doc(visitsRef);
    batch.set(ref, { ...v, updatedAt: serverTimestamp() });
  });
  await batch.commit();
  seeding = false;
}

function nextOrderValue() {
  return visits.reduce((max, v) => Math.max(max, v.order ?? 0), -1) + 1;
}

async function saveVisit(id, patch) {
  await updateDoc(doc(db, "visits", id), { ...patch, updatedAt: serverTimestamp() });
}
async function createVisit(data) {
  await addDoc(collection(db, "visits"), { ...data, order: nextOrderValue(), updatedAt: serverTimestamp() });
}
async function removeVisit(id) {
  await deleteDoc(doc(db, "visits", id));
}

   6) TABS
   ===================================================================== */
function positionTabIndicator() {
  const active = document.querySelector(".tab-btn.active");
  const indicator = document.getElementById("tab-indicator");
  if (!active || !indicator) return;
  indicator.style.left = active.offsetLeft + "px";
  indicator.style.width = active.offsetWidth + "px";
}
window.addEventListener("resize", positionTabIndicator);

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
    positionTabIndicator();
    document.getElementById("schedule-view").classList.toggle("hidden", activeTab !== "schedule");
    document.getElementById("dashboard-view").classList.toggle("hidden", activeTab !== "dashboard");
    document.getElementById("fab").style.display = "flex";
    render();
  });
});

   7) BOTTOM SHEET PICKER
   ===================================================================== */
function openSheet(title, options, currentValue, onSelect) {
  const backdrop = document.getElementById("sheet-backdrop");
  document.getElementById("sheet-title").textContent = title;
  const listEl = document.getElementById("sheet-list");
  listEl.innerHTML = options.map((opt) => `
    <button class="sheet-option ${opt === currentValue ? "selected" : ""}" data-value="${esc(opt)}">
      <span>${esc(opt)}</span>
      <svg class="check-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </button>
  `).join("");
  listEl.querySelectorAll(".sheet-option").forEach((btn) => {
    btn.addEventListener("click", () => { onSelect(btn.dataset.value); closeSheet(); });
  });
  backdrop.classList.add("open");
}
function closeSheet() { document.getElementById("sheet-backdrop").classList.remove("open"); }
document.getElementById("sheet-backdrop").addEventListener("click", (e) => {
  if (e.target.id === "sheet-backdrop") closeSheet();
});

/* =====================================================================
   8) RENDER — Schedule
   ===================================================================== */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function statusClass(status) { return "active-" + (status || "Pending").toLowerCase(); }
function initials(name) {
  if (!name || name === "N/A") return "–";
  return name.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
}
function render() { if (activeTab === "schedule") renderSchedule(); else renderDashboard(); }

function renderSchedule() {
  const el = document.getElementById("schedule-view");
  if (!visits.length) { el.innerHTML = '<div class="empty-state">No visits yet. Tap + to add one.</div>'; return; }

  const weeks = {};
  visits.forEach((v) => { (weeks[v.week] = weeks[v.week] || []).push(v); });
  const weekNums = Object.keys(weeks).map(Number).sort((a, b) => a - b);

  el.innerHTML = weekNums.map((w) => {
    const items = weeks[w];
    const done = items.filter((v) => v.status === "Completed").length;
    const isOpen = openWeeks.has(w);
    const byDay = {};
    items.forEach((v) => { (byDay[v.day] = byDay[v.day] || []).push(v); });
    const dayNames = Object.keys(byDay).sort((a, b) => DAY_ORDER.indexOf(a) - DAY_ORDER.indexOf(b));

    const dayHtml = dayNames.map((d) => `
      <div class="day-group">
        <div class="day-label">${esc(d)}</div>
        ${byDay[d].map(renderCard).join("")}
      </div>
    `).join("");

    return `
      <div class="week-section">
        <div class="week-header ${isOpen ? "open" : ""}" data-week="${w}">
          <span class="title">Week ${w}</span>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="meta">${done}/${items.length} completed</span>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
        <div class="week-body-outer ${isOpen ? "open" : ""}"><div class="week-body">${dayHtml}</div></div>
      </div>
    `;
  }).join("");

  document.querySelectorAll(".week-header").forEach((h) => {
    h.addEventListener("click", () => {
      const w = Number(h.dataset.week);
      openWeeks.has(w) ? openWeeks.delete(w) : openWeeks.add(w);
      renderSchedule();
    });
  });
  wireCardEvents();
  document.getElementById("fab").style.display = openEditId ? "none" : "flex";
}

function renderCard(v) {
  const epaClass = EPA_CLASS[v.epa] || "office";
  const isOpen = openEditId === v.id;
  return `
    <div class="visit-card" data-id="${v.id}" style="--accent:var(--epa-${epaClass}-dot)">
      <div class="card-top">
        <div class="badge-row">
          <span class="badge" style="background:var(--epa-${epaClass}-bg);color:var(--epa-${epaClass}-fg);">${esc(v.epa)}</span>
          ${v.date ? `<span class="date-tag">${esc(v.date)}</span>` : ""}
        </div>
        <p class="card-title">${esc(v.site)}</p>
        <p class="card-sub">${esc(v.assistant)} · ${esc(v.purpose)}</p>
        <div class="status-row" data-role="status-row">
          ${STATUSES.map((s) => `
            <button class="status-pill ${v.status === s ? statusClass(s) : ""}" data-status="${s}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${STATUS_ICON[s]}</svg>
              ${s}
            </button>`).join("")}
        </div>
      </div>
      <div class="card-footer">
        <button class="edit-toggle" data-role="edit-toggle">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          ${isOpen ? "Close" : "Edit details"}
        </button>
      </div>
      <div class="edit-panel-outer ${isOpen ? "open" : ""}"><div class="edit-panel"><div class="edit-panel-inner" data-role="edit-panel-inner">
        ${isOpen ? renderEditFormBody(editDraft) : ""}
      </div></div></div>
    </div>
  `;
}

function renderEditFormBody(d) {
  return `
    <div class="edit-grid" data-role="edit-grid">
      <div class="field"><label>Day</label>
        <div class="segmented" data-role="day-seg">
          ${DAY_ORDER.map((day) => `<button data-value="${day}" class="${d.day === day ? "active" : ""}">${DAY_SHORT[day]}</button>`).join("")}
        </div>
      </div>
      <div class="field"><label>Week</label><input type="number" min="1" data-field="week" value="${d.week}"></div>
      <div class="field"><label>Date</label><input type="date" data-field="date" value="${esc(d.date)}"></div>
      <div class="field"><label>EPA</label>
        <div class="segmented" data-role="epa-seg">
          ${REFERENCE.epas.map((e) => `<button data-value="${esc(e)}" class="${d.epa === e ? "active" : ""}">${esc(e)}</button>`).join("")}
        </div>
      </div>
      <div class="field"><label>Field Assistant</label>
        <button class="picker-btn" data-role="fa-picker" type="button">
          <span>${esc(d.assistant)}</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="field"><label>Site</label>
        <button class="picker-btn" data-role="site-picker" type="button">
          <span>${esc(d.site)}</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="field"><label>Visit Purpose</label>
        <button class="picker-btn" data-role="purpose-picker" type="button">
          <span>${esc(d.purpose)}</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="field"><label>Verification Checklist</label>
        <button class="picker-btn" data-role="checklist-picker" type="button">
          <span>${esc(d.checklist)}</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="field"><label>Physical Count / Field Notes</label><textarea data-field="notes">${esc(d.notes)}</textarea></div>
      <div class="edit-actions">
        <button class="btn-primary" data-role="save-btn" type="button">Save changes</button>
        <button class="btn-delete" data-role="delete-btn" type="button">Delete</button>
      </div>
    </div>
  `;
}

function wireCardEvents() {
  document.querySelectorAll(".visit-card").forEach((card) => {
    const id = card.dataset.id;
    const visit = visits.find((v) => v.id === id);
    if (!visit) return;

    card.querySelectorAll(".status-pill").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const newStatus = btn.dataset.status;
        if (newStatus !== "Pending" && (!visit.epa || !visit.assistant || !visit.site)) {
          alert("Fill in EPA, Field Assistant and Site before marking this " + newStatus + ".");
          return;
        }
        await saveVisit(id, { status: newStatus });
      });
    });

    const toggle = card.querySelector('[data-role="edit-toggle"]');
    toggle.addEventListener("click", () => {
      if (openEditId === id) { openEditId = null; editDraft = null; }
      else { openEditId = id; editDraft = { ...visit }; }
      renderSchedule();
    });

    if (openEditId !== id) return;
    const panelInner = card.querySelector('[data-role="edit-panel-inner"]');
    wireEditForm(panelInner, id, visit);
  });
}

function wireEditForm(panelInner, id, visit) {
  function refresh() {
    panelInner.innerHTML = renderEditFormBody(editDraft);
    wireEditForm(panelInner, id, visit);
  }

  const daySeg = panelInner.querySelector('[data-role="day-seg"]');
  daySeg.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    editDraft.day = b.dataset.value; refresh();
  }));

  const epaSeg = panelInner.querySelector('[data-role="epa-seg"]');
  epaSeg.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    editDraft.epa = b.dataset.value;
    const faList = REFERENCE.faByEpa[editDraft.epa] || [];
    if (!faList.includes(editDraft.assistant)) editDraft.assistant = faList[0];
    const siteList = REFERENCE.sitesByFa[editDraft.assistant] || [];
    if (!siteList.includes(editDraft.site)) editDraft.site = siteList[0];
    refresh();
  }));

  panelInner.querySelector('[data-role="fa-picker"]').addEventListener("click", () => {
    const faList = REFERENCE.faByEpa[editDraft.epa] || [];
    openSheet("Field Assistant", faList, editDraft.assistant, (val) => {
      editDraft.assistant = val;
      const siteList = REFERENCE.sitesByFa[val] || [];
      editDraft.site = siteList[0];
      refresh();
    });
  });

  panelInner.querySelector('[data-role="site-picker"]').addEventListener("click", () => {
    const siteList = REFERENCE.sitesByFa[editDraft.assistant] || [];
    openSheet("Site", siteList, editDraft.site, (val) => { editDraft.site = val; refresh(); });
  });

  panelInner.querySelector('[data-role="purpose-picker"]').addEventListener("click", () => {
    openSheet("Visit Purpose", REFERENCE.purposes, editDraft.purpose, (val) => { editDraft.purpose = val; refresh(); });
  });

  panelInner.querySelector('[data-role="checklist-picker"]').addEventListener("click", () => {
    openSheet("Verification Checklist", REFERENCE.checklists, editDraft.checklist, (val) => { editDraft.checklist = val; refresh(); });
  });

  panelInner.querySelectorAll("[data-field]").forEach((f) => {
    f.addEventListener("input", () => {
      editDraft[f.dataset.field] = f.dataset.field === "week" ? Number(f.value) : f.value;
    });
  });

  panelInner.querySelector('[data-role="save-btn"]').addEventListener("click", async () => {
    const patch = { ...editDraft };
    delete patch.id;
    await saveVisit(id, patch);
    openEditId = null; editDraft = null;
    renderSchedule();
  });

  panelInner.querySelector('[data-role="delete-btn"]').addEventListener("click", async () => {
    if (!confirm("Delete this visit?")) return;
    await removeVisit(id);
    openEditId = null; editDraft = null;
  });
}

/* =====================================================================
   9) RENDER — Dashboard
   ===================================================================== */
function renderDashboard() {
  const el = document.getElementById("dashboard-view");
  if (!visits.length) { el.innerHTML = '<div class="empty-state">Nothing to summarize yet.</div>'; return; }

  const total = visits.length;
  const completed = visits.filter((v) => v.status === "Completed").length;
  const pending = visits.filter((v) => v.status === "Pending").length;
  const pct = total ? Math.round((completed / total) * 100) : 0;

  const epaRows = REFERENCE.epas.map((epa) => {
    const items = visits.filter((v) => v.epa === epa);
    const c = items.filter((v) => v.status === "Completed").length;
    const p = items.length ? Math.round((c / items.length) * 100) : 0;
    return { epa, total: items.length, completed: c, pct: p, cls: EPA_CLASS[epa] };
  }).filter((r) => r.total > 0);

  const statusRows = STATUSES.map((s) => ({ status: s, count: visits.filter((v) => v.status === s).length }));

  const assistants = [...new Set(visits.map((v) => v.assistant).filter((a) => a && a !== "N/A"))];
  const faRows = assistants.map((fa) => {
    const items = visits.filter((v) => v.assistant === fa);
    const c = items.filter((v) => v.status === "Completed").length;
    const p = items.length ? Math.round((c / items.length) * 100) : 0;
    const epa = items[0]?.epa || "";
    return { fa, epa, cls: EPA_CLASS[epa], total: items.length, completed: c, pct: p };
  });

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-tile"><div class="num">${total}</div><div class="label">Total visits</div></div>
      <div class="stat-tile"><div class="num">${pct}%</div><div class="label">Completed</div></div>
      <div class="stat-tile"><div class="num">${completed}</div><div class="label">Done</div></div>
      <div class="stat-tile"><div class="num">${pending}</div><div class="label">Pending</div></div>
    </div>
    <div class="dash-card">
      <h2>EPA balance</h2>
      ${epaRows.map((r) => `
        <div class="epa-row">
          <span class="dot" style="background:var(--epa-${r.cls}-dot)"></span>
          <span class="name">${esc(r.epa)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%"></div></div>
          <span class="count">${r.completed}/${r.total}</span>
        </div>
      `).join("")}
    </div>
    <div class="dash-card">
      <h2>Status summary</h2>
      <div class="status-chip-row">
        ${statusRows.map((r) => `
          <div class="status-chip">
            <div class="count" style="color:var(--status-${r.status.toLowerCase()}-fg)">${r.count}</div>
            <div class="label">${esc(r.status)}</div>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="dash-card">
      <h2>Per-assistant progress</h2>
      ${faRows.map((r) => `
        <div class="assistant-row">
          <div class="avatar" style="background:var(--epa-${r.cls}-bg);color:var(--epa-${r.cls}-fg)">${initials(r.fa)}</div>
          <div class="assistant-info">
            <div class="assistant-name">${esc(r.fa)}</div>
            <div class="assistant-epa">${esc(r.epa)}</div>
            <div class="mini-track"><div class="mini-fill" style="width:${r.pct}%"></div></div>
          </div>
          <div class="assistant-progress"><span class="assistant-pct">${r.pct}%</span></div>
        </div>
      `).join("")}
    </div>
  `;
}

/* =====================================================================
   10) ADD VISIT (floating action button)
   ===================================================================== */
document.getElementById("fab").addEventListener("click", async () => {
  const firstEpa = REFERENCE.epas[0];
  const firstFa = REFERENCE.faByEpa[firstEpa][0];
  const firstSite = REFERENCE.sitesByFa[firstFa][0];
  await createVisit({
    week: Math.max(1, ...visits.map((v) => v.week || 1)),
    day: "Monday", date: "", epa: firstEpa, assistant: firstFa, site: firstSite,
    purpose: REFERENCE.purposes[0], checklist: REFERENCE.checklists[0],
    status: "Pending", notes: "",
  });
  activeTab = "schedule";
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === "schedule"));
  positionTabIndicator();
  document.getElementById("schedule-view").classList.remove("hidden");
  document.getElementById("dashboard-view").classList.add("hidden");
});

/* =====================================================================
   11) OFFLINE BANNER
   ===================================================================== */
function updateOfflineBanner() { document.getElementById("offline-banner").classList.toggle("show", !navigator.onLine); }
window.addEventListener("online", updateOfflineBanner);
window.addEventListener("offline", updateOfflineBanner);
updateOfflineBanner();

/* =====================================================================
   12) INSTALL PROMPT + SERVICE WORKER
   ===================================================================== */
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById("install-btn").style.display = "flex";
});
document.getElementById("install-btn").addEventListener("click", async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById("install-btn").style.display = "none";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch((err) => console.warn("SW registration failed:", err));
  });
}
</script>
</body>
</html>

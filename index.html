<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFO Field Tracker</title>
<meta name="theme-color" content="#1C211E">
<meta name="description" content="Field visit planner and site tracker for the Trees Program">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Tracker">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
--ink:#1C211E; --ink-soft:#4F574F; --ink-faint:#646C64;
--paper:#F4F5F1; --card-bg:#FFFFFF; --line:#D5D9D1;
--leaf:#17653A; --leaf-soft:#2E8A55;
--flag:#FF5A1F; --flag-soft:#FFB38F;

--epa-chilaza-bg:#E3EDF8; --epa-chilaza-fg:#1F5C99; --epa-chilaza-dot:#2F78BF;
--epa-mingongo-bg:#E8F1DA; --epa-mingongo-fg:#476B14; --epa-mingongo-dot:#6E9A2A;
--epa-mpingu-bg:#F9E8CF; --epa-mpingu-fg:#9A540C; --epa-mpingu-dot:#D4800F;
--epa-office-bg:#E9EAE6; --epa-office-fg:#4F574F; --epa-office-dot:#7C837B;

--status-pending-bg:#FCEFC7; --status-pending-fg:#7A5F00;
--status-completed-bg:#D8EEDD; --status-completed-fg:#145A32;
--status-rescheduled-bg:#F8DFC0; --status-rescheduled-fg:#8A4300;
--status-skipped-bg:#F4D4CC; --status-skipped-fg:#9C3B26;

--obs-observation:#4D74A8; --obs-issue:#C0442C; --obs-action:#2E8A55; --obs-followUp:#A8740F;

--radius-lg:8px; --radius-md:6px; --radius-sm:4px;
--shadow-sm:none; --shadow-md:none;
--ease:cubic-bezier(.4,0,.2,1); --dur:.2s;
--navh:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.001s !important;} }
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:none;}
button:active{transform:scale(.97);}
input,select,textarea{font-family:inherit;font-size:15px;}
.ic{display:block;flex-shrink:0;}
a{color:inherit;text-decoration:none;}

/* Auth */
#auth-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 26px;gap:20px;}
#auth-screen .mark{width:52px;height:52px;border-radius:var(--radius-md);background:var(--ink);display:flex;align-items:center;justify-content:center;}
#auth-screen h1{font-size:23px;margin:0;color:var(--ink);font-weight:700;}
#auth-screen p.sub{margin:0 0 6px;color:var(--ink-soft);font-size:14px;line-height:1.55;}
.field{display:flex;flex-direction:column;gap:7px;}
.field label{font-size:13px;color:var(--ink-soft);font-weight:600;}
.field input,.field textarea{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;background:#fff;color:var(--ink);}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--leaf-soft);box-shadow:0 0 0 3px rgba(23,101,58,.22);}
.field textarea{resize:vertical;min-height:64px;line-height:1.5;}
.btn-primary{background:var(--leaf);color:#fff;border-radius:var(--radius-sm);padding:14px 16px;font-size:15px;font-weight:650;box-shadow:var(--shadow-sm);}
.btn-primary:active{background:var(--ink);}
.btn-primary:disabled{opacity:.5;}
#auth-error{color:var(--status-skipped-fg);font-size:13px;min-height:16px;}

/* Top bar */
#top-bar{position:sticky;top:0;z-index:10;background:var(--ink);
  color:#fff;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:4px solid var(--flag);}
#top-bar .row1{display:flex;align-items:center;justify-content:space-between;}
#top-bar h1{font-size:24px;margin:0;font-weight:700;}
#top-bar .actions{display:flex;gap:8px;align-items:center;}
#top-bar button.icon-btn{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;}
#top-bar button.icon-btn:active{background:rgba(255,255,255,.26);}
#sync-pill{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:13px;color:rgba(255,255,255,.75);font-weight:600;}
#sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--flag-soft);}
#sync-pill.offline .dot{background:#E9A98D;}
#sync-pill.synced .dot{background:#8FD3A6;}

/* Bottom nav */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--paper);border-top:2px solid var(--ink);display:flex;justify-content:center;}
#bottom-nav-inner{max-width:560px;width:100%;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;padding:15px 4px 14px;color:var(--ink-soft);border-top:4px solid transparent;}
.nav-btn span{font-size:14px;font-weight:700;}
.nav-btn.active{color:var(--ink);border-top-color:var(--flag);}

.screen{padding:16px 16px calc(var(--navh) + 96px);flex:1;}
.hidden{display:none !important;}
.empty-state{padding:48px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

/* Section title */
.sec-title{color:var(--ink);border-top:3px solid var(--ink);padding-top:8px;margin:26px 0 12px;}
.sec-title:first-child{margin-top:2px;}

/* Week strip */
#week-strip{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
#week-strip::-webkit-scrollbar{display:none;}
.week-chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 16px;min-width:92px;
  box-shadow:var(--shadow-sm);}
.week-chip.active{background:var(--leaf);border-color:var(--leaf);}
.week-chip .wk-label{font-size:13px;font-weight:700;color:var(--ink-soft);text-align:left;}
.week-chip.active .wk-label{color:rgba(255,255,255,.8);}
.week-chip .wk-count{font-size:15px;font-weight:750;color:var(--ink);text-align:left;margin-top:2px;}
.week-chip.active .wk-count{color:#fff;}
.week-chip .wk-track{height:4px;background:#EFEDE4;border-radius:99px;margin-top:6px;overflow:hidden;width:100%;}
.week-chip.active .wk-track{background:rgba(255,255,255,.25);}
.week-chip .wk-fill{height:100%;background:var(--flag);border-radius:99px;}

.day-label{scroll-margin-top:100px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:6px;margin:20px 2px 10px;}

/* Checkin card */
.visit-card{border-radius:var(--radius-md);background:#fff;margin-bottom:10px;overflow:hidden;border:1px solid var(--line);position:relative;}
.visit-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent,var(--epa-office-dot));}
.card-top{padding:14px 16px 14px 22px;}
.badge-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap;}
.badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;}
.date-tag{font-size:13px;color:var(--ink-faint);font-weight:600;}
.site-link{min-height:44px;font-size:15.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:4px;}
.site-link .ic{color:var(--ink-faint);}
.card-sub{font-size:13px;color:var(--ink-soft);margin:2px 0 0;}
.card-who{font-size:13px;color:var(--ink-faint);margin:1px 0 0;}
.sep{display:inline-block;width:1px;height:.85em;background:currentColor;opacity:.35;margin:0 .6em;vertical-align:-.1em;}

.checklist{margin-top:12px;display:flex;flex-direction:column;gap:2px;}
.chk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.chk-head .lbl{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:.3px;}
.chk-head .tally{font-size:13px;font-weight:700;color:var(--leaf);}
.chk-item{display:flex;align-items:center;gap:9px;padding:6px 2px;min-height:48px;width:100%;text-align:left;}
.chk-box{width:24px;height:24px;border-radius:6px;border:2px solid var(--ink-faint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.chk-box.checked{background:var(--leaf-soft);border-color:var(--leaf-soft);}
.chk-text{font-size:15px;color:var(--ink);line-height:1.35;}

.status-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px;}
.status-pill{min-height:48px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:var(--radius-sm);padding:12px 6px;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:4px;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.status-pill svg{width:12px;height:12px;}
.status-pill.active-pending{background:var(--status-pending-bg);color:var(--status-pending-fg);border-color:transparent;}
.status-pill.active-completed{background:var(--status-completed-bg);color:var(--status-completed-fg);border-color:transparent;}
.status-pill.active-rescheduled{background:var(--status-rescheduled-bg);color:var(--status-rescheduled-fg);border-color:transparent;}
.status-pill.active-skipped{background:var(--status-skipped-bg);color:var(--status-skipped-fg);border-color:transparent;}

.card-actions{display:flex;border-top:1px solid var(--line);}
.card-actions button{min-height:48px;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 4px;font-size:13px;font-weight:650;color:var(--leaf);}
.card-actions button:first-child{border-right:1px solid var(--line);}
.card-actions button .badge-count{background:var(--flag);color:var(--ink);border-radius:99px;font-size:13px;font-weight:750;padding:1px 6px;margin-left:2px;}

.drawer-outer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease);}
.drawer-outer.open{grid-template-rows:1fr;}
.drawer{overflow:hidden;}
.drawer-inner{padding:14px 16px 16px 18px;border-top:1px solid var(--line);background:var(--paper);}

.obs-entry{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #EAE7DC;}
.obs-entry:last-child{border-bottom:none;}
.obs-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.obs-body{flex:1;min-width:0;}
.obs-type{font-size:13px;font-weight:750;letter-spacing:.3px;}
.obs-text{font-size:13.5px;color:var(--ink);line-height:1.4;margin-top:2px;}
.obs-meta{font-size:13px;color:var(--ink-faint);margin-top:3px;}

.note-composer{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;}
.type-chips{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap;}
.type-chip{border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;font-weight:650;color:var(--ink-soft);}
.type-chip.active{color:#fff;border-color:transparent;}
.note-composer textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;min-height:56px;resize:vertical;}
.note-composer .save-note{margin-top:9px;width:100%;background:var(--leaf);color:#fff;border-radius:var(--radius-sm);padding:11px;font-size:13.5px;font-weight:650;}

/* Segmented + picker (edit form) */
.segmented{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:var(--radius-sm);}
.segmented button{min-height:44px;flex:1;padding:10px 4px;border-radius:9px;font-size:13px;font-weight:650;color:var(--ink-soft);transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
.segmented button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}
.picker-btn{width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;background:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink);font-size:14.5px;}
.picker-btn .chevron{color:var(--ink-faint);flex-shrink:0;}
.picker-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.edit-grid{display:flex;flex-direction:column;gap:12px;}
.field-hint{font-weight:500;color:var(--ink-soft);margin-left:6px;}
.segmented.locked{opacity:.6;}
.field input:disabled{background:var(--paper);color:var(--ink-soft);}
.edit-actions{display:flex;gap:10px;margin-top:4px;}
.edit-actions .btn-primary{flex:1;}
.btn-delete{border:1px solid var(--status-skipped-fg);color:var(--status-skipped-fg);border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;font-weight:650;}

/* Bottom sheet */
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 88px);transform:translate(-50%,12px);z-index:70;width:max-content;max-width:calc(100% - 24px);display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-left:4px solid var(--leaf-soft);border-radius:var(--radius-md);padding:6px 8px 6px 16px;font-size:14px;font-weight:600;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);}
.toast.open{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast.error{border-left-color:var(--flag);}
.toast button{color:var(--flag-soft);font-size:14px;font-weight:700;min-height:44px;min-width:56px;padding:0 10px;}
.dialog-backdrop{position:fixed;inset:0;background:rgba(20,24,18,0);pointer-events:none;transition:background .2s var(--ease);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
.dialog-backdrop.open{background:rgba(20,24,18,.5);pointer-events:auto;}
.dialog{width:100%;max-width:560px;background:#fff;border-radius:16px 16px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s var(--ease);}
.dialog-backdrop.open .dialog{transform:translateY(0);}
.dialog-title{font-size:18px;font-weight:700;margin-bottom:6px;}
.dialog-msg{margin:0 0 14px;color:var(--ink-soft);font-size:14.5px;line-height:1.5;}
.dialog-msg:empty{display:none;}
.dialog-field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:14px;}
.dialog-field[hidden]{display:none;}
.dialog-field input{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;font-size:16px;color:var(--ink);background:#fff;}
.dialog-actions{display:flex;gap:10px;}
.dialog-actions button{flex:1;min-height:48px;border-radius:var(--radius-sm);font-size:15px;font-weight:650;}
.dialog-actions .btn-ghost{border:1px solid var(--line);color:var(--ink);background:#fff;}
.dialog-actions .btn-danger{background:var(--status-skipped-fg);color:#fff;}
.pending-tag{font-size:13px;font-weight:700;color:var(--status-pending-fg);background:var(--status-pending-bg);padding:3px 8px;border-radius:99px;}
.card-note{font-size:13px;color:var(--ink-soft);margin:4px 0 0;}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px;}
.field input:focus-visible,.field textarea:focus-visible{outline:none;}
#fab{transition:padding .2s var(--ease),width .2s var(--ease);}
#fab.compact{width:56px;height:56px;padding:0;border-radius:50%;}
#fab.compact span{display:none;}
.epa-label{font-weight:700;}
.pw-toggle{position:absolute;right:4px;top:0;bottom:0;min-width:56px;color:var(--leaf);font-size:14px;font-weight:700;}
.sheet-backdrop{position:fixed;inset:0;background:rgba(20,24,18,0);pointer-events:none;transition:background .28s var(--ease);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
.sheet-backdrop.open{background:rgba(20,24,18,.44);pointer-events:auto;}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;box-shadow:var(--shadow-md);padding:10px 6px calc(16px + env(safe-area-inset-bottom,0px));
  max-height:76vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .3s var(--ease);}
.sheet-backdrop.open .sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:4px auto 12px;}
.sheet-title{font-size:13px;font-weight:700;color:var(--ink-faint);padding:0 16px 8px;letter-spacing:.5px;}
.sheet-list{overflow-y:auto;padding:0 6px 6px;}
.sheet-option{width:100%;text-align:left;background:none;border:none;padding:14px 12px;font-size:15px;color:var(--ink);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:space-between;gap:10px;line-height:1.4;}
.sheet-option:active{background:var(--paper);}
.sheet-option.selected{color:var(--ink);font-weight:650;background:var(--epa-chilaza-bg);}
.sheet-option .check-icon{opacity:0;color:var(--leaf);flex-shrink:0;}
.sheet-option.selected .check-icon{opacity:1;}
.sheet-form{padding:6px 16px 4px;}

/* Sites & Team */
.search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:12px;}
.search-bar input{border:none;outline:none;flex:1;background:none;font-size:14.5px;}
.search-bar .ic{color:var(--ink-faint);}
.pill-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.pill-row::-webkit-scrollbar{display:none;}
.filter-pill{min-height:48px;flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:8px 15px;font-size:13px;font-weight:650;color:var(--ink-soft);}
.filter-pill.active{background:var(--leaf);color:#fff;border-color:var(--leaf);}
.site-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);width:100%;}
.site-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.site-row .info{flex:1;min-width:0;text-align:left;}
.site-row .name{font-size:14.5px;font-weight:700;}
.site-row .meta{font-size:13px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;align-items:center;}
.site-row .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--ink-faint);}
.issue-flag{display:flex;align-items:center;gap:3px;color:var(--obs-issue);font-size:13px;font-weight:700;}

/* Site profile */
#site-profile-screen{position:fixed;inset:0;background:var(--paper);z-index:30;display:flex;flex-direction:column;overflow-y:auto;}
.sp-top{background:var(--ink);color:#fff;padding:16px 18px calc(20px + env(safe-area-inset-top,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));}
.sp-back{min-height:48px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);font-size:13px;font-weight:650;margin-bottom:14px;}
.sp-name{font-size:22px;font-weight:750;}
.sp-sub{font-size:13px;color:rgba(255,255,255,.7);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.sp-body{padding:16px;margin-top:-14px;}
.sp-card{background:#fff;border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-md);}
.nm-row{display:flex;align-items:center;gap:12px;}
.nm-avatar{width:44px;height:44px;border-radius:50%;background:var(--epa-chilaza-bg);color:var(--epa-chilaza-fg);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:14px;flex-shrink:0;}
.nm-info{flex:1;min-width:0;}
.nm-name{font-size:14.5px;font-weight:700;}
.nm-phone{font-size:13px;color:var(--ink-soft);margin-top:1px;}
.call-btn{background:var(--leaf);color:#fff;border-radius:99px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-sm);}
.call-btn:disabled{background:var(--line);color:var(--ink-faint);}
.target-row{display:flex;justify-content:space-between;align-items:baseline;}
.target-num{font-size:26px;font-weight:750;color:var(--ink);letter-spacing:-.3px;}
.target-label{font-size:13px;color:var(--ink-soft);font-weight:650;}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.sp-stat{background:#fff;border-radius:var(--radius-md);padding:13px 10px;text-align:center;box-shadow:var(--shadow-sm);}
.sp-stat .num{font-size:19px;font-weight:750;color:var(--ink);}
.sp-stat .lbl{font-size:13px;color:var(--ink-soft);font-weight:650;margin-top:2px;}
.history-item{background:#fff;border-radius:var(--radius-md);padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.history-head{display:flex;justify-content:space-between;align-items:center;}
.history-head .when{font-size:13px;font-weight:700;}
.history-head .purpose{font-size:13px;color:var(--ink-soft);margin-top:2px;}

/* Analytics */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-tile{background:#fff;border-radius:var(--radius-md);padding:16px 16px 14px;box-shadow:var(--shadow-sm);}
.stat-tile .num{font-size:27px;font-weight:750;color:var(--ink);letter-spacing:-.5px;}
.stat-tile .label{font-size:13px;color:var(--ink-soft);margin-top:3px;font-weight:650;}
.dash-card{background:#fff;border-radius:var(--radius-lg);padding:18px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.dash-card h2{font-size:13.5px;margin:0 0 14px;color:var(--ink);font-weight:700;}
.dist-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-bottom:10px;}
.dist-legend{display:flex;flex-wrap:wrap;gap:10px;}
.dist-legend .item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-soft);font-weight:600;}
.dist-legend .sw{width:9px;height:9px;border-radius:3px;}
.epa-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.epa-row .name{font-size:13.5px;font-weight:650;flex:0 0 84px;}
.epa-row .bar-track{flex:1;background:#EFEDE4;border-radius:99px;height:8px;overflow:hidden;}
.epa-row .bar-fill{height:100%;border-radius:99px;background:var(--leaf);}
.epa-row .count{font-size:13px;color:var(--ink-soft);font-weight:650;flex:0 0 54px;text-align:right;}
.assistant-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F2F0E8;}
.assistant-row:last-child{border-bottom:none;}
.avatar{width:37px;height:37px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:750;flex-shrink:0;}
.assistant-info{flex:1;min-width:0;}
.assistant-name{font-size:13.5px;font-weight:650;}
.assistant-epa{font-size:13px;color:var(--ink-soft);margin-top:1px;}
.mini-track{background:#EFEDE4;border-radius:99px;height:5px;overflow:hidden;margin-top:5px;}
.mini-fill{height:100%;border-radius:99px;background:var(--leaf-soft);}
.assistant-pct{font-size:13px;font-weight:750;color:var(--ink);}

#fab{position:fixed;bottom:calc(var(--navh) + 20px);right:calc(50% - 280px + 18px);background:var(--flag);color:var(--ink);border-radius:var(--radius-md);height:52px;padding:0 20px 0 16px;gap:8px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:9;border:2px solid var(--ink);}
@media (max-width:560px){ #fab{right:18px;} }

/* ---- Today screen ---- */
.today-hero{margin:2px 2px 18px;display:flex;flex-direction:column-reverse;}
.today-greet{font-size:20px;font-weight:750;color:var(--ink);letter-spacing:-.3px;}
.today-date{font-size:13px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
.today-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:6px;border-top:3px solid var(--ink);border-bottom:1px solid var(--line);}
.today-stat:last-child{border-right:none;}
.today-stat{padding:12px 4px 10px;text-align:left;border-right:1px solid var(--line);padding-left:10px;}
.today-stat .num{font-size:20px;font-weight:750;color:var(--ink);line-height:1.1;}
.today-stat .lbl{font-size:13px;color:var(--ink-soft);font-weight:700;margin-top:3px;letter-spacing:.2px;}
.today-stat.warn .num{color:var(--obs-issue);}

.attn-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent,var(--ink-faint));border-radius:var(--radius-md);
  padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:11px;width:100%;text-align:left;box-shadow:var(--shadow-sm);}
.attn-card .attn-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--accent-bg,var(--paper));color:var(--accent,var(--ink-soft));}
/* These live inside a <button>, so they must be spans (a div is invalid there).
   Spans are inline by default, which would collapse all three onto one line. */
.attn-card .attn-body{flex:1;min-width:0;display:block;}
.attn-card .attn-title{display:block;font-size:14px;font-weight:700;color:var(--ink);}
.attn-card .attn-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.attn-card .attn-tag{display:block;font-size:13px;font-weight:750;letter-spacing:.3px;color:var(--accent,var(--ink-soft));margin-bottom:2px;}
.attn-card > .ic{color:var(--ink-faint);flex-shrink:0;}
.all-clear{background:var(--status-completed-bg);color:var(--status-completed-fg);border-radius:var(--radius-md);
  padding:16px;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:9px;}

.week-progress{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:15px 16px;box-shadow:var(--shadow-sm);}
.week-progress .wp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
.week-progress .wp-num{font-size:19px;font-weight:750;color:var(--ink);}
.week-progress .wp-pct{font-size:13px;font-weight:750;color:var(--leaf);}
.week-progress .wp-track{height:8px;background:#EFEDE4;border-radius:99px;overflow:hidden;}
.week-progress .wp-fill{height:100%;border-radius:99px;background:var(--leaf);}

/* ---- Issue / follow-up lifecycle ---- */
.obs-status-row{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
.obs-status-btn{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:4px 10px;font-size:13px;font-weight:700;color:var(--ink-soft);}
.obs-status-btn.on-open{background:var(--status-skipped-bg);color:var(--status-skipped-fg);border-color:transparent;}
.obs-status-btn.on-progress{background:var(--status-pending-bg);color:var(--status-pending-fg);border-color:transparent;}
.obs-status-btn.on-resolved{background:var(--status-completed-bg);color:var(--status-completed-fg);border-color:transparent;}
.obs-assign{font-size:13px;color:var(--ink-soft);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.obs-assign .due-over{color:var(--obs-issue);font-weight:700;}
.obs-entry.resolved .obs-text{color:var(--ink-soft);}
.composer-extra{display:flex;flex-direction:column;gap:9px;margin-top:9px;}
.composer-extra .mini-label{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:.3px;}
.composer-extra input[type="date"]{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:#fff;color:var(--ink);}
.composer-extra .picker-btn{padding:10px 12px;font-size:13.5px;}

/* ---- Add check-in overlay ---- */
#add-checkin-screen{position:fixed;inset:0;background:var(--paper);z-index:40;display:flex;flex-direction:column;overflow-y:auto;}
.ac-top{background:var(--ink);color:#fff;
  padding:16px 18px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));}
.ac-back{min-height:48px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);font-size:13px;font-weight:650;margin-bottom:12px;}
.ac-title{font-size:21px;font-weight:750;}
.ac-sub{font-size:13px;color:rgba(255,255,255,.7);margin-top:3px;}
.ac-body{padding:16px 16px calc(var(--navh) + 40px);max-width:560px;width:100%;margin:0 auto;}
.ac-card{background:#fff;border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-md);}
.form-error{color:var(--status-skipped-fg);font-size:13px;font-weight:650;min-height:16px;}
.picker-btn.placeholder span{color:var(--ink-faint);}

/* ---- Global search results ---- */
.res-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:9px;
  width:100%;text-align:left;box-shadow:var(--shadow-sm);display:flex;gap:10px;align-items:flex-start;}
.res-card .res-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.res-card .res-body{flex:1;min-width:0;display:block;}
.res-card .res-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.res-card .res-site{font-size:13.5px;font-weight:700;}
.res-card .res-type{font-size:13px;font-weight:750;letter-spacing:.3px;}
.res-card .res-text{font-size:13px;color:var(--ink-soft);line-height:1.4;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.res-card .res-meta{display:block;font-size:13px;color:var(--ink-faint);margin-top:3px;}
/* The status chip is a span inside a button here, not a real control. */
.res-card .obs-status-btn{display:inline-block;}
mark{background:var(--flag-soft);color:var(--ink);border-radius:3px;padding:0 2px;}

/* ---- Activity feed (Today screen) ---- */
.activity-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #F2F0E8;width:100%;text-align:left;}
.activity-item:last-child{border-bottom:none;}
.activity-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.activity-body{flex:1;min-width:0;display:block;}
.activity-line{font-size:13px;color:var(--ink);display:block;}
.activity-line b{font-weight:700;}
.activity-time{font-size:13px;color:var(--ink-faint);margin-top:2px;display:block;}

/* ---- Risk (Analytics screen) ---- */
.risk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F2F0E8;width:100%;text-align:left;}
.risk-row:last-child{border-bottom:none;}
.risk-row .risk-name{font-size:13.5px;font-weight:700;color:var(--ink);}
.risk-row .risk-body{flex:1;min-width:0;display:block;}
.risk-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.risk-badge{font-size:13px;font-weight:700;padding:2px 7px;border-radius:99px;display:inline-flex;align-items:center;gap:3px;}
.risk-badge.issue{background:var(--status-skipped-bg);color:var(--status-skipped-fg);}
.risk-badge.followup{background:var(--status-pending-bg);color:var(--status-pending-fg);}
.risk-badge.stale{background:var(--epa-mpingu-bg);color:var(--epa-mpingu-fg);}
.risk-badge.never{background:var(--epa-office-bg);color:var(--epa-office-fg);}
.risk-badge.repeat{background:#F1E4F2;color:#7A3E7F;}
.risk-empty{font-size:13px;color:var(--ink-soft);padding:6px 0;}
.report-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius-md);padding:14px;font-size:14px;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm);margin-bottom:14px;}

/* ---- Weekly report overlay ---- */
#report-screen{position:fixed;inset:0;background:var(--paper);z-index:41;display:flex;flex-direction:column;overflow-y:auto;}
.rep-top{background:var(--ink);color:#fff;
  padding:16px 18px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px));}
.rep-back{min-height:48px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);font-size:13px;font-weight:650;margin-bottom:12px;}
.rep-title-row{display:flex;justify-content:space-between;align-items:center;}
.rep-title{font-size:20px;font-weight:750;}
.rep-week-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;color:#fff;}
.rep-actions{display:flex;gap:8px;margin-top:14px;}
.rep-actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.14);
  border-radius:var(--radius-sm);padding:10px;font-size:13px;font-weight:700;color:#fff;}
.rep-body{padding:16px 16px calc(var(--navh) + 40px);max-width:560px;width:100%;margin:0 auto;}
.rep-card{background:#fff;border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.rep-card h3{font-size:13px;margin:0 0 10px;color:var(--ink);font-weight:750;letter-spacing:.3px;}
.rep-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.rep-stat{text-align:center;}
.rep-stat .num{font-size:19px;font-weight:750;color:var(--ink);}
.rep-stat .lbl{font-size:13px;color:var(--ink-soft);font-weight:650;margin-top:2px;}
.rep-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F2F0E8;font-size:13px;}
.rep-row:last-child{border-bottom:none;}
.rep-row .rep-row-val{font-weight:700;color:var(--ink);}
.rep-note{padding:9px 0;border-bottom:1px solid #F2F0E8;}
.rep-note:last-child{border-bottom:none;}
.rep-note .rn-head, .promo-item .rn-head{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700;}
.rep-note .rn-type{letter-spacing:.3px;font-size:13px;}
.rep-note .rn-text, .promo-item .rn-text{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.rep-empty{font-size:13px;color:var(--ink-soft);padding:4px 0;}
.rep-hint{font-size:13px;color:var(--ink-soft);margin:-4px 0 10px;line-height:1.4;}
.ps-score-row{display:flex;gap:8px;margin-bottom:12px;}
.ps-score-row button,.promo-seg button,.ps-yn button{flex:1;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 6px;font-size:13px;font-weight:650;color:var(--ink-soft);background:#fff;}
.ps-score-row button.active,.promo-seg button.active,.ps-yn button.active{background:var(--leaf);color:#fff;border-color:transparent;}
.promo-seg button.active.seg-update{background:var(--obs-observation);}
.promo-seg button.active.seg-signoff{background:var(--flag);color:var(--ink);}
.ps-label{font-size:13px;color:var(--ink-soft);font-weight:600;margin:10px 0 5px;display:block;}
.ps-yn{display:flex;gap:8px;}
.rep-card input[type="text"],.rep-card input[type="number"],.rep-card textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:#fff;color:var(--ink);}
.rep-card input:focus,.rep-card textarea:focus{outline:none;border-color:var(--leaf-soft);box-shadow:0 0 0 3px rgba(23,101,58,.22);}
.priority-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.priority-row input{flex:1;}
.priority-row button{color:var(--ink-faint);padding:6px;}
.fa-perf-row{padding:10px 0;border-bottom:1px solid #F2F0E8;}
.fa-perf-row:last-child{border-bottom:none;}
.fa-perf-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;}
.fa-perf-head .fa-visits{font-size:13px;color:var(--ink-soft);font-weight:600;}
.fa-perf-target{font-size:13px;color:var(--ink-soft);margin:3px 0 8px;}
.fa-perf-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fa-perf-input label{display:block;font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
.promo-item{padding:11px 0;border-bottom:1px solid #F2F0E8;}
.promo-item:last-of-type{border-bottom:none;}
.promo-seg{display:flex;gap:6px;margin-top:8px;}
.promo-seg button{padding:7px 4px;font-size:13px;}
.add-item-btn{width:100%;margin-top:12px;border:1px dashed var(--leaf-soft);color:var(--leaf);border-radius:var(--radius-sm);padding:11px;font-size:13px;font-weight:650;}
.add-item-box{margin-top:12px;padding-top:12px;border-top:1px solid #F2F0E8;}
.add-item-box .pick-site{width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:#fff;margin-bottom:9px;font-size:14px;}
.add-item-actions{display:flex;gap:8px;margin-top:10px;}
.add-item-actions .btn-primary{flex:1;padding:11px;}
.add-item-actions .cancel{border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;font-weight:650;color:var(--ink-soft);}
@media print{.promo-seg,.add-item-btn,.add-item-box,.priority-row button{display:none !important;}}

@media print{
  body *{visibility:hidden;}
  #report-screen, #report-screen *{visibility:visible;}
  #report-screen{position:absolute;inset:0;overflow:visible;background:#fff;}
  #report-screen .no-print{display:none !important;}
  .rep-top{background:#fff !important;color:var(--ink) !important;padding:0 0 14px;}
  .rep-title{color:var(--ink);}
  .rep-body{padding:0;max-width:100%;}
  .rep-card{box-shadow:none;border:1px solid var(--line);break-inside:avoid;}
}

/* Type system. Condensed heavy Archivo for names, numbers and headings (road-sign
   proportions, readable in glare); normal width for everything you read. */
.headline,.site-link,.sp-name,.today-date,.ac-title,.rep-title,.target-num,
.today-stat .num,.stat-tile .num,.sp-stat .num,.rep-stat .num,.wp-num,.wk-count,
.sec-title,.day-label,.dash-card h2,.rep-card h3,.epa-row .name,.attn-title{
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-stretch:72%;font-weight:800;letter-spacing:.01em;}
.today-date{font-size:36px;line-height:1.02;color:var(--ink);margin:0 0 4px;}
.today-greet{font-size:15px;font-stretch:100%;font-weight:600;color:var(--ink-soft);letter-spacing:0;}
.sec-title{font-size:19px;}
.day-label{font-size:16px;}
.site-link{font-size:24px;line-height:1.1;}
.sp-name{font-size:34px;line-height:1.05;}
.ac-title,.rep-title{font-size:28px;}
.today-stat .num{font-size:32px;}
.stat-tile .num{font-size:38px;}
.sp-stat .num{font-size:30px;}
.rep-stat .num{font-size:26px;}
.wp-num{font-size:26px;}
.target-num{font-size:36px;}
.dash-card h2,.rep-card h3{font-size:17px;}
.attn-title{font-size:18px;}
.epa-row .name{font-size:16px;flex-basis:96px;}
.today-stat .lbl,.sp-stat .lbl,.rep-stat .lbl{font-size:13px;color:var(--ink-soft);}

/* ============ V1.0 additions ============ */
button{min-height:44px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.btn-link{color:var(--leaf);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0 4px;align-self:flex-start;}
#auth-info{color:var(--status-completed-fg);font-size:13px;min-height:0;}
#auth-info:empty{display:none;}
#gate-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 26px;}
.gate-card h1{font-size:28px;line-height:1.1;margin:0 0 10px;}
.gate-card p{margin:0 0 18px;color:var(--ink-soft);font-size:15px;line-height:1.55;overflow-wrap:anywhere;}
.gate-actions{display:flex;gap:10px;flex-wrap:wrap;}
.gate-actions .btn-primary{flex:1;}
.btn-outline{border:1px solid var(--ink-faint);border-radius:var(--radius-sm);padding:12px 16px;font-size:15px;font-weight:650;color:var(--ink);background:#fff;}
.type-chip,.ps-score-row button,.promo-seg button,.ps-yn button,.rep-actions button,.rep-week-btn,.add-item-btn,.add-item-actions .cancel{min-height:44px;}

/* Sync pill: Offline / Syncing / Synced */
#sync-pill{display:inline-flex;padding:4px 10px 4px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:#fff;}
#sync-pill.offline{background:var(--flag);color:var(--ink);}
#sync-pill.offline .dot{background:var(--ink);}
#sync-pill.syncing .dot{background:var(--flag-soft);animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#sync-pill.syncing .dot{animation:none}}

/* Loading / error / empty */
.loading{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:14px;font-weight:600;}
.err-banner{background:var(--status-skipped-bg);color:var(--status-skipped-fg);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600;line-height:1.45;}
.err-banner .btn-link{color:var(--status-skipped-fg);}
.empty-state b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;}

/* Visit evidence + start */
.start-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:13px;background:var(--leaf);color:#fff;border-radius:var(--radius-sm);font-size:16px;font-weight:750;}
.start-btn:disabled{opacity:.7;}
.start-btn:active{background:var(--ink);}
.ev-line{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:9px 11px;border-radius:var(--radius-sm);font-size:13px;line-height:1.4;font-weight:600;background:var(--paper);color:var(--ink-soft);}
.ev-line .ic{margin-top:2px;}
.ev-line.ok{background:var(--status-completed-bg);color:var(--status-completed-fg);}
.ev-line.bad{background:var(--status-skipped-bg);color:var(--status-skipped-fg);}
.ev-line.warn{background:var(--status-pending-bg);color:var(--status-pending-fg);}
.ev-line small{display:block;font-weight:500;opacity:.9;}
.progress-tag{font-size:13px;font-weight:700;color:var(--epa-chilaza-fg);background:var(--epa-chilaza-bg);padding:3px 8px;border-radius:99px;}
.photo-strip{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.photo-strip::-webkit-scrollbar{display:none;}
.photo-thumb{position:relative;flex:0 0 auto;width:76px;height:76px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);background:var(--paper);display:block;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .wait{position:absolute;left:0;right:0;bottom:0;background:rgba(28,33,30,.82);color:#fff;font-size:11px;font-weight:700;text-align:center;padding:2px 0;}
.card-actions button:nth-child(2){border-left:1px solid var(--line);}
.card-actions button:nth-child(3){border-left:1px solid var(--line);}
.card-actions button:first-child{border-right:none;}

/* This-week counters */
.week-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px;}
.week-head .wk-title{font-size:22px;}
.week-step{display:flex;gap:6px;}
.week-step button{width:48px;border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--ink);}
.week-step button:disabled{opacity:.35;}
.counters{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:10px;}
.counter{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 12px;min-height:68px;}
.counter .num{font-size:30px;line-height:1;color:var(--ink);font-family:"Archivo",sans-serif;font-stretch:72%;font-weight:800;}
.counter .lbl{font-size:13px;color:var(--ink-soft);font-weight:650;margin-top:4px;line-height:1.2;}
.counter.alert .num{color:var(--obs-issue);}
.counter.good .num{color:var(--status-completed-fg);}

/* Team */
.seg-top{display:flex;gap:4px;background:#fff;border:1px solid var(--line);padding:4px;border-radius:var(--radius-sm);margin-bottom:12px;}
.seg-top button{flex:1;border-radius:3px;font-size:14px;font-weight:700;color:var(--ink-soft);}
.seg-top button.active{background:var(--ink);color:#fff;}
.site-row .chip,.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle;}
.chip-warn{background:var(--status-pending-bg);color:var(--status-pending-fg);}
.chip-bad{background:var(--status-skipped-bg);color:var(--status-skipped-fg);}
.site-row.closed{opacity:.7;}
.data-flag{color:var(--status-pending-fg);font-size:13px;font-weight:700;}
.sp-card .field-hint{font-size:13px;margin-left:0;}
.coords{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--ink-soft);margin-top:4px;overflow-wrap:anywhere;}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function todayDayName() { return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()]; }
function fmtLongDate(iso) {
  const d = iso ? new Date(iso + "T00:00:00") : new Date();
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
}
function fmtShortDate(iso) {
  if (!iso) return "";

  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

/* --- Schedule math ---
   Check-ins carry a planned week number and weekday, and optionally a real
   date. Week numbers have no calendar anchor of their own, so the anchor (the
   Monday of Week 1) is inferred from the check-ins that already have dates:
   each one votes for the Week-1 Monday it implies, and the majority wins. If
   the inference is ever wrong, set PROGRAM_WEEK1_MONDAY below. */
const PROGRAM_WEEK1_MONDAY = ""; // optional hard-coded override; normally an admin sets meta/program.week1Monday
function isoFromDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function validISO(iso) {
  if (typeof iso !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const d = new Date(iso + "T00:00:00");
  return !isNaN(d) && isoFromDate(d) === iso; // round-trip rejects 2026-02-30 and the like
}
function addDaysISO(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoFromDate(d); }
function daysBetweenISO(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function mondayOfISO(iso) { return addDaysISO(iso, -((new Date(iso + "T00:00:00").getDay() + 6) % 7)); }
function weekdayName(iso) {
  if (!validISO(iso)) return null;
  const n = new Date(iso + "T00:00:00").getDay();
  return n >= 1 && n <= 5 ? DAY_ORDER[n - 1] : null; // null on weekends
}
/* Order of trust: the admin-set date in meta/program (so every phone agrees),
   then the hard-coded override, then a majority vote of dated visits. */
function programStart() {
  if (programDoc && validISO(programDoc.week1Monday)) return programDoc.week1Monday;
  if (validISO(PROGRAM_WEEK1_MONDAY)) return PROGRAM_WEEK1_MONDAY;
  const votes = {};
  checkins.forEach((c) => {
    if (!validISO(c.date) || !Number.isFinite(c.week) || c.week < 1) return;
    const start = addDaysISO(mondayOfISO(c.date), -7 * (c.week - 1));
    votes[start] = (votes[start] || 0) + 1;
  });
  let best = null, bestN = 0;
  Object.entries(votes).forEach(([k, n]) => { if (n > bestN) { best = k; bestN = n; } });
  return best;
}
function weekOfISO(iso) {
  const start = programStart();
  if (!start || !validISO(iso)) return null;
  return Math.floor(daysBetweenISO(start, iso) / 7) + 1;
}
/* The week the team is in right now, limited to weeks that exist. With no
   dated check-ins to anchor on, falls back to the first week that still has
   unfinished visits. */
function currentWeek() {
  const weeks = [...new Set(checkins.map((c) => c.week))].filter(Number.isFinite).sort((a, b) => a - b);
  if (!weeks.length) return 1;
  const w = weekOfISO(todayISO());
  if (w !== null) return Math.min(Math.max(w, weeks[0]), weeks[weeks.length - 1]);
  const open = weeks.find((wk) => checkins.some((c) => c.week === wk && c.status !== "Completed"));
  return open ?? weeks[weeks.length - 1];
}
/* The weekday a check-in actually belongs under: the real weekday of its date
   when it has one (Mon-Fri), otherwise the planned weekday it was seeded with. */
function effectiveDay(c) { return (c.date && weekdayName(c.date)) || c.day; }
/* A date is the one fact people set by hand. Day and week follow from it, so
   the three can no longer disagree. Weekend dates leave the day alone. */
function applyDateToDraft(draft) {
  if (!validISO(draft.date)) return draft;
  const wd = weekdayName(draft.date);
  if (wd) draft.day = wd;
  const w = weekOfISO(draft.date);
  if (w !== null && w >= 1) draft.week = w;
  return draft;
}
function fmtDayDate(iso) {
  if (!validISO(iso)) return iso || "";
  return new Date(iso + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}

function slugify(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name) { if (!name || name === "N/A") return "–"; return name.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase(); }
function fmtNum(n) { return typeof n === "number" ? n.toLocaleString() : "–"; }

async function beginSession(user) {

  if (access.kind !== "ok") { showGate(access.kind, user, access.err); return; }

  render();

/* Roles live in users/<uid>. getDoc reads the phone's cache first, so a person who
   has signed in before can still open the app with no signal. */
async function checkAccess(user) {
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    const role = snap.exists() ? snap.data().role : null;
    if (role === "admin" || role === "member") return { kind: "ok", role };
    return { kind: "noaccess" };
  } catch (err) {
    if (err && err.code === "permission-denied") return { kind: "noaccess" };
    if (!navigator.onLine || (err && err.code === "unavailable")) return { kind: "offline", err };
    return { kind: "error", err };
  }
}

const SETUP_INCOMPLETE_TEXT = "Setup incomplete — ask an admin to run the seed script";
const NO_ACCESS_TEXT = "No access — ask an admin to add your account";
async function checkSetup() {
  const seq = authSeq;
  try {
    const metaSnap = await getDoc(doc(db, "meta", "schemaV2"));
    if (seq !== authSeq) return;
    setupIncomplete = !(metaSnap.exists() && metaSnap.data().done);
  } catch (err) {
    if (seq !== authSeq) return;
    console.warn("Setup check failed:", err.code || err);
    setupIncomplete = false; // unknown, so don't claim setup is unfinished
  }
  updateSyncPill(); render();
}

/* 7) FIRESTORE LISTENERS */
const LISTEN_LABEL = { sites: "sites", checkins: "visits", observations: "notes", weeklyCheckins: "weekly check-ins", program: "program settings" };
const CORE_KEYS = ["sites", "checkins", "observations", "weeklyCheckins", "program"];
let loadedKeys = {};
let listenErrors = {};
let snapFromCache = {};

function onListenError(name) {
  return (err) => {
    console.error("Listener failed (" + name + "):", err);
    listenErrors[name] = (err && err.code) || "error";
    updateSyncPill();
    render();
  };
}
/* A visible state for every screen, so nothing sits blank: loading while the first
   snapshot is on its way, an error banner (with retry) when a listener fails. */
function loadingHTML(what) { return `<div class="loading" role="status">Loading ${esc(what)}…</div>`; }
function errorBanner() {
  const bad = Object.keys(listenErrors);
  if (!bad.length) return "";
  const denied = bad.some((k) => listenErrors[k] === "permission-denied");
  const names = bad.map((k) => LISTEN_LABEL[k] || k).join(", ");
  return `<div class="err-banner" role="alert"><strong>${denied ? "No permission to load" : "Couldn't load"} ${esc(names)}.</strong>
    ${denied ? "Ask an admin to check your account." : "Some information may be missing."}
    <button type="button" class="btn-link" data-retry>Try again</button></div>`;
}
/* Returns HTML to show instead of the screen's content while the data it needs
   has not arrived, or "" when it can render normally. */
function screenGate(what, needKeys) {
  const keys = needKeys || ["sites", "checkins"];
  const missing = keys.filter((k) => !loadedKeys[k]);
  if (!missing.length) return "";
  if (missing.some((k) => listenErrors[k])) return errorBanner();
  return loadingHTML(what);
}
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-retry]") && auth.currentUser) { stopListeners(); startListeners(); }
});
function stopListeners() { unsubs.forEach((u) => u()); unsubs = []; }

function startListeners() {
  loadedKeys = {}; listenErrors = {}; snapFromCache = {};
  const watch = (key, ref, onData) => onSnapshot(ref, SNAP_OPTS, (snap) => {
    onData(snap);
    loadedKeys[key] = true; delete listenErrors[key];
    snapFromCache[key] = snap.metadata.fromCache;
    updateSyncPill();
    render();
    if (key === "checkins" && outbox.length) flushPhotos();
  }, onListenError(key));
  const docsOf = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  const countPending = (key, snap) => { pendingCounts[key] = snap.docs.filter((d) => d.metadata.hasPendingWrites).length; };

  unsubs = [
    watch("sites", collection(db, "sites"), (snap) => { sites = docsOf(snap); countPending("sites", snap); }),
    watch("checkins", query(collection(db, "checkins"), orderBy("order")), (snap) => {
      checkins = docsOf(snap); countPending("checkins", snap);
      pendingCheckinIds = new Set(snap.docs.filter((d) => d.metadata.hasPendingWrites).map((d) => d.id));
    }),
    watch("observations", collection(db, "observations"), (snap) => { observations = docsOf(snap); countPending("observations", snap); }),
    watch("weeklyCheckins", collection(db, "weeklyCheckins"), (snap) => { weeklyCheckins = docsOf(snap); countPending("weeklyCheckins", snap); }),
    watch("program", doc(db, "meta", "program"), (snap) => { programDoc = snap.exists() ? snap.data() : null; }),
  ];
}

function setSyncText(text, cls) {
  const pill = document.getElementById("sync-pill");
  document.getElementById("sync-text").textContent = text;
  pill.className = cls || "";
}
function pendingTotal() {
  return pendingCounts.sites + pendingCounts.checkins + pendingCounts.observations + pendingCounts.weeklyCheckins + outbox.length;
}
function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }
/* Exactly three states a field worker can act on: Offline (with how much is
   waiting), Syncing, or Synced as of a time. "Connecting" is shown as syncing
   until the first server-confirmed snapshot arrives. */
function updateSyncPill() {
  if (setupIncomplete) { setSyncText(SETUP_INCOMPLETE_TEXT, "offline"); return; }
  const errs = Object.keys(listenErrors);
  if (errs.length) {
    const denied = errs.some((k) => listenErrors[k] === "permission-denied");
    setSyncText(denied ? NO_ACCESS_TEXT : "Connection problem — some data may be missing", "offline");
    return;
  }
  const n = pendingTotal();
  if (!navigator.onLine) {
    setSyncText(n ? `Offline · ${plural(n, "change")} waiting to sync` : "Offline · changes save on this phone", "offline");
    return;
  }
  if (n) { setSyncText(`Syncing ${plural(n, "change")}…`, "syncing"); return; }
  const waiting = CORE_KEYS.some((k) => loadedKeys[k] === undefined || snapFromCache[k]);
  if (waiting) { setSyncText("Connecting…", "syncing"); return; }
  setSyncText("Synced · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), "synced");
}
window.addEventListener("online", () => { setSyncText("Syncing…", "syncing"); flushPhotos(); });
window.addEventListener("offline", () => updateSyncPill());

/* "N/A" is the placeholder site for office work; say so in plain words. */
function siteLabel(id) { const s = siteById(id); return (id === "n-a" || s.name === "N/A") ? "Office / no site" : s.name; }
function siteById(id) { return sites.find((s) => s.id === id) || { id, name: id, epa: "", assistant: "", nurseryId: "", potfillingTarget: null, nmName: "", nmPhone: "", lat: null, lng: null }; }
function checkinsForSite(siteId) { return checkins.filter((c) => c.siteId === siteId).sort((a, b) => (b.week - a.week) || DAY_ORDER.indexOf(effectiveDay(b)) - DAY_ORDER.indexOf(effectiveDay(a))); }
function observationsForCheckin(checkinId) { return observations.filter((o) => o.checkinId === checkinId).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); }
function observationsForSite(siteId) { return observations.filter((o) => o.siteId === siteId).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); }
function fmtWhen(ts) { if (!ts || !ts.seconds) return "Just now"; return new Date(ts.seconds * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }

/* "12 min ago" style label for the activity feed. Falls back to a short date
   once something is more than a week old, since "9 days ago" is less useful
   than just seeing the date at that point. */
function relTime(ts) {
  if (!ts || !ts.seconds) return "Just now";
  const diffMs = Date.now() - ts.seconds * 1000;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "Just now";
  if (min < 60) return `${min} min ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} hr${hr === 1 ? "" : "s"} ago`;
  const day = Math.floor(hr / 24);
  if (day === 1) return "Yesterday";
  if (day < 7) return `${day} days ago`;
  return new Date(ts.seconds * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* --- Activity feed ---
   There's no dedicated event log in this data model, so the feed is built by
   reading three things as events: a note being created, an issue/follow-up
   being resolved, and a check-in being marked Completed. Resolving is the
   only observation "edit" that counts as a distinct event; other edits to a
   check-in (ticking a checklist box, changing notes) don't get their own
   entry, since `updatedAt` is overwritten by any edit and can't distinguish
   "just completed" from "checklist ticked five minutes later." */
function buildActivityFeed(limit) {
  const events = [];
  observations.forEach((o) => {
    if (o.createdAt?.seconds) {
      events.push({
        ts: o.createdAt.seconds, siteId: o.siteId, color: `var(--obs-${o.type})`,
        text: `<b>${OBS_LABEL[o.type] || o.type}</b> logged`,
      });
    }
    if (isTracked(o) && obsStatus(o) === "Resolved" && o.resolvedAt?.seconds) {
      events.push({
        ts: o.resolvedAt.seconds, siteId: o.siteId, color: "var(--status-completed-fg)",
        text: `<b>${OBS_LABEL[o.type]}</b> resolved`,
      });
    }
  });
  checkins.forEach((c) => {
    if (c.status === "Completed" && c.updatedAt?.seconds) {
      events.push({ ts: c.updatedAt.seconds, siteId: c.siteId, color: "var(--status-completed-fg)", text: "<b>Visit</b> completed" });
    }
  });
  events.sort((a, b) => b.ts - a.ts);
  return events.slice(0, limit || 10);
}

/* --- Risk ---
   Flags sites worth a second look. Each factor is independent and cheap to
   explain; the score is just how many fired, so "two problems" outranks
   "one problem" without pretending to be a precise model. */
const STALE_VISIT_DAYS = 21;
function computeSiteRisk() {
  const iso = todayISO();
  return sites.filter((s) => s.id !== "n-a").map((s) => {
    const history = checkinsForSite(s.id);
    const datedVisits = history.filter((c) => c.date).sort((a, b) => b.date.localeCompare(a.date));
    const allIssuesForSite = observations.filter((o) => o.siteId === s.id && o.type === "issue");
    const factors = [];

    if (openIssuesForSite(s.id).length) factors.push({ key: "issue", label: `${openIssuesForSite(s.id).length} open issue${openIssuesForSite(s.id).length === 1 ? "" : "s"}` });

    const overdueFup = observations.some((o) => o.siteId === s.id && o.type === "followUp" && isUnresolved(o) && isDueOrOverdue(o));
    if (overdueFup) factors.push({ key: "followup", label: "Follow-up overdue" });

    if (!history.length) {
      factors.push({ key: "never", label: "Never visited" });
    } else if (datedVisits.length) {
      const daysSince = Math.floor((new Date(iso) - new Date(datedVisits[0].date)) / 86400000);
      if (daysSince > STALE_VISIT_DAYS) factors.push({ key: "stale", label: `No visit in ${daysSince}d` });
    }

    if (allIssuesForSite.length >= 3) factors.push({ key: "repeat", label: `${allIssuesForSite.length} issues logged (recurring)` });

    return { site: s, factors, score: factors.length };
  }).filter((r) => r.score > 0).sort((a, b) => b.score - a.score);
}

/* --- Issue / follow-up lifecycle ---
   Notes created before this feature existed have no status field. Treating a
   missing status as "Open" keeps old issues visible rather than silently
   counting them as done. */
function isTracked(o) { return TRACKED_TYPES.includes(o.type); }
function obsStatus(o) { return isTracked(o) ? (o.status || "Open") : null; }
function isUnresolved(o) { return isTracked(o) && obsStatus(o) !== "Resolved"; }
function openIssuesForSite(siteId) { return observations.filter((o) => o.siteId === siteId && o.type === "issue" && isUnresolved(o)); }
function openFollowUps() { return observations.filter((o) => o.type === "followUp" && isUnresolved(o)); }
function isDueOrOverdue(o) { return !!o.dueDate && o.dueDate <= todayISO(); }

/* --- Check-in timing ---
   A check-in only counts as overdue if it carries a real date. Undated
   check-ins are schedule placeholders, not missed visits. */
function isToday(c) { return !!c.date && c.date === todayISO(); }
function isOverdue(c) { return !!c.date && c.date < todayISO() && c.status === "Pending"; }
function checkinsToday() { return checkins.filter(isToday); }
function overdueCheckins() { return checkins.filter(isOverdue).sort((a, b) => a.date.localeCompare(b.date)); }

/* Every field assistant known to the data, for assignment pickers. Reads from
   Firestore sites first so it stays right as the directory changes. */
function allAssistants() {
  const fromSites = sites.map((s) => s.assistant);
  const fromCheckins = checkins.map((c) => c.assistant);
  return [...new Set([...fromSites, ...fromCheckins].filter((a) => a && a !== "N/A"))].sort();
}

const meEmail = () => (auth.currentUser && auth.currentUser.email) || "unknown";
const isAdmin = () => myRole === "admin";
function uid() { return (crypto.randomUUID && crypto.randomUUID()) || (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)); }

/* Audit fields. Every document records who made it and when, and who last touched
   it. Timestamps come from the server clock; names come from the signed-in account
   (the security rules check that the name matches). */
function stampNew(data) { const me = meEmail(); return { ...data, createdAt: serverTimestamp(), createdBy: me, updatedAt: serverTimestamp(), updatedBy: me }; }
function stampEdit(patch) { return { ...patch, updatedAt: serverTimestamp(), updatedBy: meEmail() }; }

/* Visit identity.
   New visits get a predictable ID built from what makes a visit "the same visit".
   Two people (or one person tapping twice, or two phones working offline) who add
   the same visit therefore write to the same document instead of creating two.
   Older visits keep their random IDs, so duplicates are also detected by comparing
   the four fields, which is what the admin page's duplicate check does too. */
function normKey(s) { return String(s || "").trim().toLowerCase(); }
function visitIdFor(d) { return [d.date, d.siteId, slugify(d.assistant || ""), slugify(d.purpose || "")].join("_"); }
function findDuplicateVisit(d, ignoreId) {
  if (!validISO(d.date)) return null;
  return checkins.find((c) => c.id !== ignoreId && c.date === d.date && c.siteId === d.siteId &&
    normKey(c.assistant) === normKey(d.assistant) && normKey(c.purpose) === normKey(d.purpose)) || null;
}
function dupMessage(dup) {
  return `That visit is already on the schedule (${siteLabel(dup.siteId)}, ${fmtDayDate(dup.date)}, ${dup.assistant}).`;
}

/* 9) MUTATIONS
   Every write goes through guardedWrite. A rejected write (no permission,
   signed out, server unreachable) used to surface as an unhandled promise
   rejection and the screen just carried on as if it had saved. Now the person
   is told, and the helper returns false so the caller can keep what they typed
   instead of clearing it. Each helper returns true when the write succeeded. */
function writeErrorMessage(action, err) {
  const code = err && err.code;
  if (code === "permission-denied") return "You don't have permission to " + action + ". Ask an admin if you think you should.";
  if (code === "unauthenticated") return "You've been signed out. Sign in again and retry.";
  if (code === "unavailable" || code === "deadline-exceeded") return "Couldn't reach the server, so this wasn't saved. Check your connection and try again.";
  if (code === "not-found") return "That item no longer exists.";
  return "Couldn't " + action + ". Please try again.";
}
function reportWriteError(action, err) {
  console.error("Write failed (" + action + "):", err);
  showToast(writeErrorMessage(action, err), { kind: "error" });
}
/* Firestore only settles a write's promise once the server acknowledges it, so
   offline (or on a very weak connection) a plain `await` hangs and leaves the
   form stuck. The change is already saved on the phone and visible by then, so
   after a short wait it counts as queued. A later rejection still tells the person. */
async function guardedWrite(action, fn) {
  let pending;
  try { pending = Promise.resolve(fn()); }
  catch (err) { reportWriteError(action, err); return false; }
  try {
    const outcome = await new Promise((resolve, reject) => {
      const t = setTimeout(() => resolve("queued"), navigator.onLine ? 4000 : 0);
      pending.then(() => { clearTimeout(t); resolve("saved"); }, (err) => { clearTimeout(t); reject(err); });
    });
    if (outcome === "queued") pending.catch((err) => reportWriteError(action, err));
    return true;
  } catch (err) { reportWriteError(action, err); return false; }
}

/* Only these fields can be changed from the Edit form. Anything else on a visit
   (evidence, photos, audit fields) is written by its own action, so a stale form
   can never overwrite a photo that finished uploading while it was open. */
const EDITABLE_VISIT_FIELDS = ["date", "day", "week", "epa", "assistant", "siteId", "purpose", "checklistItems", "checkedItems"];
function pickEditable(draft) {
  const out = {};
  EDITABLE_VISIT_FIELDS.forEach((k) => { if (draft[k] !== undefined) out[k] = draft[k]; });
  return out;
}

function saveCheckin(id, patch) {
  return guardedWrite("save this check-in", () => updateDoc(doc(db, "checkins", id), stampEdit(patch)));
}
function createCheckin(data) {
  const id = visitIdFor(data);
  if (checkins.some((c) => c.id === id)) {
    showToast("That visit is already on the schedule.", { kind: "error" });
    return Promise.resolve(false);
  }
  return guardedWrite("create this check-in", () => {
    const maxOrder = checkins.reduce((m, c) => Math.max(m, c.order ?? 0), -1);
    const record = {
      siteId: data.siteId, epa: data.epa, assistant: data.assistant, purpose: data.purpose,
      date: data.date, day: data.day, week: data.week,
      status: "Pending", statusNote: "", rescheduledFrom: "",
      checklistItems: data.checklistItems || [], checkedItems: data.checkedItems || [],
      order: maxOrder + 1,
    };
    return setDoc(doc(db, "checkins", id), stampNew(record));
  });
}
/* One tap on a status pill used to write immediately with no feedback. Now it
   confirms with a toast (Undo for 6s), asks for a new date when rescheduling
   and an optional reason when skipping. */
const PREV_TEXT_KEYS = new Set(["statusNote", "rescheduledFrom", "completedBy"]);
async function changeStatus(c, newStatus) {
  if (newStatus === c.status) return;
  if (newStatus !== "Pending" && (!c.epa || !c.assistant || !c.siteId)) {
    showToast("This visit is missing its EPA, field assistant or site. Open Edit Details to fix it.", { kind: "error" });
    return;
  }
  const patch = { status: newStatus, statusNote: "" };
  if (newStatus === "Completed") { patch.completedAt = serverTimestamp(); patch.completedBy = meEmail(); }
  else if (c.status === "Completed") { patch.completedAt = null; patch.completedBy = ""; }
  if (newStatus === "Rescheduled") {
    const r = await openDialog({
      title: "Reschedule this visit", message: c.date ? `Currently ${fmtDayDate(c.date)}.` : "",
      inputType: "date", inputLabel: "New date (optional)", confirmLabel: "Save",
    });
    if (!r.ok) return;
    if (r.value) {
      if (!validISO(r.value)) { showToast("That date isn't valid.", { kind: "error" }); return; }
      const moved = applyDateToDraft({ date: r.value, day: c.day, week: c.week });
      const dup = findDuplicateVisit({ ...c, date: moved.date }, c.id);
      if (dup) { showToast(dupMessage(dup), { kind: "error" }); return; }
      Object.assign(patch, { date: moved.date, day: moved.day, week: moved.week, rescheduledFrom: c.date || "" });
    }
  } else if (newStatus === "Skipped") {
    const r = await openDialog({
      title: "Skip this visit?", message: "A short reason helps the SFO follow up.",
      inputType: "text", inputLabel: "Reason (optional)", placeholder: "e.g. road flooded", confirmLabel: "Skip visit",
    });
    if (!r.ok) return;
    patch.statusNote = r.value.trim();
  }
  const prev = {};
  Object.keys(patch).forEach((k) => { prev[k] = c[k] !== undefined ? c[k] : (PREV_TEXT_KEYS.has(k) ? "" : null); });
  saveCheckin(c.id, patch); // not awaited: offline writes settle only when the server acknowledges
  showToast(navigator.onLine ? `Marked ${newStatus}` : `Marked ${newStatus} · saved on this phone`, {
    action: "Undo",
    onAction: () => { saveCheckin(c.id, prev); showToast("Undone"); },
  });
  if (newStatus === "Completed") captureEndEvidence(c);
}
/* Admin-only. The security rules enforce this too; hiding the button is just courtesy. */
function removeCheckin(id) {
  if (!isAdmin()) { showToast("Only an admin can delete a visit.", { kind: "error" }); return Promise.resolve(false); }
  return guardedWrite("delete this check-in", () => deleteDoc(doc(db, "checkins", id)));
}
function addObservation(siteId, checkinId, type, text, meta) {
  return guardedWrite("save this note", () => writeObservation(siteId, checkinId, type, text, meta));
}
async function writeObservation(siteId, checkinId, type, text, meta) {
  const linkedCheckin = checkinId ? checkins.find((c) => c.id === checkinId) : null;
  const record = {
    siteId, checkinId: checkinId || null, type, text,
    week: (meta && meta.week) ?? linkedCheckin?.week ?? null,
    bucket: null,
    author: meEmail(),
  };
  /* Only issues and follow-ups get a lifecycle. Attaching a status to a plain
     observation would make it look actionable when it isn't. */
  if (TRACKED_TYPES.includes(type)) {
    record.status = "Open";
    record.assignedTo = (meta && meta.assignedTo) || "";
    record.dueDate = (meta && meta.dueDate) || "";
    record.resolvedAt = null;
    record.resolvedBy = "";
  }
  await addDoc(collection(db, "observations"), stampNew(record));
}
/* An item an FA relayed to the SFO: no visit attached, so the week is explicit. */
function addStandaloneObservation(siteId, week, type, text) {
  return addObservation(siteId, null, type, text, { week });
}
function setObservationBucket(id, bucket) {
  return guardedWrite("update this item", () => updateDoc(doc(db, "observations", id), stampEdit({ bucket })));
}
function saveWeeklyCheckin(week, patch) {
  const isNew = !weeklyCheckins.some((w) => w.week === week);
  const extra = isNew ? { createdAt: serverTimestamp(), createdBy: meEmail() } : {};
  return guardedWrite("save the weekly check-in", () => setDoc(doc(db, "weeklyCheckins", String(week)), stampEdit({ ...patch, week, ...extra }), { merge: true }));
}
function setObservationStatus(id, status) {
  return guardedWrite("update this note's status", () => {
    const patch = { status };
    if (status === "Resolved") {
      patch.resolvedAt = serverTimestamp();
      patch.resolvedBy = meEmail();
    } else {
      patch.resolvedAt = null;
      patch.resolvedBy = "";
    }
    return updateDoc(doc(db, "observations", id), stampEdit(patch));
  });
}

/* 9a) EVIDENCE: GPS at check-in
   "Start visit" records where the phone was, how sure the GPS was, and when,
   then compares that with the site's coordinates. The result is stored as a plain
   word (verified / far / ...), never as a pass/fail that blocks the visit: a field
   worker with no GPS signal can still do the work, and the SFO can see why a visit
   isn't verified. Times are the phone's clock in ms (that is the evidence); audit
   times elsewhere come from the server. */
const SITE_RADIUS_M = 300;        // how close counts as "at the site"
const ACCURACY_CREDIT_M = 150;    // a vague fix gets at most this much benefit of the doubt
const GPS_TIMEOUT_MS = 20000;
const GPS_GOOD_M = 30;            // stop waiting once the fix is this good
function haversineM(lat1, lng1, lat2, lng2) {
  const R = 6371008.8, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
/* Resolves with the best fix seen before the timeout (or as soon as one is good
   enough). Never rejects: failures come back as { ok:false, reason }. */
function getFix(opts) {
  const timeoutMs = (opts && opts.timeoutMs) || GPS_TIMEOUT_MS;
  const goodM = (opts && opts.goodEnoughM) || GPS_GOOD_M;
  return new Promise((resolve) => {
    if (!("geolocation" in navigator)) { resolve({ ok: false, reason: "unsupported" }); return; }
    let best = null, done = false, watchId = null;
    const finish = (result) => {
      if (done) return; done = true;
      clearTimeout(timer);
      if (watchId !== null) { try { navigator.geolocation.clearWatch(watchId); } catch (e) { /* ignore */ } }
      resolve(result);
    };
    const timer = setTimeout(() => finish(best ? { ok: true, ...best } : { ok: false, reason: "no-fix" }), timeoutMs);
    try {
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const cur = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracyM: pos.coords.accuracy };
          if (!best || cur.accuracyM < best.accuracyM) best = cur;
          if (cur.accuracyM <= goodM) finish({ ok: true, ...best });
        },
        (err) => { if (err && err.code === 1) finish({ ok: false, reason: "denied" }); /* other errors: keep waiting for the timeout */ },
        { enableHighAccuracy: true, maximumAge: 0, timeout: timeoutMs }
      );
    } catch (e) { finish({ ok: false, reason: "unsupported" }); }
  });
}
function buildEvidence(fix, site) {
  const ev = { lat: null, lng: null, accuracyM: null, capturedAtMs: Date.now(), distanceM: null, radiusM: SITE_RADIUS_M, result: "no-fix" };
  if (!fix.ok) { ev.result = fix.reason; return ev; }
  ev.lat = Math.round(fix.lat * 1e6) / 1e6;
  ev.lng = Math.round(fix.lng * 1e6) / 1e6;
  ev.accuracyM = Math.round(fix.accuracyM);
  if (!site || typeof site.lat !== "number" || typeof site.lng !== "number") { ev.result = "no-site-gps"; return ev; }
  const dist = haversineM(fix.lat, fix.lng, site.lat, site.lng);
  ev.distanceM = Math.round(dist);
  ev.result = dist - Math.min(fix.accuracyM, ACCURACY_CREDIT_M) <= SITE_RADIUS_M ? "verified" : "far";
  return ev;
}
/* A visit counts as started once a name or a start fix is on it. startedAt itself
   is a server timestamp and reads back as null until the server confirms, so it
   can't be used offline. */
function isStarted(c) { return !!(c.startedBy || (c.evidence && c.evidence.start)); }
function fmtDistance(m) { return m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m).toLocaleString() + " m"; }
function fmtTimeMs(ms) { return Number.isFinite(ms) ? new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""; }
function evidenceToast(ev) {
  switch (ev.result) {
    case "verified": return `Visit started · you're at the site (${fmtDistance(ev.distanceM)})`;
    case "far": return `Visit started, but you look ${fmtDistance(ev.distanceM)} from the site`;
    case "no-site-gps": return "Visit started · this site has no GPS yet, so it can't be verified";
    case "denied": return "Visit started without a location. Allow location for this app to verify visits";
    default: return "Visit started without a GPS fix. Try again outdoors if it matters";

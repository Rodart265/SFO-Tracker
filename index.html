<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFO Visit Tracker</title>
<meta name="theme-color" content="#1F4E3D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --forest:#1F4E3D; --forest-dark:#163A2D; --gold:#C9A227; --cream:#F5F2EA;
  --ink:#23271F; --ink-soft:#5B6058; --line:#DCD7C8; --card-bg:#FFFFFF;
  --epa-chilaza-bg:#E4EDF6; --epa-chilaza-fg:#2C5C86;
  --epa-mingongo-bg:#EAF0E1; --epa-mingongo-fg:#55702F;
  --epa-mpingu-bg:#F6E9D9; --epa-mpingu-fg:#B5651D;
  --epa-office-bg:#ECEAE4; --epa-office-fg:#6B6459;
  --status-pending-bg:#FCEFC7; --status-pending-fg:#8A6D00;
  --status-completed-bg:#DCEEDD; --status-completed-fg:#1F4E3D;
  --status-rescheduled-bg:#F8DFC0; --status-rescheduled-fg:#9A4B00;
  --status-skipped-bg:#F4D4CC; --status-skipped-fg:#9C3B26;
  --radius:14px; --radius-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:15px;}

/* ---------- Auth screen ---------- */
#auth-screen{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:32px 24px;gap:18px;
}
#auth-screen h1{font-size:22px;margin:0 0 4px;color:var(--forest-dark);}
#auth-screen p.sub{margin:0 0 8px;color:var(--ink-soft);font-size:14px;line-height:1.5;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;color:var(--ink-soft);}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 12px;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.btn-primary{
  background:var(--forest);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:13px 16px;font-size:15px;font-weight:600;
}
.btn-primary:active{background:var(--forest-dark);}
.btn-secondary{
  background:#fff;color:var(--forest);border:1px solid var(--forest);
  border-radius:var(--radius-sm);padding:11px 16px;font-size:14px;font-weight:600;
}
#auth-error{color:var(--status-skipped-fg);font-size:13px;min-height:16px;}

/* ---------- Top bar ---------- */
#top-bar{
  position:sticky;top:0;z-index:10;background:var(--forest);color:#fff;
  padding:14px 18px calc(14px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
}
#top-bar h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;}
#top-bar .actions{display:flex;gap:10px;align-items:center;}
#top-bar button.icon-btn{
  background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:8px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
}
#offline-banner{
  background:var(--status-rescheduled-bg);color:var(--status-rescheduled-fg);
  font-size:13px;padding:8px 18px;text-align:center;display:none;
}
#offline-banner.show{display:block;}

/* ---------- Tabs ---------- */
#tabs{display:flex;gap:6px;padding:12px 18px 0;background:var(--cream);}
.tab-btn{
  flex:1;background:transparent;border:none;border-bottom:3px solid transparent;
  padding:10px 4px;font-size:14px;font-weight:600;color:var(--ink-soft);
}
.tab-btn.active{color:var(--forest-dark);border-bottom-color:var(--gold);}

/* ---------- Schedule ---------- */
#schedule-view, #dashboard-view{padding:14px 16px 100px;}
.week-section{margin-bottom:16px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;}
.week-header{
  display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
  background:#fbfaf6;cursor:pointer;
}
.week-header .title{font-weight:700;font-size:14.5px;color:var(--forest-dark);}
.week-header .meta{font-size:12.5px;color:var(--ink-soft);}
.week-body{display:none;}
.week-body.open{display:block;}
.day-group{padding:4px 12px 10px;}
.day-label{font-size:12px;text-transform:none;color:var(--ink-soft);font-weight:600;margin:10px 4px 6px;}

.visit-card{
  border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;
  margin-bottom:8px;overflow:hidden;
}
.visit-card .card-top{padding:11px 12px 9px;}
.badge-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap;}
.badge{
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.2px;
}
.card-title{font-size:14.5px;font-weight:600;color:var(--ink);margin:0 0 2px;}
.card-sub{font-size:12.5px;color:var(--ink-soft);margin:0;}
.status-row{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.status-pill{
  flex:1;min-width:70px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  border-radius:99px;padding:7px 4px;font-size:11.5px;font-weight:700;text-align:center;
}
.status-pill.active-pending{background:var(--status-pending-bg);color:var(--status-pending-fg);border-color:transparent;}
.status-pill.active-completed{background:var(--status-completed-bg);color:var(--status-completed-fg);border-color:transparent;}
.status-pill.active-rescheduled{background:var(--status-rescheduled-bg);color:var(--status-rescheduled-fg);border-color:transparent;}
.status-pill.active-skipped{background:var(--status-skipped-bg);color:var(--status-skipped-fg);border-color:transparent;}
.card-footer{display:flex;justify-content:flex-end;padding:0 10px 9px;}
.edit-toggle{
  background:none;border:none;color:var(--forest);font-size:12.5px;font-weight:700;
  display:flex;align-items:center;gap:5px;padding:4px 6px;
}
.edit-panel{display:none;padding:2px 12px 14px;border-top:1px dashed var(--line);}
.edit-panel.open{display:block;padding-top:12px;}
.edit-grid{display:flex;flex-direction:column;gap:10px;}
.edit-actions{display:flex;gap:10px;margin-top:12px;}
.edit-actions .btn-primary{flex:1;}
.btn-delete{background:none;border:1px solid var(--status-skipped-fg);color:var(--status-skipped-fg);
  border-radius:var(--radius-sm);padding:11px 14px;font-size:13.5px;font-weight:600;}

/* ---------- Dashboard ---------- */
.dash-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
.dash-card h2{font-size:14px;margin:0 0 10px;color:var(--forest-dark);}
table.dash-table{width:100%;border-collapse:collapse;font-size:13px;}
table.dash-table th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line);}
table.dash-table td{padding:7px 6px;border-bottom:1px solid #F0EEE7;}
.bar-track{background:#EFEDE5;border-radius:99px;height:7px;overflow:hidden;margin-top:4px;}
.bar-fill{background:var(--forest);height:100%;border-radius:99px;}

/* ---------- FAB ---------- */
#fab{
  position:fixed;bottom:24px;right:calc(50% - 280px + 22px);
  background:var(--gold);color:var(--forest-dark);border:none;border-radius:99px;
  width:56px;height:56px;box-shadow:0 6px 16px rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:center;z-index:9;
}
@media (max-width:560px){ #fab{right:22px;} }

.hidden{display:none !important;}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}
</style>
</head>

const STATUSES = ["Pending", "Completed", "Rescheduled", "Skipped"];
const DAY_ORDER = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
const EPA_CLASS = { "Chilaza": "chilaza", "Ming'ongo": "mingongo", "Mpingu": "mpingu", "Office": "office" };

/* =====================================================================
   3) STATE
   ===================================================================== */
let visits = [];
let unsubscribeVisits = null;
let seeding = false;
let activeTab = "schedule";
let openWeeks = new Set([1]);
let openEditId = null;
let deferredInstallPrompt = null;

/* =====================================================================
   4) AUTH
   ===================================================================== */
const authScreen = document.getElementById("auth-screen");
const mainScreen = document.getElementById("main-screen");
const authError = document.getElementById("auth-error");

document.getElementById("sign-in-btn").addEventListener("click", async () => {
  authError.textContent = "";
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if (!email || !password) { authError.textContent = "Enter your email and password."; return; }
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    authError.textContent = "Couldn't sign in — check your email and password.";
  }
});

document.getElementById("sign-out-btn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (user) {
    authScreen.classList.add("hidden");
    mainScreen.classList.remove("hidden");
    startVisitsListener();
  } else {
    mainScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
    if (unsubscribeVisits) { unsubscribeVisits(); unsubscribeVisits = null; }
    visits = [];
  }
});

/* =====================================================================
   5) FIRESTORE — live sync + first-run seed
   ===================================================================== */
function startVisitsListener() {
  const visitsRef = collection(db, "visits");
  const q = query(visitsRef, orderBy("order"));
  unsubscribeVisits = onSnapshot(q, (snap) => {
    if (snap.empty && !seeding) {
      seedInitialSchedule();
      return;
    }
    visits = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => {
    console.error("Visits listener error:", err);
  });
}

async function seedInitialSchedule() {
  seeding = true;
  const visitsRef = collection(db, "visits");
  const batch = writeBatch(db);
  SEED_VISITS.forEach((v) => {
    const ref = doc(visitsRef);
    batch.set(ref, { ...v, updatedAt: serverTimestamp() });
  });
  await batch.commit();
  seeding = false;
}

function nextOrderValue() {
  return visits.reduce((max, v) => Math.max(max, v.order ?? 0), -1) + 1;
}

async function saveVisit(id, patch) {
  await updateDoc(doc(db, "visits", id), { ...patch, updatedAt: serverTimestamp() });
}

async function createVisit(data) {
  await addDoc(collection(db, "visits"), { ...data, order: nextOrderValue(), updatedAt: serverTimestamp() });
}

async function removeVisit(id) {
  await deleteDoc(doc(db, "visits", id));
}

/* =====================================================================
   6) TABS
   ===================================================================== */
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
    document.getElementById("schedule-view").classList.toggle("hidden", activeTab !== "schedule");
    document.getElementById("dashboard-view").classList.toggle("hidden", activeTab !== "dashboard");
    document.getElementById("fab").style.display = "flex";
    render();
  });
});

/* =====================================================================
   7) RENDER — Schedule
   ===================================================================== */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function statusClass(status) {
  return "active-" + (status || "Pending").toLowerCase();
}

function render() {
  if (activeTab === "schedule") renderSchedule(); else renderDashboard();
}

function renderSchedule() {
  const el = document.getElementById("schedule-view");
  if (!visits.length) { el.innerHTML = '<div class="empty-state">No visits yet. Tap + to add one.</div>'; return; }

  const weeks = {};
  visits.forEach((v) => { (weeks[v.week] = weeks[v.week] || []).push(v); });
  const weekNums = Object.keys(weeks).map(Number).sort((a, b) => a - b);

  el.innerHTML = weekNums.map((w) => {
    const items = weeks[w];
    const done = items.filter((v) => v.status === "Completed").length;
    const isOpen = openWeeks.has(w);
    const byDay = {};
    items.forEach((v) => { (byDay[v.day] = byDay[v.day] || []).push(v); });
    const dayNames = Object.keys(byDay).sort((a, b) => DAY_ORDER.indexOf(a) - DAY_ORDER.indexOf(b));

    const dayHtml = dayNames.map((d) => `
      <div class="day-group">
        <div class="day-label">${esc(d)}</div>
        ${byDay[d].map(renderCard).join("")}
      </div>
    `).join("");

    return `
      <div class="week-section">
        <div class="week-header" data-week="${w}">
          <span class="title">Week ${w}</span>
          <span class="meta">${done}/${items.length} completed</span>
        </div>
        <div class="week-body ${isOpen ? "open" : ""}" id="week-body-${w}">${dayHtml}</div>
      </div>
    `;
  }).join("");

  document.querySelectorAll(".week-header").forEach((h) => {
    h.addEventListener("click", () => {
      const w = Number(h.dataset.week);
      openWeeks.has(w) ? openWeeks.delete(w) : openWeeks.add(w);
      renderSchedule();
    });
  });
  wireCardEvents();
  document.getElementById("fab").style.display = openEditId ? "none" : "flex";
}

function renderCard(v) {
  const epaClass = EPA_CLASS[v.epa] || "office";
  const isOpen = openEditId === v.id;
  return `
    <div class="visit-card" data-id="${v.id}">
      <div class="card-top">
        <div class="badge-row">
          <span class="badge" style="background:var(--epa-${epaClass}-bg);color:var(--epa-${epaClass}-fg);">${esc(v.epa)}</span>
          ${v.date ? `<span class="badge" style="background:#F0EEE7;color:var(--ink-soft);">${esc(v.date)}</span>` : ""}
        </div>
        <p class="card-title">${esc(v.site)}</p>
        <p class="card-sub">${esc(v.assistant)} · ${esc(v.purpose)}</p>
        <div class="status-row" data-role="status-row">
          ${STATUSES.map((s) => `<button class="status-pill ${v.status === s ? statusClass(s) : ""}" data-status="${s}">${s}</button>`).join("")}
        </div>
      </div>
      <div class="card-footer">
        <button class="edit-toggle" data-role="edit-toggle">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          ${isOpen ? "Close" : "Edit details"}
        </button>
      </div>
      <div class="edit-panel ${isOpen ? "open" : ""}" data-role="edit-panel">
        ${isOpen ? renderEditForm(v) : ""}
      </div>
    </div>
  `;
}

function renderEditForm(v) {
  const epaOptions = REFERENCE.epas.map((e) => `<option value="${esc(e)}" ${v.epa === e ? "selected" : ""}>${esc(e)}</option>`).join("");
  const faList = REFERENCE.faByEpa[v.epa] || [];
  const faOptions = faList.map((f) => `<option value="${esc(f)}" ${v.assistant === f ? "selected" : ""}>${esc(f)}</option>`).join("");
  const siteList = REFERENCE.sitesByFa[v.assistant] || [];
  const siteOptions = siteList.map((s) => `<option value="${esc(s)}" ${v.site === s ? "selected" : ""}>${esc(s)}</option>`).join("");
  const purposeOptions = REFERENCE.purposes.map((p) => `<option value="${esc(p)}" ${v.purpose === p ? "selected" : ""}>${esc(p)}</option>`).join("");
  const checklistOptions = REFERENCE.checklists.map((c) => `<option value="${esc(c)}" ${v.checklist === c ? "selected" : ""}>${esc(c)}</option>`).join("");

  return `
    <div class="edit-grid">
      <div class="field"><label>Week</label><input type="number" min="1" data-field="week" value="${v.week}"></div>
      <div class="field"><label>Day</label>
        <select data-field="day">${DAY_ORDER.map((d) => `<option ${v.day === d ? "selected" : ""}>${d}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Date</label><input type="date" data-field="date" value="${esc(v.date)}"></div>
      <div class="field"><label>EPA</label><select data-field="epa" data-role="epa-select">${epaOptions}</select></div>
      <div class="field"><label>Field Assistant</label><select data-field="assistant" data-role="fa-select">${faOptions}</select></div>
      <div class="field"><label>Site</label><select data-field="site" data-role="site-select">${siteOptions}</select></div>
      <div class="field"><label>Visit Purpose</label><select data-field="purpose">${purposeOptions}</select></div>
      <div class="field"><label>Verification Checklist</label><select data-field="checklist">${checklistOptions}</select></div>
      <div class="field"><label>Physical Count / Field Notes</label><textarea data-field="notes">${esc(v.notes)}</textarea></div>
      <div class="edit-actions">
        <button class="btn-primary" data-role="save-btn">Save changes</button>
        <button class="btn-delete" data-role="delete-btn">Delete</button>
      </div>
    </div>
  `;
}

function wireCardEvents() {
  document.querySelectorAll(".visit-card").forEach((card) => {
    const id = card.dataset.id;
    const visit = visits.find((v) => v.id === id);
    if (!visit) return;

    card.querySelectorAll(".status-pill").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const newStatus = btn.dataset.status;
        if (newStatus !== "Pending" && (!visit.epa || !visit.assistant || !visit.site)) {
          alert("Fill in EPA, Field Assistant and Site before marking this " + newStatus + ".");
          return;
        }
        await saveVisit(id, { status: newStatus });
      });
    });

    const toggle = card.querySelector('[data-role="edit-toggle"]');
    toggle.addEventListener("click", () => {
      openEditId = openEditId === id ? null : id;
      renderSchedule();
    });

    const panel = card.querySelector('[data-role="edit-panel"]');
    if (!panel.classList.contains("open")) return;

    const epaSelect = panel.querySelector('[data-role="epa-select"]');
    const faSelect = panel.querySelector('[data-role="fa-select"]');
    const siteSelect = panel.querySelector('[data-role="site-select"]');

    epaSelect.addEventListener("change", () => {
      const epa = epaSelect.value;
      const faList = REFERENCE.faByEpa[epa] || [];
      faSelect.innerHTML = faList.map((f) => `<option value="${esc(f)}">${esc(f)}</option>`).join("");
      faSelect.dispatchEvent(new Event("change"));
    });
    faSelect.addEventListener("change", () => {
      const fa = faSelect.value;
      const siteList = REFERENCE.sitesByFa[fa] || [];
      siteSelect.innerHTML = siteList.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
    });

    panel.querySelector('[data-role="save-btn"]').addEventListener("click", async () => {
      const patch = {};
      panel.querySelectorAll("[data-field]").forEach((f) => {
        patch[f.dataset.field] = f.dataset.field === "week" ? Number(f.value) : f.value;
      });
      await saveVisit(id, patch);
      openEditId = null;
      renderSchedule();
    });

    panel.querySelector('[data-role="delete-btn"]').addEventListener("click", async () => {
      if (!confirm("Delete this visit?")) return;
      await removeVisit(id);
      openEditId = null;
    });
  });
}

/* =====================================================================
   8) RENDER — Dashboard
   ===================================================================== */
function renderDashboard() {
  const el = document.getElementById("dashboard-view");
  if (!visits.length) { el.innerHTML = '<div class="empty-state">Nothing to summarize yet.</div>'; return; }

  const epaRows = REFERENCE.epas.map((epa) => {
    const items = visits.filter((v) => v.epa === epa);
    const completed = items.filter((v) => v.status === "Completed").length;
    const pct = items.length ? Math.round((completed / items.length) * 100) : 0;
    return { epa, total: items.length, completed, pct };
  }).filter((r) => r.total > 0);

  const statusRows = STATUSES.map((s) => ({
    status: s, count: visits.filter((v) => v.status === s).length,
  }));

  const assistants = [...new Set(visits.map((v) => v.assistant).filter((a) => a && a !== "N/A"))];
  const faRows = assistants.map((fa) => {
    const items = visits.filter((v) => v.assistant === fa);
    const completed = items.filter((v) => v.status === "Completed").length;
    const pct = items.length ? Math.round((completed / items.length) * 100) : 0;
    return { fa, epa: items[0]?.epa || "", total: items.length, completed, pct };
  });

  el.innerHTML = `
    <div class="dash-card">
      <h2>EPA balance</h2>
      <table class="dash-table">
        <tr><th>EPA</th><th>Visits</th><th>Completed</th><th>Progress</th></tr>
        ${epaRows.map((r) => `
          <tr><td>${esc(r.epa)}</td><td>${r.total}</td><td>${r.completed}</td>
          <td><div class="bar-track"><div class="bar-fill" style="width:${r.pct}%"></div></div></td></tr>
        `).join("")}
      </table>
    </div>
    <div class="dash-card">
      <h2>Status summary</h2>
      <table class="dash-table">
        <tr><th>Status</th><th>Count</th></tr>
        ${statusRows.map((r) => `<tr><td>${esc(r.status)}</td><td>${r.count}</td></tr>`).join("")}
      </table>
    </div>
    <div class="dash-card">
      <h2>Per-assistant progress</h2>
      <table class="dash-table">
        <tr><th>Field Assistant</th><th>EPA</th><th>Progress</th></tr>
        ${faRows.map((r) => `
          <tr><td>${esc(r.fa)}</td><td>${esc(r.epa)}</td>
          <td><div class="bar-track"><div class="bar-fill" style="width:${r.pct}%"></div></div></td></tr>
        `).join("")}
      </table>
    </div>
  `;
}

/* =====================================================================
   9) ADD VISIT (floating action button)
   ===================================================================== */
document.getElementById("fab").addEventListener("click", async () => {
  const firstEpa = REFERENCE.epas[0];
  const firstFa = REFERENCE.faByEpa[firstEpa][0];
  const firstSite = REFERENCE.sitesByFa[firstFa][0];
  await createVisit({
    week: Math.max(1, ...visits.map((v) => v.week || 1)),
    day: "Monday", date: "", epa: firstEpa, assistant: firstFa, site: firstSite,
    purpose: REFERENCE.purposes[0], checklist: REFERENCE.checklists[0],
    status: "Pending", notes: "",
  });
  activeTab = "schedule";
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === "schedule"));
  document.getElementById("schedule-view").classList.remove("hidden");
  document.getElementById("dashboard-view").classList.add("hidden");
});

/* =====================================================================
   10) OFFLINE BANNER
   ===================================================================== */
function updateOfflineBanner() {
  document.getElementById("offline-banner").classList.toggle("show", !navigator.onLine);
}
window.addEventListener("online", updateOfflineBanner);
window.addEventListener("offline", updateOfflineBanner);
updateOfflineBanner();

/* =====================================================================
   11) INSTALL PROMPT + SERVICE WORKER
   ===================================================================== */
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById("install-btn").style.display = "flex";
});
document.getElementById("install-btn").addEventListener("click", async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById("install-btn").style.display = "none";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch((err) => console.warn("SW registration failed:", err));
  });
}
</script>

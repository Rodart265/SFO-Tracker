<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFO Field Tracker</title>
<meta name="theme-color" content="#153A2C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1F4E3D; --forest-dark:#153A2C; --forest-soft:#2E6B52;
  --gold:#C9A227; --gold-soft:#E6C765;
  --cream:#F7F5EF; --ink:#1F231C; --ink-soft:#6C7268; --ink-faint:#A2A79A;
  --line:#EAE6DA; --card-bg:#FFFFFF;
  --epa-chilaza-bg:#E7EFF8; --epa-chilaza-fg:#2C5C86; --epa-chilaza-dot:#3E7CB1;
  --epa-mingongo-bg:#EBF1E2; --epa-mingongo-fg:#55702F; --epa-mingongo-dot:#7B9A46;
  --epa-mpingu-bg:#F8ECDA; --epa-mpingu-fg:#B5651D; --epa-mpingu-dot:#CB812F;
  --epa-office-bg:#EEEDE7; --epa-office-fg:#6B6459; --epa-office-dot:#9B9486;
  --status-pending-bg:#FCEFC7; --status-pending-fg:#8A6D00;
  --status-completed-bg:#DCEEDD; --status-completed-fg:#1F4E3D;
  --status-rescheduled-bg:#F8DFC0; --status-rescheduled-fg:#9A4B00;
  --status-skipped-bg:#F4D4CC; --status-skipped-fg:#9C3B26;
  --obs-observation:#5C7EAB; --obs-issue:#C0442C; --obs-action:#3E8F63; --obs-followUp:#B5811D;
  --radius-lg:20px; --radius-md:16px; --radius-sm:12px;
  --shadow-sm:0 1px 2px rgba(31,45,36,.05), 0 1px 1px rgba(31,45,36,.04);
  --shadow-md:0 10px 28px -10px rgba(31,45,36,.20), 0 2px 8px rgba(31,45,36,.06);
  --ease:cubic-bezier(.4,0,.2,1); --dur:.2s;
  --navh:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
}
.headline{font-family:"Space Grotesk",-apple-system,sans-serif;}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.001s !important;} }
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:none;}
button:active{transform:scale(.97);}
input,select,textarea{font-family:inherit;font-size:15px;}
.ic{display:block;flex-shrink:0;}
a{color:inherit;text-decoration:none;}

/* Auth */
#auth-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 26px;gap:20px;}
#auth-screen .mark{width:52px;height:52px;border-radius:16px;background:var(--forest);display:flex;align-items:center;justify-content:center;}
#auth-screen h1{font-size:23px;margin:0;color:var(--forest-dark);font-weight:700;}
#auth-screen p.sub{margin:0 0 6px;color:var(--ink-soft);font-size:14px;line-height:1.55;}
.field{display:flex;flex-direction:column;gap:7px;}
.field label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.field input,.field textarea{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;background:#fff;color:var(--ink);}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--forest-soft);box-shadow:0 0 0 3px rgba(46,107,82,.12);}
.field textarea{resize:vertical;min-height:64px;line-height:1.5;}
.btn-primary{background:var(--forest);color:#fff;border-radius:var(--radius-sm);padding:14px 16px;font-size:15px;font-weight:650;box-shadow:var(--shadow-sm);}
.btn-primary:active{background:var(--forest-dark);}
.btn-primary:disabled{opacity:.5;}
#auth-error{color:var(--status-skipped-fg);font-size:13px;min-height:16px;}

/* Top bar */
#top-bar{position:sticky;top:0;z-index:10;background:linear-gradient(155deg,var(--forest) 0%, var(--forest-dark) 100%);
  color:#fff;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 6px 18px -8px rgba(21,58,44,.5);}
#top-bar .row1{display:flex;align-items:center;justify-content:space-between;}
#top-bar h1{font-size:17px;margin:0;font-weight:700;}
#top-bar .actions{display:flex;gap:8px;align-items:center;}
#top-bar button.icon-btn{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;}
#top-bar button.icon-btn:active{background:rgba(255,255,255,.26);}
#sync-pill{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;color:rgba(255,255,255,.75);font-weight:600;}
#sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gold-soft);}
#sync-pill.offline .dot{background:#E9A98D;}
#sync-pill.synced .dot{background:#8FD3A6;}

/* Bottom nav */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;box-shadow:0 -4px 16px rgba(31,45,36,.06);}
#bottom-nav-inner{max-width:560px;width:100%;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;color:var(--ink-faint);}
.nav-btn .ic{transition:transform var(--dur) var(--ease);}
.nav-btn span{font-size:10.5px;font-weight:650;}
.nav-btn.active{color:var(--forest-dark);}
.nav-btn.active .ic{transform:translateY(-1px);}

.screen{padding:16px 16px calc(var(--navh) + 96px);flex:1;}
.hidden{display:none !important;}
.empty-state{padding:48px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

/* Section title */
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:700;margin:18px 2px 9px;}
.sec-title:first-child{margin-top:2px;}

/* Week strip */
#week-strip{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
#week-strip::-webkit-scrollbar{display:none;}
.week-chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 16px;min-width:92px;
  box-shadow:var(--shadow-sm);}
.week-chip.active{background:var(--forest);border-color:var(--forest);}
.week-chip .wk-label{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:left;}
.week-chip.active .wk-label{color:rgba(255,255,255,.8);}
.week-chip .wk-count{font-size:15px;font-weight:750;color:var(--forest-dark);text-align:left;margin-top:2px;}
.week-chip.active .wk-count{color:#fff;}
.week-chip .wk-track{height:4px;background:#EFEDE4;border-radius:99px;margin-top:6px;overflow:hidden;width:100%;}
.week-chip.active .wk-track{background:rgba(255,255,255,.25);}
.week-chip .wk-fill{height:100%;background:var(--gold);border-radius:99px;}

.day-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:700;margin:16px 2px 8px;}

/* Checkin card */
.visit-card{border-radius:var(--radius-md);background:#fff;margin-bottom:10px;overflow:hidden;border:1px solid var(--line);position:relative;}
.visit-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--epa-office-dot));}
.card-top{padding:14px 16px 12px 18px;}
.badge-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap;}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;}
.date-tag{font-size:11px;color:var(--ink-faint);font-weight:600;}
.site-link{font-size:15.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:4px;}
.site-link .ic{color:var(--ink-faint);}
.card-sub{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;}

.checklist{margin-top:12px;display:flex;flex-direction:column;gap:2px;}
.chk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.chk-head .lbl{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;}
.chk-head .tally{font-size:11px;font-weight:700;color:var(--forest-soft);}
.chk-item{display:flex;align-items:center;gap:9px;padding:6px 2px;}
.chk-box{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.chk-box.checked{background:var(--forest-soft);border-color:var(--forest-soft);}
.chk-text{font-size:13.5px;color:var(--ink);line-height:1.35;}

.status-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px;}
.status-pill{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:99px;padding:8px 6px;font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:4px;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.status-pill svg{width:12px;height:12px;}
.status-pill.active-pending{background:var(--status-pending-bg);color:var(--status-pending-fg);border-color:transparent;}
.status-pill.active-completed{background:var(--status-completed-bg);color:var(--status-completed-fg);border-color:transparent;}
.status-pill.active-rescheduled{background:var(--status-rescheduled-bg);color:var(--status-rescheduled-fg);border-color:transparent;}
.status-pill.active-skipped{background:var(--status-skipped-bg);color:var(--status-skipped-fg);border-color:transparent;}

.card-actions{display:flex;border-top:1px solid var(--line);}
.card-actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 4px;font-size:12.5px;font-weight:650;color:var(--forest);}
.card-actions button:first-child{border-right:1px solid var(--line);}
.card-actions button .badge-count{background:var(--gold);color:var(--forest-dark);border-radius:99px;font-size:10px;font-weight:750;padding:1px 6px;margin-left:2px;}

.drawer-outer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease);}
.drawer-outer.open{grid-template-rows:1fr;}
.drawer{overflow:hidden;}
.drawer-inner{padding:14px 16px 16px 18px;border-top:1px solid var(--line);background:var(--cream);}

.obs-entry{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #EAE7DC;}
.obs-entry:last-child{border-bottom:none;}
.obs-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.obs-body{flex:1;min-width:0;}
.obs-type{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.3px;}
.obs-text{font-size:13.5px;color:var(--ink);line-height:1.4;margin-top:2px;}
.obs-meta{font-size:11px;color:var(--ink-faint);margin-top:3px;}

.note-composer{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;}
.type-chips{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap;}
.type-chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:11.5px;font-weight:650;color:var(--ink-soft);}
.type-chip.active{color:#fff;border-color:transparent;}
.note-composer textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;min-height:56px;resize:vertical;}
.note-composer .save-note{margin-top:9px;width:100%;background:var(--forest);color:#fff;border-radius:var(--radius-sm);padding:11px;font-size:13.5px;font-weight:650;}

/* Segmented + picker (edit form) */
.segmented{display:flex;gap:4px;background:var(--cream);padding:4px;border-radius:var(--radius-sm);}
.segmented button{flex:1;padding:10px 4px;border-radius:9px;font-size:12.5px;font-weight:650;color:var(--ink-soft);transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
.segmented button.active{background:#fff;color:var(--forest-dark);box-shadow:var(--shadow-sm);}
.picker-btn{width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;background:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink);font-size:14.5px;}
.picker-btn .chevron{color:var(--ink-faint);flex-shrink:0;}
.picker-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.edit-grid{display:flex;flex-direction:column;gap:12px;}
.edit-actions{display:flex;gap:10px;margin-top:4px;}
.edit-actions .btn-primary{flex:1;}
.btn-delete{border:1px solid var(--status-skipped-fg);color:var(--status-skipped-fg);border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;font-weight:650;}

/* Bottom sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(20,24,18,0);pointer-events:none;transition:background .28s var(--ease);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
.sheet-backdrop.open{background:rgba(20,24,18,.44);pointer-events:auto;}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;box-shadow:var(--shadow-md);padding:10px 6px calc(16px + env(safe-area-inset-bottom,0px));
  max-height:76vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .3s var(--ease);}
.sheet-backdrop.open .sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:4px auto 12px;}
.sheet-title{font-size:12px;font-weight:700;color:var(--ink-faint);padding:0 16px 8px;text-transform:uppercase;letter-spacing:.5px;}
.sheet-list{overflow-y:auto;padding:0 6px 6px;}
.sheet-option{width:100%;text-align:left;background:none;border:none;padding:14px 12px;font-size:15px;color:var(--ink);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:space-between;gap:10px;line-height:1.4;}
.sheet-option:active{background:var(--cream);}
.sheet-option.selected{color:var(--forest-dark);font-weight:650;background:var(--epa-chilaza-bg);}
.sheet-option .check-icon{opacity:0;color:var(--forest);flex-shrink:0;}
.sheet-option.selected .check-icon{opacity:1;}
.sheet-form{padding:6px 16px 4px;}

/* Sites & Team */
.search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:12px;}
.search-bar input{border:none;outline:none;flex:1;background:none;font-size:14.5px;}
.search-bar .ic{color:var(--ink-faint);}
.pill-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.pill-row::-webkit-scrollbar{display:none;}
.filter-pill{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-size:12.5px;font-weight:650;color:var(--ink-soft);}
.filter-pill.active{background:var(--forest);color:#fff;border-color:var(--forest);}
.site-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);width:100%;}
.site-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.site-row .info{flex:1;min-width:0;text-align:left;}
.site-row .name{font-size:14.5px;font-weight:700;}
.site-row .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;align-items:center;}
.site-row .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--ink-faint);}
.issue-flag{display:flex;align-items:center;gap:3px;color:var(--obs-issue);font-size:11px;font-weight:700;}

/* Site profile */
#site-profile-screen{position:fixed;inset:0;background:var(--cream);z-index:30;display:flex;flex-direction:column;overflow-y:auto;}
.sp-top{background:linear-gradient(155deg,var(--forest) 0%, var(--forest-dark) 100%);color:#fff;padding:16px 18px calc(20px + env(safe-area-inset-top,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));}
.sp-back{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);font-size:13px;font-weight:650;margin-bottom:14px;}
.sp-name{font-size:22px;font-weight:750;}
.sp-sub{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.sp-body{padding:16px;margin-top:-14px;}
.sp-card{background:#fff;border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-md);}
.nm-row{display:flex;align-items:center;gap:12px;}
.nm-avatar{width:44px;height:44px;border-radius:50%;background:var(--epa-chilaza-bg);color:var(--epa-chilaza-fg);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:14px;flex-shrink:0;}
.nm-info{flex:1;min-width:0;}
.nm-name{font-size:14.5px;font-weight:700;}
.nm-phone{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.call-btn{background:var(--forest);color:#fff;border-radius:99px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-sm);}
.call-btn:disabled{background:var(--line);color:var(--ink-faint);}
.target-row{display:flex;justify-content:space-between;align-items:baseline;}
.target-num{font-size:26px;font-weight:750;color:var(--forest-dark);letter-spacing:-.3px;}
.target-label{font-size:11.5px;color:var(--ink-soft);font-weight:650;}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.sp-stat{background:#fff;border-radius:var(--radius-md);padding:13px 10px;text-align:center;box-shadow:var(--shadow-sm);}
.sp-stat .num{font-size:19px;font-weight:750;color:var(--forest-dark);}
.sp-stat .lbl{font-size:10px;color:var(--ink-soft);font-weight:650;margin-top:2px;text-transform:uppercase;}
.history-item{background:#fff;border-radius:var(--radius-md);padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.history-head{display:flex;justify-content:space-between;align-items:center;}
.history-head .when{font-size:13px;font-weight:700;}
.history-head .purpose{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

/* Analytics */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-tile{background:#fff;border-radius:var(--radius-md);padding:16px 16px 14px;box-shadow:var(--shadow-sm);}
.stat-tile .num{font-size:27px;font-weight:750;color:var(--forest-dark);letter-spacing:-.5px;}
.stat-tile .label{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:650;}
.dash-card{background:#fff;border-radius:var(--radius-lg);padding:18px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.dash-card h2{font-size:13.5px;margin:0 0 14px;color:var(--forest-dark);font-weight:700;text-transform:uppercase;}
.dist-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-bottom:10px;}
.dist-legend{display:flex;flex-wrap:wrap;gap:10px;}
.dist-legend .item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.dist-legend .sw{width:9px;height:9px;border-radius:3px;}
.epa-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.epa-row .name{font-size:13.5px;font-weight:650;flex:0 0 84px;}
.epa-row .bar-track{flex:1;background:#EFEDE4;border-radius:99px;height:8px;overflow:hidden;}
.epa-row .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--forest-soft),var(--forest-dark));}
.epa-row .count{font-size:12px;color:var(--ink-soft);font-weight:650;flex:0 0 54px;text-align:right;}
.assistant-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F2F0E8;}
.assistant-row:last-child{border-bottom:none;}
.avatar{width:37px;height:37px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:750;flex-shrink:0;}
.assistant-info{flex:1;min-width:0;}
.assistant-name{font-size:13.5px;font-weight:650;}
.assistant-epa{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.mini-track{background:#EFEDE4;border-radius:99px;height:5px;overflow:hidden;margin-top:5px;}
.mini-fill{height:100%;border-radius:99px;background:var(--forest-soft);}
.assistant-pct{font-size:12px;font-weight:750;color:var(--forest-dark);}

#fab{position:fixed;bottom:calc(var(--navh) + 20px);right:calc(50% - 280px + 18px);background:var(--gold);color:var(--forest-dark);

.today-stat{background:#fff;border-radius:var(--radius-md);padding:13px 6px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
.today-stat .num{font-size:20px;font-weight:750;color:var(--forest-dark);line-height:1.1;}
.today-stat .lbl{font-size:9.5px;color:var(--ink-soft);font-weight:700;margin-top:3px;text-transform:uppercase;letter-spacing:.2px;}
.today-stat.warn .num{color:var(--obs-issue);}

.attn-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent,var(--ink-faint));border-radius:var(--radius-md);

  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.attn-card .attn-tag{display:block;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.3px;color:var(--accent,var(--ink-soft));margin-bottom:2px;}

mark{background:var(--gold-soft);color:var(--ink);border-radius:3px;padding:0 2px;}

function startListeners() {
  let pendingFlags = { sites: false, checkins: false, observations: false };

  const u1 = onSnapshot(collection(db, "sites"), (snap) => {
    sites = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    pendingFlags.sites = snap.metadata.hasPendingWrites;
    updateSyncPill(snap, pendingFlags);
    render();
  });
  const u2 = onSnapshot(query(collection(db, "checkins"), orderBy("order")), (snap) => {
    checkins = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    pendingFlags.checkins = snap.metadata.hasPendingWrites;
    updateSyncPill(snap, pendingFlags);
    render();
  });
  const u3 = onSnapshot(collection(db, "observations"), (snap) => {
    observations = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    pendingFlags.observations = snap.metadata.hasPendingWrites;
    updateSyncPill(snap, pendingFlags);
    render();
  });
  unsubs = [u1, u2, u3];
}

function setSyncText(text, cls) {

function updateSyncPill(snap, flags) {
  if (!navigator.onLine) { setSyncText("Offline — changes queued", "offline"); return; }
  const anyPending = flags.sites || flags.checkins || flags.observations;
  const anyFromCache = snap.metadata.fromCache;
  if (anyPending) setSyncText("Saving…", "");
  else if (anyFromCache) setSyncText("Loaded from cache", "");
  else setSyncText("Synced", "synced");

function siteById(id) { return sites.find((s) => s.id === id) || { id, name: id, epa: "", assistant: "", nurseryId: "", potfillingTarget: null, nmName: "", nmPhone: "", lat: null, lng: null }; }
function checkinsForSite(siteId) { return checkins.filter((c) => c.siteId === siteId).sort((a, b) => (b.week - a.week) || DAY_ORDER.indexOf(b.day) - DAY_ORDER.indexOf(a.day)); }
function observationsForCheckin(checkinId) { return observations.filter((o) => o.checkinId === checkinId).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); }
function observationsForSite(siteId) { return observations.filter((o) => o.siteId === siteId).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); }
function fmtWhen(ts) { if (!ts || !ts.seconds) return "Just now"; return new Date(ts.seconds * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }

/* "12 min ago" style label for the activity feed. Falls back to a short date
   once something is more than a week old, since "9 days ago" is less useful
   than just seeing the date at that point. */
function relTime(ts) {
  if (!ts || !ts.seconds) return "Just now";
  const diffMs = Date.now() - ts.seconds * 1000;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "Just now";
  if (min < 60) return `${min} min ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} hr${hr === 1 ? "" : "s"} ago`;
  const day = Math.floor(hr / 24);
  if (day === 1) return "Yesterday";
  if (day < 7) return `${day} days ago`;
  return new Date(ts.seconds * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* --- Activity feed ---
   There's no dedicated event log in this data model, so the feed is built by
   reading three things as events: a note being created, an issue/follow-up
   being resolved, and a check-in being marked Completed. Resolving is the
   only observation "edit" that counts as a distinct event; other edits to a
   check-in (ticking a checklist box, changing notes) don't get their own
   entry, since `updatedAt` is overwritten by any edit and can't distinguish
   "just completed" from "checklist ticked five minutes later." */
function buildActivityFeed(limit) {
  const events = [];
  observations.forEach((o) => {
    if (o.createdAt?.seconds) {
      events.push({
        ts: o.createdAt.seconds, siteId: o.siteId, color: `var(--obs-${o.type})`,
        text: `<b>${OBS_LABEL[o.type] || o.type}</b> logged`,
      });
    }
    if (isTracked(o) && obsStatus(o) === "Resolved" && o.resolvedAt?.seconds) {
      events.push({
        ts: o.resolvedAt.seconds, siteId: o.siteId, color: "var(--status-completed-fg)",
        text: `<b>${OBS_LABEL[o.type]}</b> resolved`,
      });
    }
  });
  checkins.forEach((c) => {
    if (c.status === "Completed" && c.updatedAt?.seconds) {
      events.push({ ts: c.updatedAt.seconds, siteId: c.siteId, color: "var(--status-completed-fg)", text: "Visit completed" });
    }
  });
  events.sort((a, b) => b.ts - a.ts);
  return events.slice(0, limit || 10);
}

/* --- Risk ---
   Flags sites worth a second look. Each factor is independent and cheap to
   explain; the score is just how many fired, so "two problems" outranks
   "one problem" without pretending to be a precise model. */
const STALE_VISIT_DAYS = 21;
function computeSiteRisk() {
  const iso = todayISO();
  return sites.filter((s) => s.id !== "n-a").map((s) => {
    const history = checkinsForSite(s.id);
    const datedVisits = history.filter((c) => c.date).sort((a, b) => b.date.localeCompare(a.date));
    const allIssuesForSite = observations.filter((o) => o.siteId === s.id && o.type === "issue");
    const factors = [];

    if (openIssuesForSite(s.id).length) factors.push({ key: "issue", label: `${openIssuesForSite(s.id).length} open issue${openIssuesForSite(s.id).length === 1 ? "" : "s"}` });

    const overdueFup = observations.some((o) => o.siteId === s.id && o.type === "followUp" && isUnresolved(o) && isDueOrOverdue(o));
    if (overdueFup) factors.push({ key: "followup", label: "Follow-up overdue" });

    if (!history.length) {
      factors.push({ key: "never", label: "Never visited" });
    } else if (datedVisits.length) {
      const daysSince = Math.floor((new Date(iso) - new Date(datedVisits[0].date)) / 86400000);
      if (daysSince > STALE_VISIT_DAYS) factors.push({ key: "stale", label: `No visit in ${daysSince}d` });
    }

    if (allIssuesForSite.length >= 3) factors.push({ key: "repeat", label: `${allIssuesForSite.length} issues logged (recurring)` });

    return { site: s, factors, score: factors.length };
  }).filter((r) => r.score > 0).sort((a, b) => b.score - a.score);
}

/* --- Issue / follow-up lifecycle ---
   Notes created before this feature existed have no status field. Treating a
   missing status as "Open" keeps old issues visible rather than silently
   counting them as done. */
function isTracked(o) { return TRACKED_TYPES.includes(o.type); }
function obsStatus(o) { return isTracked(o) ? (o.status || "Open") : null; }
function isUnresolved(o) { return isTracked(o) && obsStatus(o) !== "Resolved"; }
function openIssuesForSite(siteId) { return observations.filter((o) => o.siteId === siteId && o.type === "issue" && isUnresolved(o)); }
function openFollowUps() { return observations.filter((o) => o.type === "followUp" && isUnresolved(o)); }
function isDueOrOverdue(o) { return !!o.dueDate && o.dueDate <= todayISO(); }

/* --- Check-in timing ---
   A check-in only counts as overdue if it carries a real date. Undated
   check-ins are schedule placeholders, not missed visits. */
function isToday(c) { return !!c.date && c.date === todayISO(); }
function isOverdue(c) { return !!c.date && c.date < todayISO() && c.status === "Pending"; }
function checkinsToday() { return checkins.filter(isToday); }
function overdueCheckins() { return checkins.filter(isOverdue).sort((a, b) => a.date.localeCompare(b.date)); }

/* Every field assistant known to the data, for assignment pickers. Reads from
   Firestore sites first so it stays right as the directory changes. */
function allAssistants() {
  const fromSites = sites.map((s) => s.assistant);
  const fromCheckins = checkins.map((c) => c.assistant);
  return [...new Set([...fromSites, ...fromCheckins].filter((a) => a && a !== "N/A"))].sort();
}

/* 9) MUTATIONS */
async function saveCheckin(id, patch) { await updateDoc(doc(db, "checkins", id), { ...patch, updatedAt: serverTimestamp() }); }
async function createCheckin(data) {
  const maxOrder = checkins.reduce((m, c) => Math.max(m, c.order ?? 0), -1);
  await addDoc(collection(db, "checkins"), { ...data, order: maxOrder + 1, updatedAt: serverTimestamp() });
}
async function removeCheckin(id) { await deleteDoc(doc(db, "checkins", id)); }
async function addObservation(siteId, checkinId, type, text, meta) {
  const record = {
    siteId, checkinId: checkinId || null, type, text,
    author: auth.currentUser?.email || "Unknown", createdAt: serverTimestamp(),
  };
  /* Only issues and follow-ups get a lifecycle. Attaching a status to a plain
     observation would make it look actionable when it isn't. */
  if (TRACKED_TYPES.includes(type)) {
    record.status = "Open";
    record.assignedTo = (meta && meta.assignedTo) || "";
    record.dueDate = (meta && meta.dueDate) || "";
    record.resolvedAt = null;
    record.resolvedBy = "";
  }
  await addDoc(collection(db, "observations"), record);
}
async function setObservationStatus(id, status) {
  const patch = { status, updatedAt: serverTimestamp() };
  if (status === "Resolved") {
    patch.resolvedAt = serverTimestamp();
    patch.resolvedBy = auth.currentUser?.email || "Unknown";
  } else {
    patch.resolvedAt = null;
    patch.resolvedBy = "";
  }
  await updateDoc(doc(db, "observations", id), patch);
}

document.getElementById("sheet-backdrop").addEventListener("click", (e) => { if (e.target.id === "sheet-backdrop") closeSheet(); });

/* Single source of truth for FAB visibility: visible only on Today/Schedule,
   and only when no full-screen overlay is covering it. Called from every
   place that opens or closes an overlay, instead of each one re-deriving
   this condition (and risking them drifting out of sync). */
function updateFab() {

/* 11b) TODAY SCREEN
   Answers the one question the app is opened to answer in the field:
   what do I need to deal with right now? */
function renderToday() {
  const el = document.getElementById("screen-today");
  const iso = todayISO();
  const mine = checkinsToday();
  const done = mine.filter((c) => c.status === "Completed").length;
  const pending = mine.filter((c) => c.status === "Pending").length;
  const overdue = overdueCheckins();
  const dueFollowUps = openFollowUps().filter(isDueOrOverdue)
    .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
  const openIssues = observations.filter((o) => o.type === "issue" && isUnresolved(o))
    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

  /* Most urgent first: a missed visit blocks today's plan, a due follow-up is
     time-bound, an open issue is important but not necessarily dated. */
  const attention = [
    ...overdue.slice(0, 5).map((c) => ({
      kind: "overdue", siteId: c.siteId, accent: "var(--obs-issue)", accentBg: "var(--status-skipped-bg)",
      icon: "triangle-alert", tag: "Visit overdue",
      title: siteById(c.siteId).name,
      sub: `${esc(c.purpose || "Visit")} · was due ${fmtShortDate(c.date)} · ${esc(c.assistant || "Unassigned")}`,
    })),
    ...dueFollowUps.slice(0, 5).map((o) => ({
      kind: "followUp", siteId: o.siteId, accent: "var(--obs-followUp)", accentBg: "var(--status-pending-bg)",
      icon: "clock", tag: o.dueDate < iso ? "Follow-up overdue" : "Follow-up due today",
      title: siteById(o.siteId).name,
      sub: esc(o.text) + (o.assignedTo ? ` · ${esc(o.assignedTo)}` : ""),
    })),
    ...openIssues.slice(0, 5).map((o) => ({
      kind: "issue", siteId: o.siteId, accent: "var(--obs-issue)", accentBg: "var(--status-skipped-bg)",
      icon: "circle-alert", tag: obsStatus(o) === "In Progress" ? "Issue in progress" : "Issue unresolved",
      title: siteById(o.siteId).name,
      sub: esc(o.text) + (o.assignedTo ? ` · ${esc(o.assignedTo)}` : ""),
    })),
  ];

  const weekItems = checkins.filter((c) => c.week === selectedWeek);
  const weekDone = weekItems.filter((c) => c.status === "Completed").length;
  const weekPct = weekItems.length ? Math.round((weekDone / weekItems.length) * 100) : 0;
  const activity = buildActivityFeed(8);

  el.innerHTML = `
    <div class="today-hero">
      <div class="today-greet headline">${greeting()}</div>
      <div class="today-date">${esc(fmtLongDate(iso))}</div>
    </div>

    <div class="today-stats">
      <div class="today-stat"><div class="num">${mine.length}</div><div class="lbl">Today</div></div>
      <div class="today-stat"><div class="num">${done}</div><div class="lbl">Done</div></div>
      <div class="today-stat"><div class="num">${pending}</div><div class="lbl">Pending</div></div>
      <div class="today-stat ${overdue.length ? "warn" : ""}"><div class="num">${overdue.length}</div><div class="lbl">Overdue</div></div>
    </div>

    ${mine.length ? `
      <div class="sec-title">Today's visits</div>
      ${mine.map(renderCheckinCard).join("")}
    ` : `
      <div class="sec-title">Today's visits</div>
      <div class="empty-state" style="padding:26px 20px;">
        No visits dated today.${checkins.length ? " Set a date on a check-in to see it here." : ""}
      </div>
    `}

    <div class="sec-title">Needs your attention</div>
    ${attention.length ? attention.map((a) => `
      <button class="attn-card" data-site="${esc(a.siteId)}" style="--accent:${a.accent};--accent-bg:${a.accentBg}">
        <span class="attn-icon">${icon(a.icon, 16)}</span>
        <span class="attn-body">
          <span class="attn-tag">${esc(a.tag)}</span>
          <span class="attn-title">${esc(a.title)}</span>
          <span class="attn-sub">${a.sub}</span>
        </span>
        ${icon("chevron-right", 16)}
      </button>`).join("")
    : `<div class="all-clear">${icon("badge-check", 18)} Nothing outstanding. You're clear.</div>`}

    ${weekItems.length ? `
      <div class="sec-title">Week ${selectedWeek} progress</div>
      <div class="week-progress">
        <div class="wp-top">
          <span class="wp-num">${weekDone} / ${weekItems.length} visits</span>
          <span class="wp-pct">${weekPct}%</span>
        </div>
        <div class="wp-track"><div class="wp-fill" style="width:${weekPct}%"></div></div>
      </div>` : ""}

    ${activity.length ? `
      <div class="sec-title">Recent activity</div>
      <div class="dash-card" style="padding:4px 16px;">
        ${activity.map((ev) => `
          <button class="activity-item" data-site="${esc(ev.siteId)}">
            <span class="activity-dot" style="background:${ev.color}"></span>
            <span class="activity-body">
              <span class="activity-line">${esc(siteById(ev.siteId).name)} · ${ev.text}</span>
              <span class="activity-time">${esc(relTime({ seconds: ev.ts }))}</span>
            </span>
          </button>`).join("")}
      </div>` : ""}
  `;

  el.querySelectorAll(".attn-card, .activity-item").forEach((c) =>
    c.addEventListener("click", () => openSiteProfile(c.dataset.site)));
  wireCardEvents(el);
}

/* 12) SCHEDULE SCREEN */
function renderSchedule() {
  const el = document.getElementById("screen-schedule");
  if (!checkins.length) { el.innerHTML = '<div class="empty-state">No check-ins yet. Tap + to add one.</div>'; return; }

  const weeks = [...new Set(checkins.map((c) => c.week))].sort((a, b) => a - b);
  if (!weeks.includes(selectedWeek)) selectedWeek = weeks[0];

  const stripHtml = weeks.map((w) => {
    const items = checkins.filter((c) => c.week === w);
    const done = items.filter((c) => c.status === "Completed").length;
    const pct = items.length ? Math.round((done / items.length) * 100) : 0;
    return `
      <button class="week-chip ${w === selectedWeek ? "active" : ""}" data-week="${w}">
        <div class="wk-label">WEEK ${w}</div>
        <div class="wk-count">${done}/${items.length}</div>
        <div class="wk-track"><div class="wk-fill" style="width:${pct}%"></div></div>
      </button>`;
  }).join("");

  const weekItems = checkins.filter((c) => c.week === selectedWeek);
  const byDay = {};
  weekItems.forEach((c) => { (byDay[c.day] = byDay[c.day] || []).push(c); });
  const dayNames = Object.keys(byDay).sort((a, b) => DAY_ORDER.indexOf(a) - DAY_ORDER.indexOf(b));

  el.innerHTML = `
    <div id="week-strip">${stripHtml}</div>
    ${dayNames.map((d) => `
      <div class="day-label">${esc(d)}</div>
      ${byDay[d].map(renderCheckinCard).join("")}
    `).join("")}
  `;
  el.querySelectorAll(".week-chip").forEach((c) => c.addEventListener("click", () => { selectedWeek = Number(c.dataset.week); renderSchedule(); }));
  wireCardEvents(el);
}

          ${OBS_TYPES.map((t) => `<button class="type-chip ${noteDraftType === t ? "active" : ""}" data-type="${t}" style="${noteDraftType === t ? `background:var(--obs-${t})` : ""}">${OBS_LABEL[t]}</button>`).join("")}
        </div>
        <textarea data-role="note-text" placeholder="${esc(placeholder)}">${esc(noteDraftMeta.text || "")}</textarea>
        ${needsMeta ? `
          <div class="composer-extra">
            <div>
              <div class="mini-label">Assign to</div>
              <button class="picker-btn ${noteDraftMeta.assignedTo ? "" : "placeholder"}" data-role="assign-picker" type="button">

              </button>
            </div>
            <div>
              <div class="mini-label">Due date${noteDraftType === "issue" ? " (optional)" : ""}</div>

            </div>
          </div>` : ""}

      </div>
    ` : `<button class="picker-btn" data-role="open-composer" style="margin-top:8px;"><span>${icon("plus", 15)} Add a note</span></button>`}

/* Wires one notes panel. Used by both the schedule card drawer and the site
   profile history, so the two stay in step. `rerender` is whichever render
   function owns the surrounding screen. */
function wireNotesPanel(notesPanel, c, rerender) {
  if (!notesPanel) return;

  notesPanel.querySelectorAll('[data-role="obs-status"]').forEach((row) => {
    const obsId = row.closest(".obs-entry").dataset.obs;
    row.querySelectorAll(".obs-status-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const current = observations.find((o) => o.id === obsId);
        if (current && obsStatus(current) === btn.dataset.status) return;
        await setObservationStatus(obsId, btn.dataset.status);
      });
    });
  });

  const openBtn = notesPanel.querySelector('[data-role="open-composer"]');
  if (openBtn) openBtn.addEventListener("click", () => {
    noteComposerFor = c.id;
    noteDraftType = "observation";
    noteDraftMeta = { assignedTo: "", dueDate: "", text: "" };
    rerender();
  });

  const textarea = notesPanel.querySelector('[data-role="note-text"]');
  /* Keep the typed text in state so switching note type or picking an
     assignee doesn't wipe what's already been written. */
  if (textarea) textarea.addEventListener("input", () => { noteDraftMeta.text = textarea.value; });

  const chips = notesPanel.querySelector('[data-role="type-chips"]');
  if (chips) chips.querySelectorAll(".type-chip").forEach((chip) =>
    chip.addEventListener("click", () => {
      noteDraftType = chip.dataset.type;
      if (!TRACKED_TYPES.includes(noteDraftType)) { noteDraftMeta.assignedTo = ""; noteDraftMeta.dueDate = ""; }
      rerender();
    }));

  const assignBtn = notesPanel.querySelector('[data-role="assign-picker"]');
  if (assignBtn) assignBtn.addEventListener("click", () => {
    const options = ["Unassigned", ...allAssistants()];
    openSheet("Assign to", options, noteDraftMeta.assignedTo || "Unassigned", (val) => {
      noteDraftMeta.assignedTo = val === "Unassigned" ? "" : val;
      rerender();
    });
  });

  const dueInput = notesPanel.querySelector('[data-role="due-date"]');
  if (dueInput) dueInput.addEventListener("input", () => { noteDraftMeta.dueDate = dueInput.value; });

  const saveNoteBtn = notesPanel.querySelector('[data-role="save-note"]');
  if (saveNoteBtn) saveNoteBtn.addEventListener("click", async () => {
    const text = (textarea ? textarea.value : "").trim();
    if (!text) return;
    await addObservation(c.siteId, c.id, noteDraftType, text, noteDraftMeta);
    noteComposerFor = null;
    noteDraftMeta = { assignedTo: "", dueDate: "", text: "" };
    rerender();
  });
}

  return `

function wireCardEvents(scope) {
  scope.querySelectorAll(".visit-card").forEach((card) => {
    const id = card.dataset.id;
    const c = checkins.find((x) => x.id === id);
    if (!c) return;

    card.querySelector('[data-role="open-site"]').addEventListener("click", () => openSiteProfile(c.siteId));

    card.querySelectorAll('[data-role="chk-toggle"]').forEach((btn) => {
      btn.addEventListener("click", async () => {
        const idx = Number(btn.dataset.idx);
        const arr = [...(c.checkedItems || c.checklistItems.map(() => false))];
        arr[idx] = !arr[idx];
        await saveCheckin(id, { checkedItems: arr });
      });
    });

    card.querySelectorAll(".status-pill").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const newStatus = btn.dataset.status;
        if (newStatus !== "Pending" && (!c.epa || !c.assistant || !c.siteId)) {
          alert("This check-in is missing EPA, Field Assistant or Site.");
          return;
        }
        await saveCheckin(id, { status: newStatus });
      });
    });

    card.querySelector('[data-role="toggle-edit"]').addEventListener("click", () => {
      if (openEditId === id) { openEditId = null; editDraft = null; }
      else { openEditId = id; editDraft = { ...c }; openDrawerId = null; }
      render();
    });
    card.querySelector('[data-role="toggle-drawer"]').addEventListener("click", () => {
      if (openDrawerId === id) { openDrawerId = null; noteComposerFor = null; }
      else { openDrawerId = id; openEditId = null; editDraft = null; }
      render();
    });

    if (openDrawerId === id) {
      wireNotesPanel(card.querySelector('[data-role="notes-panel"]'), c, render);
    }

    if (openEditId === id) wireEditForm(card.querySelector('[data-role="edit-panel"]'), id, c);
  });
}

/* Sites for a given assistant, preferring Firestore over the hardcoded
   REFERENCE map so a reassignment in the database shows up here. Falls back to
   REFERENCE only when Firestore hasn't loaded or knows nothing about them. */
function sitesForAssistant(assistant) {
  if (!assistant) return [];
  const fromDb = sites.filter((s) => s.assistant === assistant && s.id !== "n-a").map((s) => s.name);
  if (fromDb.length) return fromDb.sort((a, b) => a.localeCompare(b));
  return REFERENCE.sitesByFa[assistant] || [];
}
function assistantsForEpa(epa) {
  if (!epa) return [];
  const fromDb = [...new Set(sites.filter((s) => s.epa === epa && s.assistant && s.assistant !== "N/A").map((s) => s.assistant))];
  if (fromDb.length) return fromDb.sort((a, b) => a.localeCompare(b));
  return REFERENCE.faByEpa[epa] || [];
}

/* One wiring routine for both the inline edit drawer and the full Add screen.
   `draft` is mutated in place; `opts` decides what save and the secondary
   button actually do. */
function wireDraftForm(panelInner, draft, opts) {
  const mode = opts.mode || "edit";
  function refresh() {
    panelInner.innerHTML = renderEditFormBody(draft, mode);
    wireDraftForm(panelInner, draft, opts);
  }

  panelInner.querySelector('[data-role="day-seg"]').querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { draft.day = b.dataset.value; refresh(); }));

  panelInner.querySelector('[data-role="epa-seg"]').querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => {
      draft.epa = b.dataset.value;
      const faList = assistantsForEpa(draft.epa);
      /* Clear rather than auto-pick: a silently chosen assistant is how the
         old + button produced check-ins nobody meant to create. */
      if (!faList.includes(draft.assistant)) { draft.assistant = ""; draft.siteId = ""; }
      refresh();
    }));

  panelInner.querySelector('[data-role="fa-picker"]').addEventListener("click", () => {
    const faList = assistantsForEpa(draft.epa);
    if (!faList.length) { alert("Pick an EPA first."); return; }
    openSheet("Field Assistant", faList, draft.assistant, (val) => {
      draft.assistant = val;
      const siteList = sitesForAssistant(val);
      if (!siteList.includes(draft.siteId ? siteById(draft.siteId).name : "")) draft.siteId = "";
      refresh();
    });
  });
  panelInner.querySelector('[data-role="site-picker"]').addEventListener("click", () => {
    const siteList = sitesForAssistant(draft.assistant);
    if (!siteList.length) { alert("Pick a field assistant first."); return; }
    const currentName = draft.siteId ? siteById(draft.siteId).name : "";
    openSheet("Site", siteList, currentName, (val) => { draft.siteId = slugify(val); refresh(); });
  });
  panelInner.querySelector('[data-role="purpose-picker"]').addEventListener("click", () => {
    openSheet("Visit Purpose", REFERENCE.purposes, draft.purpose, (val) => {
      draft.purpose = val;
      const items = PURPOSE_CHECKLIST[val] || [];
      draft.checklistItems = items; draft.checkedItems = items.map(() => false);
      refresh();
    });
  });
  panelInner.querySelectorAll("[data-field]").forEach((f) =>
    f.addEventListener("input", () => { draft[f.dataset.field] = f.dataset.field === "week" ? Number(f.value) : f.value; }));

  panelInner.querySelector('[data-role="save-btn"]').addEventListener("click", () => opts.onSave(draft, refresh));
  panelInner.querySelector('[data-role="delete-btn"]').addEventListener("click", () => opts.onSecondary(draft));
}

function wireEditForm(panelInner, id, checkin) {
  wireDraftForm(panelInner, editDraft, {
    mode: "edit",
    onSave: async (draft) => {
      const patch = { ...draft }; delete patch.id;
      await saveCheckin(id, patch);
      openEditId = null; editDraft = null; render();
    },
    onSecondary: async () => {
      if (!confirm("Delete this check-in? Its logged notes will remain in the site's history.")) return;
      await removeCheckin(id);
      openEditId = null; editDraft = null;
    },
  });
}

/* 14) SITES & TEAM SCREEN */
let siteSearch = "";
let siteFilterEpa = "All";
/* Highlights the matched substring without ever putting raw user text into
   the DOM: escape first, then wrap the match. */
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const safeQ = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(safeQ, "ig"), (m) => `<mark>${m}</mark>`);
}

function renderSitesTeam() {
  const el = document.getElementById("screen-sites");
  const epaOptions = ["All", ...REFERENCE.epas.filter((e) => e !== "Office")];
  const q = siteSearch.trim().toLowerCase();

  let filtered = sites.filter((s) => s.id !== "n-a");
  if (siteFilterEpa !== "All") filtered = filtered.filter((s) => s.epa === siteFilterEpa);
  if (q) {
    filtered = filtered.filter((s) =>
      (s.name || "").toLowerCase().includes(q) ||
      (s.nurseryId || "").toLowerCase().includes(q) ||
      (s.assistant || "").toLowerCase().includes(q) ||
      (s.nmName || "").toLowerCase().includes(q) ||
      (s.epa || "").toLowerCase().includes(q));
  }
  filtered.sort((a, b) => a.name.localeCompare(b.name));

  /* Notes matter as much as sites here: three weeks later you remember what
     you wrote, not which check-in you wrote it on. */
  let noteHits = [];
  let visitHits = [];
  if (q) {
    noteHits = observations.filter((o) => {
      if (siteFilterEpa !== "All" && siteById(o.siteId).epa !== siteFilterEpa) return false;
      return (o.text || "").toLowerCase().includes(q) ||
             (o.assignedTo || "").toLowerCase().includes(q) ||
             (o.author || "").toLowerCase().includes(q) ||
             (OBS_LABEL[o.type] || "").toLowerCase().includes(q) ||
             (obsStatus(o) || "").toLowerCase().includes(q);
    }).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).slice(0, 25);

    visitHits = checkins.filter((c) => {
      if (siteFilterEpa !== "All" && c.epa !== siteFilterEpa) return false;
      return (c.purpose || "").toLowerCase().includes(q) ||
             (c.checklistItems || []).join(" ").toLowerCase().includes(q) ||
             (c.date || "").includes(q);
    }).slice(0, 15);
  }

  const totalHits = filtered.length + noteHits.length + visitHits.length;

  el.innerHTML = `
    <div class="search-bar">${icon("search", 16)}<input id="site-search-input" placeholder="Search sites, staff, notes, issues…" value="${esc(siteSearch)}"></div>
    <div class="pill-row">${epaOptions.map((e) => `<button class="filter-pill ${siteFilterEpa === e ? "active" : ""}" data-epa="${esc(e)}">${esc(e)}</button>`).join("")}</div>

    ${q && totalHits === 0 ? `<div class="empty-state">Nothing matches “${esc(siteSearch.trim())}”.</div>` : ""}

    ${filtered.length ? `
      <div class="sec-title">${filtered.length} site${filtered.length === 1 ? "" : "s"}</div>
      ${filtered.map((s) => {
        const epaClass = EPA_CLASS[s.epa] || "office";
        const issues = openIssuesForSite(s.id).length;
        return `
          <button class="site-row" data-site="${s.id}">
            <span class="dot" style="background:var(--epa-${epaClass}-dot)"></span>
            <div class="info">
              <div class="name">${highlight(s.name, q)}</div>
              <div class="meta">
                <span>${highlight(s.assistant || "", q)}</span>
                ${s.nurseryId ? `<span class="mono">${highlight(s.nurseryId, q)}</span>` : ""}
                ${issues ? `<span class="issue-flag">${icon("triangle-alert", 12)} ${issues}</span>` : ""}
              </div>
            </div>
            ${icon("chevron-right", 17)}
          </button>`;
      }).join("")}` : ""}

    ${noteHits.length ? `
      <div class="sec-title">${noteHits.length} note${noteHits.length === 1 ? "" : "s"} &amp; issues</div>
      ${noteHits.map((o) => {
        const st = obsStatus(o);
        return `
          <button class="res-card" data-site="${esc(o.siteId)}">
            <span class="res-dot" style="background:var(--obs-${o.type})"></span>
            <span class="res-body">
              <span class="res-head">
                <span class="res-site">${esc(siteById(o.siteId).name)}</span>
                <span class="res-type" style="color:var(--obs-${o.type})">${OBS_LABEL[o.type] || o.type}</span>
                ${st ? `<span class="obs-status-btn ${OBS_STATUS_CLASS[st]}" style="pointer-events:none;">${esc(st)}</span>` : ""}
              </span>
              <span class="res-text">${highlight(o.text || "", q)}</span>
              <span class="res-meta">${esc(o.author || "")} · ${fmtWhen(o.createdAt)}${
                o.assignedTo ? ` · ${esc(o.assignedTo)}` : ""}${
                o.dueDate ? ` · due ${esc(fmtShortDate(o.dueDate))}` : ""}</span>
            </span>
          </button>`;
      }).join("")}` : ""}

    ${visitHits.length ? `
      <div class="sec-title">${visitHits.length} check-in${visitHits.length === 1 ? "" : "s"}</div>
      ${visitHits.map((c) => `
        <button class="res-card" data-site="${esc(c.siteId)}">
          <span class="res-dot" style="background:var(--epa-${EPA_CLASS[c.epa] || "office"}-dot)"></span>
          <span class="res-body">
            <span class="res-head">
              <span class="res-site">${esc(siteById(c.siteId).name)}</span>
              <span class="res-type" style="color:var(--ink-faint)">Week ${c.week} · ${esc(c.day || "")}</span>
            </span>
            <span class="res-text">${highlight(c.purpose || "", q)}</span>
            <span class="res-meta">${esc(c.assistant || "")}${c.date ? ` · ${esc(fmtShortDate(c.date))}` : ""} · ${esc(c.status || "Pending")}</span>
          </span>
        </button>`).join("")}` : ""}
  `;

  const input = el.querySelector("#site-search-input");
  input.addEventListener("input", (e) => {
    siteSearch = e.target.value;
    renderSitesTeam();
    /* Re-rendering replaces the input, so restore focus and caret to keep
       typing uninterrupted. */
    const next = document.getElementById("site-search-input");
    next.focus();
    next.setSelectionRange(next.value.length, next.value.length);
  });
  el.querySelectorAll(".filter-pill").forEach((p) => p.addEventListener("click", () => { siteFilterEpa = p.dataset.epa; renderSitesTeam(); }));
  el.querySelectorAll(".site-row").forEach((r) => r.addEventListener("click", () => openSiteProfile(r.dataset.site)));
  el.querySelectorAll(".res-card").forEach((r) => r.addEventListener("click", () => openSiteProfile(r.dataset.site)));
}

/* 15) ANALYTICS SCREEN */
function renderAnalytics() {
  const el = document.getElementById("screen-analytics");
  if (!checkins.length) { el.innerHTML = '<div class="empty-state">Nothing to summarize yet.</div>'; return; }

  const total = checkins.length;
  const completed = checkins.filter((c) => c.status === "Completed").length;
  const pct = total ? Math.round((completed / total) * 100) : 0;
  const allIssues = observations.filter((o) => o.type === "issue");
  const openIssues = allIssues.filter((o) => obsStatus(o) === "Open").length;
  const inProgIssues = allIssues.filter((o) => obsStatus(o) === "In Progress").length;
  const resolvedIssues = allIssues.filter((o) => obsStatus(o) === "Resolved").length;
  const dueFups = openFollowUps().filter(isDueOrOverdue).length;
  const overdueVisits = overdueCheckins().length;

  const epaRows = REFERENCE.epas.map((epa) => {
    const items = checkins.filter((c) => c.epa === epa);
    const c = items.filter((v) => v.status === "Completed").length;
    return { epa, total: items.length, completed: c, pct: items.length ? Math.round((c / items.length) * 100) : 0, cls: EPA_CLASS[epa] };
  }).filter((r) => r.total > 0);

  const statusCounts = STATUSES.map((s) => ({ status: s, count: checkins.filter((c) => c.status === s).length }));
  const statusColorVar = { Pending: "--status-pending-fg", Completed: "--status-completed-fg", Rescheduled: "--status-rescheduled-fg", Skipped: "--status-skipped-fg" };

  const assistants = [...new Set(checkins.map((c) => c.assistant).filter((a) => a && a !== "N/A"))];
  const faRows = assistants.map((fa) => {
    const items = checkins.filter((c) => c.assistant === fa);
    const c = items.filter((v) => v.status === "Completed").length;
    const epa = items[0]?.epa || "";
    return { fa, epa, cls: EPA_CLASS[epa], total: items.length, pct: items.length ? Math.round((c / items.length) * 100) : 0 };
  });

  const risk = computeSiteRisk();
  const riskBadgeIcon = { issue: "circle-alert", followup: "clock", stale: "calendar", never: "map-pin", repeat: "repeat" };

  el.innerHTML = `
    <button class="report-btn" data-role="open-report">${icon("file-text", 17)} Generate weekly report</button>
    <div class="stat-grid">
      <div class="stat-tile"><div class="num">${total}</div><div class="label">Total check-ins</div></div>
      <div class="stat-tile"><div class="num">${pct}%</div><div class="label">Completed</div></div>
      <div class="stat-tile"><div class="num" style="${openIssues ? "color:var(--obs-issue)" : ""}">${openIssues}</div><div class="label">Open issues</div></div>
      <div class="stat-tile"><div class="num">${sites.filter(s=>s.id!=="n-a").length}</div><div class="label">Sites tracked</div></div>
      <div class="stat-tile"><div class="num" style="${overdueVisits ? "color:var(--obs-issue)" : ""}">${overdueVisits}</div><div class="label">Overdue visits</div></div>
      <div class="stat-tile"><div class="num" style="${dueFups ? "color:var(--obs-followUp)" : ""}">${dueFups}</div><div class="label">Follow-ups due</div></div>
    </div>
    <div class="dash-card">
      <h2>Sites needing attention</h2>
      ${risk.length ? risk.slice(0, 8).map((r) => `
        <button class="risk-row" data-site="${esc(r.site.id)}">
          <span class="risk-body">
            <span class="risk-name">${esc(r.site.name)}</span>
            <span class="risk-badges">
              ${r.factors.map((f) => `<span class="risk-badge ${f.key}">${icon(riskBadgeIcon[f.key], 10)}${esc(f.label)}</span>`).join("")}
            </span>
          </span>
          ${icon("chevron-right", 16)}
        </button>`).join("") : `<div class="risk-empty">${icon("badge-check", 15)} No sites flagged right now.</div>`}
    </div>
    ${allIssues.length ? `
    <div class="dash-card">
      <h2>Issue lifecycle</h2>
      <div class="dist-bar">
        ${openIssues ? `<div style="width:${openIssues / allIssues.length * 100}%;background:var(--status-skipped-fg)"></div>` : ""}
        ${inProgIssues ? `<div style="width:${inProgIssues / allIssues.length * 100}%;background:var(--status-pending-fg)"></div>` : ""}
        ${resolvedIssues ? `<div style="width:${resolvedIssues / allIssues.length * 100}%;background:var(--status-completed-fg)"></div>` : ""}
      </div>
      <div class="dist-legend">
        <span class="item"><span class="sw" style="background:var(--status-skipped-fg)"></span>Open (${openIssues})</span>
        <span class="item"><span class="sw" style="background:var(--status-pending-fg)"></span>In progress (${inProgIssues})</span>
        <span class="item"><span class="sw" style="background:var(--status-completed-fg)"></span>Resolved (${resolvedIssues})</span>
      </div>
    </div>` : ""}
    <div class="dash-card">
      <h2>Status distribution</h2>
      <div class="dist-bar">${statusCounts.map((r) => r.count ? `<div style="width:${(r.count/total*100)}%;background:var(${{Pending:"--status-pending-fg",Completed:"--status-completed-fg",Rescheduled:"--status-rescheduled-fg",Skipped:"--status-skipped-fg"}[r.status]})"></div>` : "").join("")}</div>
      <div class="dist-legend">${statusCounts.map((r) => `<span class="item"><span class="sw" style="background:var(${statusColorVar[r.status]})"></span>${r.status} (${r.count})</span>`).join("")}</div>
    </div>
    <div class="dash-card">
      <h2>EPA coverage</h2>
      ${epaRows.map((r) => `
        <div class="epa-row">
          <span class="dot" style="background:var(--epa-${r.cls}-dot)"></span>
          <span class="name">${esc(r.epa)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%"></div></div>
          <span class="count">${r.completed}/${r.total}</span>
        </div>`).join("")}
    </div>
    <div class="dash-card">
      <h2>Per-assistant progress</h2>
      ${faRows.map((r) => `
        <div class="assistant-row">
          <div class="avatar" style="background:var(--epa-${r.cls}-bg);color:var(--epa-${r.cls}-fg)">${initials(r.fa)}</div>
          <div class="assistant-info">
            <div class="assistant-name">${esc(r.fa)}</div>
            <div class="assistant-epa">${esc(r.epa)}</div>
            <div class="mini-track"><div class="mini-fill" style="width:${r.pct}%"></div></div>
          </div>
          <span class="assistant-pct">${r.pct}%</span>
        </div>`).join("")}
    </div>
  `;

  el.querySelector('[data-role="open-report"]').addEventListener("click", () => openReport());
  el.querySelectorAll(".risk-row").forEach((r) => r.addEventListener("click", () => openSiteProfile(r.dataset.site)));
}

/* 16) ADD CHECK-IN
   The old + button immediately wrote a check-in using the first EPA, first
   assistant and first site in the reference data, leaving the user to correct
   a record that already existed. This opens a form instead: week, day and date
   are prefilled from context, but who and where must be chosen deliberately. */
function openAddCheckin() {
  const today = todayISO();
  const dayName = todayDayName();
  addFormError = "";
  addDraft = {
    week: selectedWeek || 1,
    day: DAY_ORDER.includes(dayName) ? dayName : "Monday",
    date: today,
    epa: "", assistant: "", siteId: "", purpose: "",
    checklistItems: [], checkedItems: [], status: "Pending",
  };
  document.getElementById("add-checkin-screen").classList.remove("hidden");
  updateFab();
  renderAddCheckin();
}
function closeAddCheckin() {
  addDraft = null; addFormError = "";
  document.getElementById("add-checkin-screen").classList.add("hidden");
  updateFab();
}
function renderAddCheckin() {
  const el = document.getElementById("add-checkin-screen");
  if (!addDraft) return;
  el.innerHTML = `
    <div class="ac-top">
      <button class="ac-back" data-role="ac-back">${icon("chevron-left", 16)} Cancel</button>
      <div class="ac-title headline">Add check-in</div>
      <div class="ac-sub">Prefilled for ${esc(fmtLongDate(addDraft.date || todayISO()))}</div>
    </div>
    <div class="ac-body">
      <div class="ac-card"><div data-role="ac-form"></div></div>
    </div>
  `;
  const formHost = el.querySelector('[data-role="ac-form"]');
  formHost.innerHTML = renderEditFormBody(addDraft, "add");
  el.querySelector('[data-role="ac-back"]').addEventListener("click", closeAddCheckin);

  wireDraftForm(formHost, addDraft, {
    mode: "add",
    onSave: async (draft, refresh) => {
      const missing = [];
      if (!draft.epa) missing.push("EPA");
      if (!draft.assistant) missing.push("field assistant");
      if (!draft.siteId) missing.push("site");
      if (!draft.purpose) missing.push("visit purpose");
      if (missing.length) {
        addFormError = "Still needed: " + missing.join(", ") + ".";
        refresh();
        return;
      }
      addFormError = "";
      const payload = { ...draft };
      await createCheckin(payload);
      closeAddCheckin();
      render();
    },
    onSecondary: () => closeAddCheckin(),
  });
}
document.getElementById("fab").addEventListener("click", openAddCheckin);

/* 16b) WEEKLY REPORT
   Builds a report scoped to check-ins whose `week` field matches the chosen
   week, plus the observations logged against those specific check-ins. Notes
   are bucketed by which week's visit they were logged during, not by
   calendar date, because `date` is often blank and `week` is the one field
   every check-in reliably has. */
function weeksWithData() {
  return [...new Set(checkins.map((c) => c.week).filter((w) => typeof w === "number"))].sort((a, b) => a - b);
}
function buildReportData(week) {
  const weekCheckins = checkins.filter((c) => c.week === week);
  const weekIds = new Set(weekCheckins.map((c) => c.id));
  const weekObs = observations.filter((o) => weekIds.has(o.checkinId));

  const visitsPlanned = weekCheckins.length;
  const visitsCompleted = weekCheckins.filter((c) => c.status === "Completed").length;
  const visitsMissed = weekCheckins.filter((c) => c.status === "Skipped" || c.status === "Rescheduled").length;
  const sitesInvolved = [...new Set(weekCheckins.map((c) => c.siteId).filter((id) => id !== "n-a"))];
  const sitesCompleted = [...new Set(weekCheckins.filter((c) => c.status === "Completed").map((c) => c.siteId).filter((id) => id !== "n-a"))];

  const weekIssues = weekObs.filter((o) => o.type === "issue");
  const weekFollowUps = weekObs.filter((o) => o.type === "followUp");

  const byAssistant = {};
  weekCheckins.forEach((c) => {
    if (!c.assistant || c.assistant === "N/A") return;
    (byAssistant[c.assistant] ||= []).push(c);
  });
  const faRows = Object.entries(byAssistant).map(([fa, items]) => {
    const done = items.filter((c) => c.status === "Completed").length;
    return { fa, total: items.length, done, pct: items.length ? Math.round((done / items.length) * 100) : 0 };
  }).sort((a, b) => b.pct - a.pct);

  const byEpa = {};
  weekCheckins.forEach((c) => { (byEpa[c.epa] ||= []).push(c); });
  const epaRows = Object.entries(byEpa).map(([epa, items]) => {
    const done = items.filter((c) => c.status === "Completed").length;
    return { epa, total: items.length, done };
  });

  const notable = weekObs.filter((o) => o.type !== "observation")
    .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

  return {
    week, visitsPlanned, visitsCompleted, visitsMissed,
    sitesCovered: sitesCompleted.length, sitesInvolved: sitesInvolved.length,
    issuesLogged: weekIssues.length, issuesNowResolved: weekIssues.filter((o) => obsStatus(o) === "Resolved").length,
    followUpsLogged: weekFollowUps.length, followUpsOpen: weekFollowUps.filter(isUnresolved).length,
    faRows, epaRows, notable,
  };
}
function buildReportText(d) {
  const lines = [];
  lines.push(`SFO FIELD TRACKER — WEEK ${d.week} REPORT`);
  lines.push(`Generated ${fmtLongDate(todayISO())}`);
  lines.push("");
  lines.push(`Visits: ${d.visitsCompleted}/${d.visitsPlanned} completed${d.visitsMissed ? `, ${d.visitsMissed} missed/rescheduled` : ""}`);
  lines.push(`Sites covered: ${d.sitesCovered}/${d.sitesInvolved}`);
  lines.push(`Issues: ${d.issuesLogged} logged, ${d.issuesNowResolved} now resolved`);
  lines.push(`Follow-ups: ${d.followUpsLogged} logged, ${d.followUpsOpen} still open`);
  if (d.faRows.length) {
    lines.push("");
    lines.push("FIELD ASSISTANT PERFORMANCE");
    d.faRows.forEach((r) => lines.push(`  ${r.fa}: ${r.done}/${r.total} (${r.pct}%)`));
  }
  if (d.epaRows.length) {
    lines.push("");
    lines.push("EPA COVERAGE");
    d.epaRows.forEach((r) => lines.push(`  ${r.epa}: ${r.done}/${r.total}`));
  }
  if (d.notable.length) {
    lines.push("");
    lines.push("KEY OBSERVATIONS");
    d.notable.forEach((o) => lines.push(`  [${OBS_LABEL[o.type]}] ${siteById(o.siteId).name}: ${o.text}`));
  }
  return lines.join("\n");
}

function openReport() {
  const weeks = weeksWithData();
  reportWeek = weeks.includes(selectedWeek) ? selectedWeek : (weeks[weeks.length - 1] ?? 1);
  document.getElementById("report-screen").classList.remove("hidden");
  updateFab();
  renderReport();
}
function closeReport() {
  reportWeek = null;
  document.getElementById("report-screen").classList.add("hidden");
  updateFab();
}
function renderReport() {
  const el = document.getElementById("report-screen");
  if (reportWeek === null) return;
  const d = buildReportData(reportWeek);
  const weeks = weeksWithData();

  el.innerHTML = `
    <div class="rep-top">
      <button class="rep-back no-print" data-role="rep-back">${icon("chevron-left", 16)} Back</button>
      <div class="rep-title-row">
        <div class="rep-title headline">Weekly Report</div>
        <button class="rep-week-btn no-print" data-role="rep-week">Week ${d.week} ${icon("chevron-down", 13)}</button>
      </div>
      <div class="rep-actions no-print">
        <button data-role="rep-copy">${icon("copy", 14)} Copy as text</button>
        <button data-role="rep-print">${icon("printer", 14)} Print / Save PDF</button>
      </div>
    </div>
    <div class="rep-body">
      <div class="rep-card">
        <h3>Visits</h3>
        <div class="rep-stat-grid">
          <div class="rep-stat"><div class="num">${d.visitsPlanned}</div><div class="lbl">Planned</div></div>
          <div class="rep-stat"><div class="num">${d.visitsCompleted}</div><div class="lbl">Completed</div></div>
          <div class="rep-stat"><div class="num" style="${d.visitsMissed ? "color:var(--obs-issue)" : ""}">${d.visitsMissed}</div><div class="lbl">Missed</div></div>
        </div>
      </div>
      <div class="rep-card">
        <h3>Coverage &amp; lifecycle</h3>
        <div class="rep-row"><span>Sites covered</span><span class="rep-row-val">${d.sitesCovered} / ${d.sitesInvolved}</span></div>
        <div class="rep-row"><span>Issues logged</span><span class="rep-row-val">${d.issuesLogged}</span></div>
        <div class="rep-row"><span>Issues now resolved</span><span class="rep-row-val">${d.issuesNowResolved}</span></div>
        <div class="rep-row"><span>Follow-ups logged</span><span class="rep-row-val">${d.followUpsLogged}</span></div>
        <div class="rep-row"><span>Follow-ups still open</span><span class="rep-row-val">${d.followUpsOpen}</span></div>
      </div>
      ${d.faRows.length ? `
      <div class="rep-card">
        <h3>Field assistant performance</h3>
        ${d.faRows.map((r) => `<div class="rep-row"><span>${esc(r.fa)}</span><span class="rep-row-val">${r.done}/${r.total} (${r.pct}%)</span></div>`).join("")}
      </div>` : ""}
      ${d.epaRows.length ? `
      <div class="rep-card">
        <h3>EPA coverage</h3>
        ${d.epaRows.map((r) => `<div class="rep-row"><span>${esc(r.epa)}</span><span class="rep-row-val">${r.done}/${r.total}</span></div>`).join("")}
      </div>` : ""}
      <div class="rep-card">
        <h3>Key observations</h3>
        ${d.notable.length ? d.notable.map((o) => `
          <div class="rep-note">
            <div class="rn-head"><span class="rn-type" style="color:var(--obs-${o.type})">${OBS_LABEL[o.type]}</span><span>${esc(siteById(o.siteId).name)}</span></div>
            <div class="rn-text">${esc(o.text)}</div>
          </div>`).join("") : `<div class="rep-empty">No issues, actions, or follow-ups logged this week.</div>`}
      </div>
    </div>
  `;

  el.querySelector('[data-role="rep-back"]').addEventListener("click", closeReport);
  el.querySelector('[data-role="rep-week"]').addEventListener("click", () => {
    openSheet("Week", weeks.map((w) => `Week ${w}`), `Week ${d.week}`, (val) => {
      reportWeek = Number(val.replace("Week ", ""));
      renderReport();
    });
  });
  el.querySelector('[data-role="rep-copy"]').addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const original = btn.innerHTML;
    try {
      await navigator.clipboard.writeText(buildReportText(d));
      btn.innerHTML = `${icon("check", 14)} Copied`;
    } catch {
      btn.innerHTML = `${icon("x", 14)} Couldn't copy`;
    }
    setTimeout(() => { btn.innerHTML = original; }, 1800);
  });
  el.querySelector('[data-role="rep-print"]').addEventListener("click", () => window.print());
}

/* 17) INSTALL PROMPT + SERVICE WORKER */
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstallPrompt = e; document.getElementById("install-btn").style.display = "flex"; });
document.getElementById("install-btn").addEventListener("click", async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null; document.getElementById("install-btn").style.display = "none";
});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("service-worker.js").catch((err) => console.warn("SW registration failed:", err)); });
}
</script>
